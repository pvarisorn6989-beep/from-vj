<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>ระบบประเมินการเตรียมความพร้อมก่อนระงับความรู้สึก</title>
<meta name="description" content="ระบบบันทึก ประมวลผล และแสดงผล หนังสือยินยอม ข้อมูลทั่วไป แบบประเมินความวิตกกังวล ความมั่นใจ และแบบทดสอบความรู้ ของหญิงตั้งครรภ์ที่เข้ารับการผ่าตัดคลอดทางหน้าท้อง">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Chart.js (CDN) — ถ้าโหลดไม่ได้ ระบบจะแสดงผลเป็นตารางแทนกราฟโดยอัตโนมัติ -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" defer></script>
<style>
/* =====================================================================
 * DESIGN TOKENS — สี/ระยะ/เงา ทั้งระบบ (สีหลักของแบรนด์ถูกเขียนทับจาก CONFIG.THEME)
 * ===================================================================== */
:root{
  color-scheme: light;
  --font: "IBM Plex Sans Thai","Noto Sans Thai","Leelawadee UI","Sukhumvit Set",system-ui,-apple-system,"Segoe UI",sans-serif;
  --brand:#4f46e5; --brand-2:#0ea5e9;
  --brand-soft:color-mix(in srgb,var(--brand) 12%,transparent);
  --brand-soft-2:color-mix(in srgb,var(--brand) 22%,transparent);
  --brand-strong:color-mix(in srgb,var(--brand) 82%,#000);
  --ring:color-mix(in srgb,var(--brand) 45%,transparent);

  --bg:#f3f4fa; --bg-blob-1:color-mix(in srgb,var(--brand) 20%,transparent); --bg-blob-2:color-mix(in srgb,var(--brand-2) 18%,transparent);
  --glass:rgba(255,255,255,.66); --glass-strong:rgba(255,255,255,.86); --glass-border:rgba(255,255,255,.75);
  --card:rgba(255,255,255,.82); --card-solid:#ffffff; --surface-2:#f6f7fb; --surface-3:#eceef6; --field:#f7f8fc;
  --hairline:rgba(15,23,42,.08); --outline:rgba(15,23,42,.16);
  --text:#0f172a; --text-2:#475569; --text-3:#64748b;
  --shadow-1:0 1px 2px rgba(15,23,42,.05),0 4px 18px rgba(15,23,42,.06);
  --shadow-2:0 12px 40px rgba(15,23,42,.12);
  --shadow-3:0 24px 70px rgba(15,23,42,.22);
  --neu-out:5px 5px 12px rgba(163,177,198,.38),-5px -5px 12px rgba(255,255,255,.95);
  --neu-in:inset 3px 3px 7px rgba(163,177,198,.42),inset -3px -3px 7px rgba(255,255,255,.95);
  --good:#0ca30c; --good-text:#006300; --warn:#fab219; --warn-text:#8a5a00; --serious:#ec835a; --danger:#d03b3b; --danger-text:#b42318;
  --info-text:#1c5cab;
  --r-s:10px; --r:16px; --r-l:22px; --r-xl:30px;

  /* chart tokens (dataviz reference palette — validated light/dark steps) */
  --chart-surface:#ffffff; --grid:#e1e0d9; --axis:#c3c2b7; --ink-muted:#898781;
  --series-exp:#2a78d6; --series-ctl:#eb6834; --series-3:#1baf7a;
  --round-pre:#a8a69e; --round-post:#4a3aa7;
  --ord-1:#86b6ef; --ord-2:#5598e7; --ord-3:#2a78d6; --ord-4:#1c5cab; --ord-5:#104281;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --bg:#0b0d14; --bg-blob-1:color-mix(in srgb,var(--brand) 26%,transparent); --bg-blob-2:color-mix(in srgb,var(--brand-2) 18%,transparent);
    --glass:rgba(22,25,36,.62); --glass-strong:rgba(24,27,38,.9); --glass-border:rgba(255,255,255,.08);
    --card:rgba(24,27,38,.82); --card-solid:#171a24; --surface-2:#1c2030; --surface-3:#232838; --field:#1b1f2c;
    --hairline:rgba(255,255,255,.08); --outline:rgba(255,255,255,.18);
    --text:#eef0f6; --text-2:#b9bfd0; --text-3:#9aa1b5;
    --brand-soft:color-mix(in srgb,var(--brand) 22%,transparent); --brand-soft-2:color-mix(in srgb,var(--brand) 34%,transparent);
    --brand-strong:color-mix(in srgb,var(--brand) 55%,#fff);
    --shadow-1:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.25);
    --shadow-2:0 14px 44px rgba(0,0,0,.45); --shadow-3:0 24px 70px rgba(0,0,0,.6);
    --neu-out:4px 4px 10px rgba(0,0,0,.45),-3px -3px 9px rgba(255,255,255,.035);
    --neu-in:inset 3px 3px 7px rgba(0,0,0,.5),inset -2px -2px 6px rgba(255,255,255,.04);
    --good-text:#3ccf3c; --warn-text:#fab219; --danger-text:#ff8a80; --info-text:#86b6ef;
    --chart-surface:#171a24; --grid:#2c2c2a; --axis:#383835; --ink-muted:#898781;
    --series-exp:#3987e5; --series-ctl:#d95926; --series-3:#199e70;
    --round-pre:#6f6e68; --round-post:#9085e9;
    --ord-1:#184f95; --ord-2:#1c5cab; --ord-3:#2a78d6; --ord-4:#5598e7; --ord-5:#9ec5f4;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0b0d14; --bg-blob-1:color-mix(in srgb,var(--brand) 26%,transparent); --bg-blob-2:color-mix(in srgb,var(--brand-2) 18%,transparent);
  --glass:rgba(22,25,36,.62); --glass-strong:rgba(24,27,38,.9); --glass-border:rgba(255,255,255,.08);
  --card:rgba(24,27,38,.82); --card-solid:#171a24; --surface-2:#1c2030; --surface-3:#232838; --field:#1b1f2c;
  --hairline:rgba(255,255,255,.08); --outline:rgba(255,255,255,.18);
  --text:#eef0f6; --text-2:#b9bfd0; --text-3:#9aa1b5;
  --brand-soft:color-mix(in srgb,var(--brand) 22%,transparent); --brand-soft-2:color-mix(in srgb,var(--brand) 34%,transparent);
  --brand-strong:color-mix(in srgb,var(--brand) 55%,#fff);
  --shadow-1:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.25);
  --shadow-2:0 14px 44px rgba(0,0,0,.45); --shadow-3:0 24px 70px rgba(0,0,0,.6);
  --neu-out:4px 4px 10px rgba(0,0,0,.45),-3px -3px 9px rgba(255,255,255,.035);
  --neu-in:inset 3px 3px 7px rgba(0,0,0,.5),inset -2px -2px 6px rgba(255,255,255,.04);
  --good-text:#3ccf3c; --warn-text:#fab219; --danger-text:#ff8a80; --info-text:#86b6ef;
  --chart-surface:#171a24; --grid:#2c2c2a; --axis:#383835; --ink-muted:#898781;
  --series-exp:#3987e5; --series-ctl:#d95926; --series-3:#199e70;
  --round-pre:#6f6e68; --round-post:#9085e9;
  --ord-1:#184f95; --ord-2:#1c5cab; --ord-3:#2a78d6; --ord-4:#5598e7; --ord-5:#9ec5f4;
}

/* =====================================================================
 * BASE
 * ===================================================================== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:90px}
body{margin:0;font-family:var(--font);font-size:16px;line-height:1.65;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
h1,h2,h3,h4{line-height:1.3;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(1.45rem,1.1rem + 1.4vw,2.1rem);font-weight:700}
h2{font-size:1.3rem;font-weight:700}
h3{font-size:1.08rem;font-weight:600}
p{margin:0}
a{color:var(--brand-strong)}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px;border-radius:8px}
.ic{flex:none;display:inline-block;vertical-align:middle}
.muted{color:var(--text-3)}
.small{font-size:.875rem}
.num{font-variant-numeric:tabular-nums}
.nowrap{white-space:nowrap}

/* soft gradient mesh behind the glass */
.bg-mesh{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.bg-mesh::before,.bg-mesh::after{content:"";position:absolute;width:62vmax;height:62vmax;border-radius:50%;filter:blur(80px);opacity:.9}
.bg-mesh::before{background:radial-gradient(circle,var(--bg-blob-1),transparent 65%);top:-28vmax;left:-18vmax}
.bg-mesh::after{background:radial-gradient(circle,var(--bg-blob-2),transparent 65%);bottom:-30vmax;right:-20vmax}

.container{max-width:1280px;margin:0 auto;padding:0 16px}
@media (min-width:768px){.container{padding:0 28px}}

/* =====================================================================
 * APP BAR + NAVIGATION
 * ===================================================================== */
.appbar{position:sticky;top:0;z-index:40;background:var(--glass);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);border-bottom:1px solid var(--hairline)}
.appbar .container{display:flex;align-items:center;gap:14px;min-height:68px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text);min-width:0;flex:1 1 auto}
.brand-logo{width:42px;height:42px;border-radius:13px;flex:none;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand-2));box-shadow:0 6px 18px color-mix(in srgb,var(--brand) 35%,transparent);overflow:hidden;font-weight:700}
.brand-logo img{width:100%;height:100%;object-fit:cover}
.brand-text{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.brand-text strong{font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-text small{font-size:.78rem;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topnav{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--surface-3)}
.topnav a{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;text-decoration:none;color:var(--text-2);font-weight:600;font-size:.94rem;white-space:nowrap;transition:background .2s,color .2s}
.topnav a:hover{color:var(--text)}
.topnav a[aria-current="page"]{background:var(--card-solid);color:var(--brand-strong);box-shadow:var(--shadow-1)}
.appbar-actions{display:flex;align-items:center;gap:8px;flex:none}
.icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--hairline);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--text-2);transition:transform .15s,background .2s}
.icon-btn:hover{background:var(--card-solid);color:var(--text)}
.icon-btn:active{transform:scale(.94)}
.conn{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--surface-3);color:var(--text-2);white-space:nowrap;border:0;cursor:pointer}
.conn .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-muted)}
.conn.demo .dot{background:var(--warn)} .conn.online .dot{background:var(--good)} .conn.offline .dot{background:var(--danger)}
.conn.checking .dot{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.outbox-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:.8rem;font-weight:700;border:0;cursor:pointer;background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn-text)}

.bottomnav{display:none}
@media (max-width:860px){
  .topnav{display:none}
  .conn .lbl{display:none}
  .bottomnav{display:grid;grid-template-columns:repeat(3,1fr);position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--glass-strong);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);border-top:1px solid var(--hairline);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
  .bottomnav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;text-decoration:none;color:var(--text-3);font-size:.74rem;font-weight:600;border-radius:16px}
  .bottomnav a .pill{display:grid;place-items:center;width:56px;height:30px;border-radius:999px;transition:background .2s}
  .bottomnav a[aria-current="page"]{color:var(--text)}
  .bottomnav a[aria-current="page"] .pill{background:var(--brand-soft-2);color:var(--brand-strong)}
  body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
}
.top-loader{position:fixed;top:0;left:0;right:0;height:3px;z-index:100;pointer-events:none;overflow:hidden;opacity:0;transition:opacity .2s}
.top-loader::before{content:"";position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,var(--brand),var(--brand-2),transparent);animation:loadbar 1.1s ease-in-out infinite}
body.is-loading .top-loader{opacity:1}
@keyframes loadbar{from{transform:translateX(-100%)}to{transform:translateX(260%)}}

/* =====================================================================
 * SURFACES, BUTTONS, BADGES
 * ===================================================================== */
main{padding:24px 0 40px}
.view{animation:fadein .35s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--glass-border);border-radius:var(--r-l);box-shadow:var(--shadow-1);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.card-pad{padding:20px}
@media (min-width:768px){.card-pad{padding:24px}}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.card-head .sub{color:var(--text-3);font-size:.88rem;margin-top:2px}
.eyebrow{font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand-strong)}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-head .lead{color:var(--text-2);margin-top:6px;max-width:72ch}
.stack{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1 1 auto}
.grid-2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr))}
.grid-2 > *,.grid-3 > *,.kpis > *,.small-multiples > *,.fields-grid > *,.export-grid > *{min-width:0}
.grid-3{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid transparent;font-weight:600;font-size:.95rem;cursor:pointer;text-decoration:none;white-space:nowrap;transition:transform .12s,box-shadow .2s,background .2s,opacity .2s;user-select:none;-webkit-user-select:none}
.btn:active{transform:scale(.97)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed;transform:none}
.btn-primary{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;box-shadow:0 8px 22px color-mix(in srgb,var(--brand) 32%,transparent)}
.btn-primary:hover{box-shadow:0 10px 28px color-mix(in srgb,var(--brand) 42%,transparent)}
.btn-tonal{background:var(--brand-soft);color:var(--brand-strong)}
.btn-tonal:hover{background:var(--brand-soft-2)}
.btn-outline{background:var(--card);border-color:var(--outline);color:var(--text)}
.btn-outline:hover{background:var(--card-solid)}
.btn-ghost{background:transparent;color:var(--text-2)}
.btn-ghost:hover{background:var(--surface-3);color:var(--text)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger-ghost{background:transparent;color:var(--danger-text)}
.btn-danger-ghost:hover{background:color-mix(in srgb,var(--danger) 12%,transparent)}
.btn-sm{min-height:36px;padding:0 13px;font-size:.86rem}
.btn-icon{width:38px;min-height:38px;padding:0}
.btn .spinner{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.badge{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:.78rem;font-weight:600;line-height:1.7;white-space:nowrap;background:var(--surface-3);color:var(--text-2)}
.badge .sw{width:8px;height:8px;border-radius:50%}
.b-exp .sw{background:var(--series-exp)} .b-ctl .sw{background:var(--series-ctl)}
.b-pre .sw{background:var(--round-pre)} .b-post .sw{background:var(--round-post)}
.b-ok{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good-text)}
.b-warn{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn-text)}
.b-danger{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger-text)}
.b-info{background:color-mix(in srgb,#2a78d6 14%,transparent);color:var(--info-text)}
.b-brand{background:var(--brand-soft);color:var(--brand-strong)}

.notice{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r);background:var(--surface-2);border:1px solid var(--hairline);color:var(--text-2);font-size:.92rem}
.notice .ic{margin-top:2px}
.notice.warn{background:color-mix(in srgb,var(--warn) 13%,var(--card-solid));border-color:color-mix(in srgb,var(--warn) 40%,transparent);color:var(--text)}
.notice.danger{background:color-mix(in srgb,var(--danger) 10%,var(--card-solid));border-color:color-mix(in srgb,var(--danger) 35%,transparent);color:var(--text)}
.notice.info{background:color-mix(in srgb,#2a78d6 9%,var(--card-solid));border-color:color-mix(in srgb,#2a78d6 28%,transparent);color:var(--text)}
.notice.ok{background:color-mix(in srgb,var(--good) 10%,var(--card-solid));border-color:color-mix(in srgb,var(--good) 30%,transparent);color:var(--text)}
.notice .notice-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

/* =====================================================================
 * FORM CONTROLS
 * ===================================================================== */
.field{display:grid;gap:6px;grid-template-columns:minmax(0,1fr)}
.field-label{font-weight:600;font-size:.95rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.req{color:var(--danger-text);font-weight:700}
.help{font-size:.84rem;color:var(--text-3)}
.err{font-size:.86rem;color:var(--danger-text);font-weight:500;display:flex;gap:6px;align-items:center}
.err:empty{display:none}
.input,.select,.textarea{width:100%;min-height:48px;padding:10px 14px;border-radius:14px;border:1px solid var(--outline);background:var(--field);transition:border-color .15s,box-shadow .15s;outline:none}
.textarea{min-height:110px;resize:vertical}
.input:focus,.select:focus,.textarea:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--ring);background:var(--card-solid)}
.has-error .input,.has-error .select,.has-error .textarea{border-color:var(--danger)}
.input[type="date"],.input[type="time"]{min-height:48px}
.input-sm{min-height:40px;padding:6px 12px;border-radius:12px;font-size:.92rem}
.select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text-3) 50%),linear-gradient(135deg,var(--text-3) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:38px}
.search-box{position:relative}
.search-box .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none}
.search-box .input{padding-left:40px}
.fields-grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.fields-grid .span-all{grid-column:1/-1}

/* option cards (radio / checkbox) */
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.opt{position:relative;display:block}
.opt input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:1}
.opt .opt-body{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:16px;background:var(--field);border:1.5px solid var(--hairline);box-shadow:var(--neu-out);transition:all .18s;min-height:52px}
.opt .opt-mark{width:22px;height:22px;border-radius:50%;border:2px solid var(--outline);flex:none;display:grid;place-items:center;transition:all .18s}
.opt input[type="checkbox"] + .opt-body .opt-mark{border-radius:7px}
.opt .opt-text{display:grid;line-height:1.35}
.opt .opt-text small{color:var(--text-3);font-size:.8rem}
.opt:hover .opt-body{border-color:var(--outline)}
.opt input:checked + .opt-body{border-color:var(--brand);background:var(--brand-soft);box-shadow:var(--neu-in)}
.opt input:checked + .opt-body .opt-mark{border-color:var(--brand);background:var(--brand);box-shadow:inset 0 0 0 4px var(--card-solid)}
.opt input[type="checkbox"]:checked + .opt-body .opt-mark{box-shadow:none;color:#fff}
.opt input:focus-visible + .opt-body{outline:3px solid var(--ring);outline-offset:2px}
.has-error .opt .opt-body{border-color:color-mix(in srgb,var(--danger) 45%,transparent)}

/* number with unit suffix (อายุ ___ ปี) */
.input-group{display:flex;align-items:stretch;max-width:280px}
.input-group .input{border-top-right-radius:0;border-bottom-right-radius:0;text-align:right;font-variant-numeric:tabular-nums}
.input-group .suffix{display:grid;place-items:center;padding:0 14px;border:1px solid var(--outline);border-left:0;border-radius:0 14px 14px 0;background:var(--surface-3);color:var(--text-2);font-weight:600;white-space:nowrap}
.field.inline-cond{padding:14px 16px;border-radius:16px;background:var(--brand-soft);border:1px dashed color-mix(in srgb,var(--brand) 40%,transparent)}
.opt input:disabled + .opt-body{opacity:.45;cursor:not-allowed}
.soft-warn{font-size:.86rem;color:var(--warn-text);font-weight:500;display:flex;gap:6px;align-items:flex-start}
.soft-warn:empty{display:none}

/* signature pad (ลายมือชื่ออิเล็กทรอนิกส์) */
.sig{display:grid;gap:8px;max-width:560px}
.sig-pad{position:relative;border-radius:16px;border:1.5px dashed var(--outline);background:#fff;box-shadow:var(--neu-in);touch-action:none;overflow:hidden}
.sig-pad canvas{display:block;width:100%;height:170px;cursor:crosshair}
.sig-pad .sig-hint{position:absolute;inset:auto 0 12px;text-align:center;font-size:.82rem;color:#94a3b8;pointer-events:none}
.sig-pad .sig-line{position:absolute;left:24px;right:24px;bottom:40px;border-bottom:1px solid #cbd5e1;pointer-events:none}
.sig.signed .sig-pad{border-style:solid;border-color:var(--brand)}
.sig.signed .sig-hint{display:none}
.has-error .sig-pad{border-color:var(--danger)}
.sig-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.84rem;color:var(--text-3)}
.sig-img{max-width:260px;max-height:90px;background:#fff;border-radius:10px;border:1px solid var(--hairline);padding:4px}

/* consent document (หนังสือแสดงเจตนายินยอม) */
.consent-doc{max-height:420px;overflow:auto;padding:20px 22px;border-radius:18px;background:var(--card-solid);border:1px solid var(--hairline);display:grid;gap:12px;font-size:.95rem;line-height:1.85;text-indent:0}
.consent-doc .cd-meta{font-size:.82rem;color:var(--text-3);text-align:right}
.consent-doc h3{text-align:center;font-size:1.1rem}
.consent-doc .cd-title{text-align:center;font-weight:600;color:var(--text-2)}
.consent-doc p{text-indent:2em}

/* toggle switch */
.switch{display:inline-flex;align-items:center;gap:12px;cursor:pointer;position:relative}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .track{width:52px;height:32px;border-radius:999px;background:var(--surface-3);box-shadow:var(--neu-in);position:relative;transition:background .2s}
.switch .track::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--card-solid);box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked + .track{background:var(--brand)}
.switch input:checked + .track::after{transform:translateX(20px)}
.switch input:focus-visible + .track{outline:3px solid var(--ring);outline-offset:2px}

/* star rating */
.rating{display:inline-flex;flex-direction:row-reverse;gap:4px}
.rating input{position:absolute;opacity:0;width:1px;height:1px}
.rating label{font-size:30px;line-height:1;cursor:pointer;color:var(--surface-3);text-shadow:0 1px 0 var(--outline);transition:color .15s}
.rating input:checked ~ label,.rating label:hover,.rating label:hover ~ label{color:#f5b301}
.rating input:focus-visible + label{outline:3px solid var(--ring);border-radius:6px}

/* question card */
.q{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;padding:18px;border-radius:20px;background:var(--card);border:1.5px solid var(--glass-border);box-shadow:var(--shadow-1);transition:border-color .2s,box-shadow .2s;scroll-margin-top:96px}
@media (min-width:768px){.q{padding:20px 22px}}
.q-head{display:flex;gap:12px;align-items:flex-start}
.q-no{min-width:34px;height:34px;padding:0 6px;border-radius:11px;display:grid;place-items:center;font-weight:700;font-size:.9rem;background:var(--brand-soft);color:var(--brand-strong);flex:none;transition:all .2s}
.q.answered .q-no{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff}
.q-text{font-weight:500;font-size:1rem;padding-top:4px}
.q.has-error{border-color:color-mix(in srgb,var(--danger) 55%,transparent)}
.q .err{margin-left:46px}
@media (max-width:520px){.q .err{margin-left:0}}

/* numeric rating scale 0–10 */
.nrs{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:6px}
.nrs .opt .opt-body{aspect-ratio:1;min-height:0;padding:0;justify-content:center;border-radius:50%;font-weight:700;font-size:1rem}
.nrs .opt input:checked + .opt-body{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent;box-shadow:0 6px 16px color-mix(in srgb,var(--brand) 40%,transparent)}
.nrs-scale{height:6px;border-radius:999px;background:linear-gradient(90deg,#1baf7a,#eda100 55%,#e34948);opacity:.75;margin:2px 4px 0}
.nrs-anchors{display:flex;justify-content:space-between;gap:12px;font-size:.8rem;color:var(--text-3)}
.nrs-anchors span:last-child{text-align:right}
@media (max-width:520px){.nrs{gap:3px}.nrs .opt .opt-body{font-size:.82rem;box-shadow:none}}

/* likert 5 levels */
.likert{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.likert .opt .opt-body{flex-direction:column;justify-content:center;gap:2px;text-align:center;padding:10px 4px;min-height:74px}
.likert .opt .l-num{font-size:1.25rem;font-weight:700;line-height:1.1}
.likert .opt .l-lbl{font-size:.76rem;color:var(--text-2);line-height:1.25}
.likert .opt input:checked + .opt-body{background:linear-gradient(160deg,var(--brand),var(--brand-2));border-color:transparent;color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--brand) 38%,transparent)}
.likert .opt input:checked + .opt-body .l-lbl{color:rgba(255,255,255,.92)}
@media (max-width:520px){.likert{gap:4px}.likert .opt .opt-body{min-height:66px;box-shadow:none;padding:8px 2px}.likert .opt .l-lbl{font-size:.68rem}}

/* true / false */
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:440px}
.tf .opt .opt-body{justify-content:center;font-weight:700;font-size:1.02rem}
.tf .opt .tf-ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface-3)}
.tf .opt input:checked + .opt-body{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent}
.tf .opt input:checked + .opt-body .tf-ic{background:rgba(255,255,255,.25)}

/* =====================================================================
 * FORM LAYOUT — stepper, progress, sections, action bar
 * ===================================================================== */
.form-layout{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1024px){.form-layout{grid-template-columns:290px minmax(0,1fr)}}
.stepper-wrap{padding:18px;align-self:start;min-width:0}
@media (min-width:1024px){.stepper-wrap{position:sticky;top:88px}}
.progress-summary{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.ring{position:relative;width:64px;height:64px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .ring-bg{stroke:var(--surface-3)}
.ring .ring-fg{stroke:url(#ringGrad);transition:stroke-dashoffset .5s ease}
.ring .ring-val{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:.95rem}
.stepper{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.stepper button{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;border-radius:14px;border:0;background:transparent;cursor:pointer;text-align:left;color:var(--text-2);transition:background .2s}
.stepper button:hover{background:var(--surface-3)}
.stepper .s-dot{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:.85rem;font-weight:700;border:2px solid var(--outline);background:var(--card-solid);transition:all .2s}
.stepper .s-text{display:grid;line-height:1.3;min-width:0}
.stepper .s-title{font-weight:600;font-size:.92rem;color:var(--text)}
.stepper .s-meta{font-size:.76rem;color:var(--text-3)}
.stepper li.current button{background:var(--brand-soft)}
.stepper li.current .s-dot{border-color:var(--brand);color:var(--brand-strong)}
.stepper li.st-complete .s-dot{background:var(--good);border-color:var(--good);color:#fff}
.stepper li.st-error .s-dot{border-color:var(--danger);color:var(--danger-text);background:color-mix(in srgb,var(--danger) 10%,var(--card-solid))}
.stepper li.st-skipped{opacity:.55}
@media (max-width:1023px){
  .stepper-wrap{padding:12px}
  .progress-summary{margin-bottom:8px}
  .stepper{display:flex;overflow-x:auto;gap:6px;scrollbar-width:none;padding-bottom:2px}
  .stepper::-webkit-scrollbar{display:none}
  .stepper li{flex:none}
  .stepper button{padding:6px 12px 6px 6px;background:var(--surface-2);border-radius:999px}
  .stepper .s-dot{width:28px;height:28px}
  .stepper .s-meta{display:none}
  .stepper .s-title{font-size:.84rem;white-space:nowrap}
}
.form-layout.is-done{grid-template-columns:minmax(0,1fr)}
.form-layout.is-done .stepper-wrap,.form-layout.is-done #mainForm,.form-layout.is-done #formActions,.form-layout.is-done #progressBar{display:none}
fieldset{margin:0;min-width:0}
.step-panel h2:focus{outline:none}
.linebar{height:8px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.linebar > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--brand),var(--brand-2));transition:width .45s ease}
.form-main{min-width:0;display:grid;gap:16px;align-content:start;grid-template-columns:minmax(0,1fr)}
.section-head{padding:22px}
.section-head h2{display:flex;gap:10px;align-items:center}
.section-head .full-title{color:var(--text-2);margin-top:6px;font-size:.95rem}
details.instructions{margin-top:14px;border-radius:16px;background:var(--surface-2);border:1px solid var(--hairline)}
details.instructions summary{cursor:pointer;padding:12px 16px;font-weight:600;list-style:none;display:flex;gap:8px;align-items:center}
details.instructions summary::-webkit-details-marker{display:none}
details.instructions summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--text-3);border-bottom:2px solid var(--text-3);transform:rotate(45deg);transition:transform .2s}
details.instructions[open] summary::after{transform:rotate(-135deg)}
details.instructions .ins-body{padding:0 16px 14px;color:var(--text-2);font-size:.93rem;display:grid;gap:8px}
.legend-table{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.legend-table span{padding:3px 10px;border-radius:999px;background:var(--card-solid);border:1px solid var(--hairline);font-size:.82rem}
.group-head{display:flex;align-items:center;gap:10px;padding:6px 4px 0;font-weight:700;color:var(--text)}
.group-head .gh-line{flex:1;height:1px;background:var(--hairline)}
.items{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.sec-progress{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:.86rem;color:var(--text-3)}
.sec-progress .linebar{flex:1;height:6px}
.skip-card{padding:28px;text-align:center;display:grid;gap:10px;justify-items:center}
.skip-card .big-ic{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:var(--surface-3);color:var(--text-3)}

.action-bar{position:sticky;bottom:14px;z-index:30;display:flex;align-items:center;gap:8px;padding:10px;border-radius:999px;background:var(--glass-strong);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);border:1px solid var(--glass-border);box-shadow:var(--shadow-2);margin-top:4px}
@media (max-width:860px){.action-bar{bottom:calc(84px + env(safe-area-inset-bottom));border-radius:22px}}
@media (max-width:640px){.action-bar .btn .lbl-opt{display:none}.action-bar .btn-ghost,.action-bar .btn-outline{padding:0 12px}}

.review-grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.ans-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ans-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:10px;font-size:.82rem;border:1px solid var(--hairline);background:var(--surface-2);cursor:pointer;color:var(--text)}
.ans-chip b{font-variant-numeric:tabular-nums}
.ans-chip.missing{border-color:color-mix(in srgb,var(--danger) 50%,transparent);color:var(--danger-text);background:color-mix(in srgb,var(--danger) 8%,transparent)}
.kv{display:grid;grid-template-columns:minmax(120px,auto) 1fr;gap:6px 16px;font-size:.93rem}
.kv dt{color:var(--text-3)} .kv dd{margin:0;font-weight:500;word-break:break-word}

.success-card{padding:36px 22px;text-align:center;display:grid;gap:14px;justify-items:center}
.success-check{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#16a34a,#22c55e);box-shadow:0 14px 36px rgba(22,163,74,.35);animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.success-check.pending{background:linear-gradient(135deg,#d97706,#f59e0b);box-shadow:0 14px 36px rgba(217,119,6,.35)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.code-pill{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-size:1.05rem;padding:8px 16px;border-radius:12px;background:var(--surface-3);display:inline-flex;gap:10px;align-items:center}

/* =====================================================================
 * DASHBOARD
 * ===================================================================== */
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;padding:14px 16px}
.filters .f{display:grid;gap:4px;min-width:0}
.filters .f > span{font-size:.78rem;font-weight:600;color:var(--text-3)}
.filters .select,.filters .input{min-height:40px;padding:6px 12px;border-radius:12px;font-size:.92rem}
.filters .select{padding-right:34px}
@media (max-width:640px){.filters{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.filters .f-wide{grid-column:1/-1}}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--surface-3);flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:999px;font-size:.84rem;font-weight:600;color:var(--text-2);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card-solid);color:var(--text);box-shadow:var(--shadow-1)}
.kpis{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.kpi{position:relative;display:grid;gap:4px;padding:18px;border-radius:var(--r-l);background:var(--card);border:1px solid var(--glass-border);box-shadow:var(--shadow-1);cursor:pointer;text-align:left;transition:transform .15s,box-shadow .2s;overflow:hidden;color:var(--text)}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-2)}
.kpi::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,var(--brand-soft),transparent 70%)}
.kpi .k-label{display:flex;align-items:center;gap:8px;font-size:.88rem;font-weight:600;color:var(--text-2)}
.kpi .k-ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-strong)}
.kpi .k-value{font-size:2.05rem;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin-top:6px}
.kpi .k-unit{font-size:.95rem;font-weight:500;color:var(--text-3);margin-left:4px}
.kpi .k-sub{font-size:.82rem;color:var(--text-3);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.kpi .k-meter{margin-top:8px}
.delta{display:inline-flex;align-items:center;gap:3px;font-weight:700;font-size:.82rem}
.delta.good{color:var(--good-text)} .delta.bad{color:var(--danger-text)} .delta.flat{color:var(--text-3)}
.chart-card{padding:18px;min-width:0}
@media (min-width:768px){.chart-card{padding:22px}}
.chart-box{position:relative;height:300px;transition:opacity .25s}
.chart-box.tall{height:380px} .chart-box.short{height:230px}
.chart-box canvas{max-width:100%}
.is-refreshing .chart-box,.is-refreshing .kpis{opacity:.55}
.chart-fallback{display:grid;place-items:center;height:100%;color:var(--text-3);font-size:.9rem;text-align:center;padding:16px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.85rem;color:var(--text-2);margin:-4px 0 10px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.small-multiples{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.sm-cell{min-width:0}
.sm-cell h4{font-size:.92rem;font-weight:600;margin-bottom:4px}
.sm-cell .chart-box{height:230px}
.insights{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.insights li{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--surface-2);border:1px solid var(--hairline);font-size:.93rem}
.insights .ii{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--brand-soft);color:var(--brand-strong)}
.section-title{display:flex;align-items:center;gap:10px;margin:8px 0 2px}
.section-title h2{font-size:1.15rem}
.section-title .line{flex:1;height:1px;background:var(--hairline)}
.jump-chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.jump-chips::-webkit-scrollbar{display:none}
.jump-chips a{flex:none;padding:6px 14px;border-radius:999px;background:var(--card);border:1px solid var(--hairline);text-decoration:none;color:var(--text-2);font-size:.86rem;font-weight:600}
.jump-chips a:hover{color:var(--text);background:var(--card-solid)}
.meter{height:8px;border-radius:999px;background:var(--surface-3);overflow:hidden;min-width:60px}
.meter > i{display:block;height:100%;border-radius:999px;background:var(--series-exp)}
.meter.pre > i{background:var(--round-pre)} .meter.post > i{background:var(--round-post)}
.updated{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;color:var(--text-3)}
.privacy-block{padding:36px 20px;text-align:center;display:grid;gap:10px;justify-items:center}

/* =====================================================================
 * TABLES
 * ===================================================================== */
.table-wrap{overflow:auto;border-radius:16px;border:1px solid var(--hairline);background:var(--card-solid);max-width:100%}
.table-wrap.max-h{max-height:560px}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:.9rem}
.tbl th{position:sticky;top:0;z-index:1;background:var(--surface-3);text-align:left;font-weight:600;padding:10px 12px;white-space:nowrap;color:var(--text-2);font-size:.82rem;border-bottom:1px solid var(--hairline)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--hairline);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl tr.clickable{cursor:pointer}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl th.sortable{cursor:pointer;user-select:none}
.tbl th.sortable:hover{color:var(--text)}
.tbl th[aria-sort="ascending"]::after{content:" ▲";font-size:.7em}
.tbl th[aria-sort="descending"]::after{content:" ▼";font-size:.7em}
.tbl .item-text{min-width:260px;max-width:520px}
.tbl .row-actions{display:flex;gap:4px;justify-content:flex-end}
.tbl tr.is-deleted td{opacity:.55}
.tbl-compact td,.tbl-compact th{padding:7px 10px}
.empty{padding:36px 16px;text-align:center;color:var(--text-3)}
.pager{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:12px;font-size:.88rem;color:var(--text-3)}

/* =====================================================================
 * ADMIN
 * ===================================================================== */
.login-wrap{min-height:calc(100vh - 220px);display:grid;place-items:center}
.login-card{width:min(440px,100%);padding:30px 26px;display:grid;gap:16px}
.login-card .lock{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand-2));box-shadow:0 10px 26px color-mix(in srgb,var(--brand) 35%,transparent)}
.tabs{display:flex;gap:4px;padding:4px;border-radius:16px;background:var(--surface-3);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;display:inline-flex;gap:8px;align-items:center;border:0;background:transparent;padding:9px 14px;border-radius:12px;font-weight:600;font-size:.9rem;color:var(--text-2);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--card-solid);color:var(--brand-strong);box-shadow:var(--shadow-1)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.toolbar .search-box{flex:1 1 240px}
.toolbar .select,.toolbar .input{min-height:40px;padding:6px 12px;border-radius:12px;font-size:.9rem;width:auto}
.toolbar .select{padding-right:34px}
.toolbar .search-box .input{padding-left:40px;width:100%}
.tbl .sticky-r{position:sticky;right:0;background:var(--card-solid);box-shadow:-10px 0 12px -12px rgba(0,0,0,.35)}
.tbl th.sticky-r{background:var(--surface-3);z-index:2}
.tbl tbody tr:hover td.sticky-r{background:var(--surface-2)}
.mini-stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));margin-bottom:16px}
.mini-stat{padding:14px 16px;border-radius:16px;background:var(--surface-2);border:1px solid var(--hairline)}
.mini-stat .v{font-size:1.5rem;font-weight:700}
.mini-stat .l{font-size:.82rem;color:var(--text-3)}
.export-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.export-card{display:grid;gap:10px;padding:18px;border-radius:18px;background:var(--surface-2);border:1px solid var(--hairline);align-content:start}
.export-card .ec-ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-strong)}
.diff-list{display:grid;gap:6px;font-size:.88rem;max-height:300px;overflow:auto}
.diff-list div{display:grid;grid-template-columns:minmax(110px,auto) 1fr;gap:10px;padding:8px 10px;border-radius:10px;background:var(--surface-2)}
.diff-old{text-decoration:line-through;color:var(--danger-text)} .diff-new{color:var(--good-text);font-weight:600}
.pre-wrap{white-space:pre-wrap;word-break:break-word}

/* =====================================================================
 * DIALOG + TOAST
 * ===================================================================== */
dialog.dlg{border:0;padding:0;border-radius:28px;width:min(640px,calc(100vw - 24px));max-height:calc(100vh - 32px);background:var(--card-solid);color:var(--text);box-shadow:var(--shadow-3);overflow:hidden}
dialog.dlg.lg{width:min(1040px,calc(100vw - 24px))}
dialog.dlg::backdrop{background:rgba(8,10,18,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
dialog.dlg[open]{display:flex;flex-direction:column;animation:dlgin .25s cubic-bezier(.2,.9,.3,1.2)}
@keyframes dlgin{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.dlg-head{display:flex;align-items:flex-start;gap:12px;padding:20px 22px 12px}
.dlg-head h3{font-size:1.15rem;flex:1}
.dlg-body{padding:4px 22px 18px;overflow:auto;display:grid;gap:14px}
.dlg-foot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding:14px 22px 20px;border-top:1px solid var(--hairline);background:var(--surface-2)}
.toasts{position:fixed;top:80px;right:16px;z-index:200;display:grid;gap:10px;width:min(380px,calc(100vw - 32px))}
.toast{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border-radius:16px;background:var(--card-solid);color:var(--text);box-shadow:var(--shadow-2);border:1px solid var(--hairline);border-left:4px solid var(--brand);animation:toastin .3s cubic-bezier(.2,.9,.3,1.2);font-size:.92rem}
.toast.success{border-left-color:var(--good)} .toast.error{border-left-color:var(--danger)} .toast.warn{border-left-color:var(--warn)}
.toast .t-title{font-weight:700}
.toast .t-close{margin-left:auto;border:0;background:transparent;cursor:pointer;color:var(--text-3);padding:2px}
.toast.leaving{animation:toastout .25s forwards}
@keyframes toastin{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes toastout{to{opacity:0;transform:translateX(30px)}}
@media (max-width:640px){.toasts{left:16px;right:16px;top:76px;width:auto}}

.footer{padding:24px 0 34px;color:var(--text-3);font-size:.82rem;text-align:center}

/* =====================================================================
 * PRINT (บันทึกเป็น PDF ผ่านเมนูพิมพ์ของเบราว์เซอร์)
 * ===================================================================== */
#printArea{display:none}
@media print{
  @page{size:A4;margin:14mm}
  :root{color-scheme:light}
  body{background:#fff!important;color:#000;padding:0!important;font-size:11pt}
  .appbar,.bottomnav,.footer,.toasts,.top-loader,.bg-mesh,.no-print,.action-bar,.filters .seg,dialog{display:none!important}
  .card,.kpi,.q{box-shadow:none!important;backdrop-filter:none!important;background:#fff!important;border:1px solid #ccc!important;break-inside:avoid}
  main{padding:0}
  .chart-box{height:240px!important}
  body.print-report > *:not(#printArea){display:none!important}
  body.print-report #printArea{display:block!important}
  .table-wrap{max-height:none!important;overflow:visible!important;border:0}
  .tbl th{position:static;background:#eee!important;color:#000}
  .tbl td,.tbl th{border-bottom:1px solid #ddd}
}
.print-doc{font-size:11pt;color:#000;background:#fff}
.print-doc h1{font-size:16pt;margin-bottom:4pt}
.print-doc h2{font-size:13pt;margin:14pt 0 6pt}
.print-doc table{width:100%;border-collapse:collapse;font-size:9.5pt;margin-bottom:8pt}
.print-doc th,.print-doc td{border:1px solid #bbb;padding:4pt 6pt;text-align:left;vertical-align:top}
.print-doc th{background:#eee}
.print-doc .meta{color:#444;font-size:9.5pt}
</style>
</head>

<script id="app-script">
'use strict';
/* #####################################################################
 * 1) CONFIGURATION — จุดกำหนดค่าเพียงจุดเดียว

 * ##################################################################### */
const CONFIG = {
  /* URL ของ Google Apps Script Web App (ลงท้ายด้วย /exec)
   * - เว้นว่าง ''  → Demo Mode: เก็บข้อมูลใน Local Storage ของเบราว์เซอร์ + ข้อมูลตัวอย่าง

  GAS_API_URL: '',

  APP: {
    name: 'ระบบประเมินการเตรียมความพร้อมก่อนระงับความรู้สึก',

    logoText: '',           // ตัวอักษรย่อแทนโลโก้ เช่น 'PB' (ใช้เมื่อไม่มี logoUrl)
    formEyebrow: 'รหัสโครงการวิจัย 026-2569 · version 3.0 / 28 กันยายน 2569',
    formTitle: 'แบบสอบถามการเตรียมความพร้อมก่อนได้รับยาระงับความรู้สึก',
    formLead: 'หนังสือยินยอม · ข้อมูลทั่วไป · ความวิตกกังวล · ความมั่นใจ · ความรู้ — ของหญิงตั้งครรภ์ที่เข้ารับการผ่าตัดคลอดทางหน้าท้อง ระบบคำนวณคะแนนให้อัตโนมัติ',
    dashboardTitle: 'Dashboard ผลการประเมิน',
    dashboardLead: 'สรุปผลภาพรวมแบบไม่ระบุตัวบุคคล เปิดดูได้โดยไม่ต้องเข้าสู่ระบบ',
    footer: 'ข้อมูลใช้เพื่อการวิจัยเท่านั้น · นำเสนอผลเป็นภาพรวมของกลุ่ม ไม่เปิดเผยข้อมูลที่ระบุตัวบุคคลได้',
    version: '2.0.0',
    sourceFile: 'แบบสอบถาม1.docx',
  },

  THEME: {
    primary: '#4f46e5',     // สีหลักของแบรนด์
    secondary: '#0ea5e9',   // สีรอง (ใช้ทำ gradient)
    defaultMode: 'auto',    // 'auto' | 'light' | 'dark'
  },

  FORM: {
    alwaysStartOnForm: true,        // เปิดเว็บไซต์แล้วแสดงหน้าบันทึกข้อมูลก่อนเสมอ
    autosaveDraft: true,            // บันทึกร่างอัตโนมัติในอุปกรณ์นี้ระหว่างกรอก
    autoScrollNext: true,           // ตอบข้อหนึ่งแล้วเลื่อนไปข้อถัดไปอัตโนมัติ
    showScoresToRespondent: false,  // แสดงคะแนนในหน้าตรวจสอบ/หน้าสำเร็จ (ปิดไว้เพื่อลดอคติ pre–post test)
    codePattern: '^[EC]-\\d{3}$',   // รูปแบบรหัสผู้เข้าร่วมวิจัย (ตามโครงร่างวิจัย: E-001 / C-001)
    codePrefixGroup: { E: 'experimental', C: 'control' },
    minDate: '2024-01-01',          // วันที่ต้องไม่ก่อนวันนี้

    draftExcludeTypes: ['signature'], // ไม่เก็บลายมือชื่อในร่างบนอุปกรณ์ (ลดความเสี่ยงข้อมูลส่วนบุคคลบนเครื่องใช้ร่วม)
  },

  STUDY: {
    targetPerGroup: { experimental: 32, control: 32 },   // ขนาดกลุ่มตัวอย่างตามโครงร่างวิจัย (กลุ่มละ 32 คน)
  },

  /* เกณฑ์การให้คะแนน/แปลผล — อ้างอิงโครงร่างวิจัย (ต้องตรงกับ Code.gs) */

    /* Dashboard สาธารณะแสดงข้อมูลตัวเลขส่วนบุคคลเป็น "ช่วง" เท่านั้น (ไม่ส่งค่าจริง) — [ขอบล่าง, ป้ายชื่อ] เรียงจากน้อยไปมาก */
    bands: {
      age: [[0, 'ต่ำกว่า 20 ปี'], [20, '20–34 ปี'], [35, '35 ปีขึ้นไป']],
      gravida: [[1, 'ครรภ์แรก'], [2, 'ครรภ์ที่ 2'], [3, 'ครรภ์ที่ 3 ขึ้นไป']],
      parity: [[0, 'ยังไม่เคยคลอด'], [1, 'เคยคลอด 1 ครั้ง'], [2, 'เคยคลอด 2 ครั้งขึ้นไป']],
      living_children: [[0, 'ไม่มีบุตร'], [1, 'บุตร 1 คน'], [2, 'บุตร 2 คนขึ้นไป']],
      gestational_age: [[0, 'ต่ำกว่า 37 สัปดาห์'], [37, '37–41 สัปดาห์'], [42, '42 สัปดาห์ขึ้นไป']],

  ADMIN: {

  DATA: {
    idPrefix: 'R',                 // record_id = R + YYMMDD + '-' + 6 ตัวอักษรสุ่ม
    storagePrefix: 'csline.v2.',   // prefix ของ Local Storage (v2 แยกจากข้อมูลของเวอร์ชัน 1)
    sampleFile: 'sample_data.json',
    seedSampleInDemo: true,        // Demo Mode: ใส่ข้อมูลตัวอย่างให้อัตโนมัติเมื่อเปิดครั้งแรก
  },

  CDN: { xlsx: 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js' },

/* #####################################################################

/* SHA-256 (ใช้ Web Crypto; มี fallback แบบ pure JS สำหรับเบราว์เซอร์ที่ไม่รองรับ) */
async function sha256Hex(text) {

    try { const buf = await crypto.subtle.digest('SHA-256', bytes); return Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2, '0')).join(''); } catch (e) { /* fallback */ }
  }

  const H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const l = bytes.length, withPad = new Uint8Array(((l + 9 + 63) >> 6) << 6);

    for (let i = 0; i < 16; i++) W[i] = dv.getUint32(o + i * 4);
    for (let i = 16; i < 64; i++) { const s0 = rotr(W[i-15],7) ^ rotr(W[i-15],18) ^ (W[i-15] >>> 3), s1 = rotr(W[i-2],17) ^ rotr(W[i-2],19) ^ (W[i-2] >>> 10); W[i] = (W[i-16] + s0 + W[i-7] + s1) >>> 0; }
    let [a,b,c,d,e,f,g,h] = H;
    for (let i = 0; i < 64; i++) { const S1 = rotr(e,6) ^ rotr(e,11) ^ rotr(e,25), ch = (e & f) ^ (~e & g), t1 = (h + S1 + ch + K[i] + W[i]) >>> 0, S0 = rotr(a,2) ^ rotr(a,13) ^ rotr(a,22), mj = (a & b) ^ (a & c) ^ (b & c), t2 = (S0 + mj) >>> 0; h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0; }
    H[0] = (H[0] + a) >>> 0; H[1] = (H[1] + b) >>> 0; H[2] = (H[2] + c) >>> 0; H[3] = (H[3] + d) >>> 0; H[4] = (H[4] + e) >>> 0; H[5] = (H[5] + f) >>> 0; H[6] = (H[6] + g) >>> 0; H[7] = (H[7] + h) >>> 0;
  }
  return H.map(x => x.toString(16).padStart(8, '0')).join('');
}

/* #####################################################################
 * 4) SCORING — คำนวณคะแนนตามเกณฑ์โครงร่างวิจัย (สูตรเดียวกับ Code.gs)
 * ##################################################################### */
const Scoring = {
  levelOf(value, bands) { if (value == null) return ''; const b = bands.find(b => value >= b.min - 1e-9); return b ? b.label : ''; },
  totalIfComplete(r, prefix, from, to) {
    const vals = []; for (let i = from; i <= to; i++) vals.push(toNum(r[prefix + pad2(i)]));
    return vals.every(v => v != null) ? sum(vals) : null;
  },
  knowledgeCorrect(r, i) { const v = r['know_' + pad2(i)]; return (v === 'T' || v === 'F') ? (v === CONFIG.SCORING.knowledgeKey[i - 1] ? 1 : 0) : 0; },
  hasAnyKnowledge(r) { for (let i = 1; i <= 15; i++) if (!isBlank(r['know_' + pad2(i)])) return true; return false; },
  compute(r) {
    const S = CONFIG.SCORING, o = {};
    const anx = this.totalIfComplete(r, 'anx_', 1, 10);
    o.anx_total = anx ?? ''; o.anx_mean = anx == null ? '' : roundTo(anx / 10, 2);
    [[1, 1, 5], [2, 6, 10], [3, 11, 15], [4, 16, 20]].forEach(([d, a, b]) => { const t = this.totalIfComplete(r, 'conf_', a, b); o['conf_d' + d + '_total'] = t ?? ''; });
    const conf = this.totalIfComplete(r, 'conf_', 1, 20);
    o.conf_total = conf ?? ''; o.conf_level = this.levelOf(conf, S.confidenceLevels);
    if (this.hasAnyKnowledge(r)) { let k = 0; for (let i = 1; i <= 15; i++) k += this.knowledgeCorrect(r, i); o.know_score = k; o.know_level = this.levelOf(k, S.knowledgeLevels); }
    else { o.know_score = ''; o.know_level = ''; }
    // คำถามหลายคำตอบ → แยกเป็นคอลัมน์ 0/1 ต่อ 1 ตัวเลือก (multiple dichotomy) สำหรับวิเคราะห์ทางสถิติ
    const methods = asList(r.anesthesia_methods);
    OPTIONS.anesMethods.forEach(op => { o[op.dummy] = methods.length ? (methods.includes(op.value) ? 1 : 0) : ''; });
    return o;
  },
};

/* #####################################################################
 * 5) CONDITIONS + VALIDATION + NORMALIZATION
 * ##################################################################### */
function evalCond(c, d) {
  if (!c) return true;
  if (c.all) return c.all.every(x => evalCond(x, d));
  if (c.any) return c.any.some(x => evalCond(x, d));
  const v = d[c.field];
  if ('eq' in c) return String(v ?? '') === String(c.eq);
  if ('neq' in c) return String(v ?? '') !== String(c.neq);
  if ('in' in c) return c.in.map(String).includes(String(v ?? ''));
  if ('notEmpty' in c) return !isBlank(v);
  return true;
}
/* ฟิลด์จะแสดง/ต้องตอบ เมื่อเงื่อนไขของหมวด (เช่น เฉพาะครั้งก่อน) และเงื่อนไขของข้อ (เช่น อาชีพอื่น ๆ) เป็นจริงทั้งคู่ */
const isVisible = (f, d) => evalCond(SECTION_MAP[f.section]?.showIf, d) && evalCond(f.showIf, d);
const isSectionVisible = (sec, d) => evalCond(sec.showIf, d);

function validateField(f, d) {
  if (!isVisible(f, d)) return null;
  const v = d[f.name];
  if (f.type === 'toggle' && f.mustBeTrue) return v === 'Y' ? null : (f.required ? 'กรุณายืนยัน: ' + (f.toggleLabel || f.label) : null);
  if (isBlank(v)) return f.required ? (f.type === 'signature' ? 'กรุณาลงลายมือชื่อ' : ['text', 'number', 'email', 'tel', 'textarea', 'date', 'time'].includes(f.type) ? 'กรุณากรอก' + f.label : 'กรุณาเลือกคำตอบ') : null;
  switch (f.type) {
    case 'scale': case 'rating': case 'number': {
      const n = Number(v);
      if (!Number.isFinite(n)) return 'ต้องเป็นตัวเลข';
      if ((f.type !== 'number' || f.integer) && !Number.isInteger(n)) return 'ต้องเป็นจำนวนเต็ม';
      if (f.min != null && n < f.min) return `ค่าต้องไม่น้อยกว่า ${f.min}${f.unit ? ' ' + f.unit : ''}`;
      if (f.max != null && n > f.max) return `ค่าต้องไม่เกิน ${f.max}${f.unit ? ' ' + f.unit : ''}`;
      break;
    }
    case 'likert': case 'radio': case 'select': case 'truefalse':
      if (!(f.options || []).some(o => String(o.value) === String(v))) return 'ค่าที่เลือกไม่อยู่ในตัวเลือกที่กำหนด';
      break;
    case 'checkbox': {
      const arr = asList(v);
      if (arr.some(x => !(f.options || []).some(o => String(o.value) === x))) return 'มีค่าที่ไม่อยู่ในตัวเลือก';
      const ex = (f.options || []).find(o => o.exclusive && arr.includes(String(o.value)));
      if (ex && arr.length > 1) return `“${ex.label}” เลือกร่วมกับตัวเลือกอื่นไม่ได้`;
      break;
    }
    case 'signature':
      if (!isSignature(v)) return 'ลายมือชื่อไม่ถูกต้องหรือภาพมีขนาดใหญ่เกินไป กรุณาลงนามใหม่';
      return null;
    case 'date': {
      const dt = parseDate(v);
      if (!dt || !/^\d{4}-\d{2}-\d{2}$/.test(v)) return 'รูปแบบวันที่ไม่ถูกต้อง';
      if (f.maxToday && v > todayISO()) return 'วันที่ต้องไม่เป็นวันในอนาคต';
      if (CONFIG.FORM.minDate && v < CONFIG.FORM.minDate) return 'วันที่ต้องไม่ก่อน ' + fmtDate(CONFIG.FORM.minDate);
      break;
    }
    case 'email': if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) return 'รูปแบบอีเมลไม่ถูกต้อง'; break;
    case 'tel': if (!/^[0-9+\-\s]{6,20}$/.test(v)) return 'รูปแบบเบอร์โทรศัพท์ไม่ถูกต้อง'; break;
  }
  if (f.maxLength && String(v).length > f.maxLength) return `ความยาวต้องไม่เกิน ${f.maxLength} ตัวอักษร`;
  if (f.pattern && !new RegExp(f.pattern).test(String(v))) return f.name === 'participant_code' ? 'รูปแบบรหัสไม่ถูกต้อง (ตัวอย่าง E-001 หรือ C-001)' : 'รูปแบบข้อมูลไม่ถูกต้อง';
  return null;
}
/* ตรวจทั้งรายการ: คืนค่า [{field, message}] */
function validateRecord(d, fields = INPUT_FIELDS) {
  const errs = [];
  fields.forEach(f => { const m = validateField(f, d); if (m) errs.push({ field: f.name, message: m }); });
  // ตรวจความสอดคล้อง: ตัวอักษรนำหน้ารหัสต้องตรงกับกลุ่ม (E = ทดลอง, C = ควบคุม)
  const code = String(d.participant_code || ''), grp = d.study_group;
  const expect = CONFIG.FORM.codePrefixGroup[code.charAt(0)];
  if (fields.includes(FIELD_MAP.study_group) && expect && grp && expect !== grp && !errs.some(e => e.field === 'study_group'))
    errs.push({ field: 'study_group', message: `รหัส ${code} ต้องอยู่ใน${groupLabel(expect)}` });
  // ตรวจตรรกะข้ามข้อ: ระบุว่าไม่เคยได้รับยาระงับความรู้สึก แต่เลือกวิธีที่เคยได้รับ
  const am = FIELD_MAP.anesthesia_methods;
  if (fields.includes(am) && isVisible(am, d) && String(d.anesthesia_history) === '0' && asList(d.anesthesia_methods).some(x => x !== 'none') && !errs.some(e => e.field === am.name))
    errs.push({ field: am.name, message: 'ข้อ 10 ระบุว่า “ไม่เคยได้รับ” จึงเลือกได้เฉพาะ “ไม่เคยได้รับ/ไม่ทราบ”' });
  return errs;
}
/* คำเตือนความสอดคล้องของข้อมูล (ไม่บังคับ — แสดงให้ผู้กรอกตรวจทานก่อนบันทึก) */
function crossWarnings(d) {
  const w = [], n = k => toNum(d[k]), vis = k => isVisible(FIELD_MAP[k], d) && !isBlank(d[k]);
  if (vis('parity') && vis('gravida') && n('parity') > n('gravida') - 1) w.push({ field: 'parity', message: 'จำนวนครั้งการคลอดบุตรควรน้อยกว่าจำนวนครั้งการตั้งครรภ์ (ซึ่งรวมครรภ์นี้) — โปรดตรวจสอบ' });
  if (vis('cs_count') && vis('parity') && n('cs_count') > n('parity')) w.push({ field: 'cs_count', message: 'จำนวนครั้งที่ผ่าตัดคลอดมากกว่าจำนวนครั้งการคลอดบุตร — โปรดตรวจสอบ' });
  if (vis('consent_date') && vis('assessment_date') && d.consent_date > d.assessment_date) w.push({ field: 'consent_date', message: 'วันที่ให้คำยินยอมอยู่หลังวันที่ประเมิน — ควรได้รับความยินยอมก่อนเก็บข้อมูล' });
  if (vis('consent_sign_date') && vis('consent_date') && d.consent_sign_date < d.consent_date) w.push({ field: 'consent_sign_date', message: 'วันที่ลงนามอยู่ก่อนวันที่ให้คำยินยอม — โปรดตรวจสอบ' });
  return w;
}
/* ทำความสะอาด + แปลงชนิดข้อมูล + ล้างค่าที่ไม่เกี่ยวข้องตามเงื่อนไข + คำนวณคะแนน */
function normalizeRecord(raw) {
  const r = {};
  INPUT_FIELDS.forEach(f => {
    let v = raw[f.name];
    if (!isVisible(f, raw)) { r[f.name] = ''; return; }
    if (f.type === 'toggle') { r[f.name] = v === 'Y' || v === true || v === 'true' ? 'Y' : (isBlank(v) ? '' : 'N'); return; }
    if (isBlank(v)) { r[f.name] = ''; return; }
    if (f.type === 'signature') { r[f.name] = isSignature(String(v)) ? String(v) : ''; return; }   // ไม่ผ่าน sanitizeText (Data URL ยาว)
    if (['scale', 'likert', 'rating', 'number'].includes(f.type)) { const n = Number(v); r[f.name] = Number.isFinite(n) ? n : sanitizeText(v, 20); return; }
    if (f.type === 'checkbox') { r[f.name] = asList(v).map(x => sanitizeText(x, 100)).filter(Boolean).join('|'); return; }
    v = sanitizeText(v, f.maxLength || (f.type === 'textarea' ? 2000 : 300));
    if (f.transform === 'upper') v = v.toUpperCase();
    r[f.name] = v;
  });
  return Object.assign(r, Scoring.compute(r));
}
/* เปรียบเทียบการเปลี่ยนแปลง (ใช้ในหน้าต่างยืนยันและบันทึกประวัติ) */
function diffRecords(a, b) {
  const out = {};
  const show = (f, v) => f.type === 'signature' && v ? `[ลายมือชื่อ ${String(v).length} ตัวอักษร]` : v;   // ไม่เก็บภาพลายมือชื่อในประวัติ
  INPUT_FIELDS.concat(FIELD_MAP.record_status).forEach(f => { const x = a?.[f.name] ?? '', y = b?.[f.name] ?? ''; if (String(x) !== String(y)) out[f.name] = [show(f, x), show(f, y)]; });
  return out;
}
/* แปลงเป็นข้อมูลสาธารณะ: ตัดข้อมูลส่วนบุคคล/รหัส/หนังสือยินยอม/ข้อความอิสระ, แปลงตัวเลขส่วนบุคคลเป็นช่วง
 * และแปลงคำตอบความรู้เป็นถูก/ผิด (ไม่เปิดเผยเฉลย) — สูตรเดียวกับ publicRow_ ใน Code.gs */
function toPublicRow(r) {
  const o = {};
  FIELDS.forEach(f => { if (f.public && !f.name.startsWith('know_')) o[f.name] = r[f.name] ?? ''; });
  Object.entries(PUBLIC_BANDS).forEach(([k, src]) => { o[k] = bandOf(src, r[src]); });
  o.know_score = r.know_score ?? ''; o.know_level = r.know_level ?? '';
  const any = Scoring.hasAnyKnowledge(r);
  for (let i = 1; i <= 15; i++) o['kc_' + pad2(i)] = any ? Scoring.knowledgeCorrect(r, i) : '';
  return o;
}

/* #####################################################################
 * 6) STORAGE (Local Storage + memory fallback) และ ACCESS HELPERS
 * ##################################################################### */
const LS = (() => {
  const mem = new Map(), P = CONFIG.DATA.storagePrefix;
  let ok = true; try { localStorage.setItem(P + '__t', '1'); localStorage.removeItem(P + '__t'); } catch (e) { ok = false; }
  return {
    available: ok,
    get(k, d = null) { try { const v = ok ? localStorage.getItem(P + k) : mem.get(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { const s = JSON.stringify(v); try { if (ok) localStorage.setItem(P + k, s); else mem.set(k, s); return true; } catch (e) { mem.set(k, s); return false; } },
    del(k) { try { if (ok) localStorage.removeItem(P + k); } catch (e) { } mem.delete(k); },
  };
})();
const SS = {
  get(k) { try { return JSON.parse(sessionStorage.getItem(CONFIG.DATA.storagePrefix + k)); } catch (e) { return null; } },
  set(k, v) { try { sessionStorage.setItem(CONFIG.DATA.storagePrefix + k, JSON.stringify(v)); } catch (e) { } },
  del(k) { try { sessionStorage.removeItem(CONFIG.DATA.storagePrefix + k); } catch (e) { } },
};

/* #####################################################################
 * 7) API CLIENT — Google Apps Script Web App
 *    ใช้ POST + Content-Type text/plain เพื่อหลีกเลี่ยง CORS preflight ของ Apps Script
 * ##################################################################### */
class ApiError extends Error {
  constructor(code, message, details, data) { super(message || code); this.code = code; this.details = details; this.data = data; }
  get isNetwork() { return ['NETWORK', 'TIMEOUT', 'OFFLINE'].includes(this.code) || /^HTTP_5/.test(this.code); }
}
const Api = {
  get url() { return String(CONFIG.GAS_API_URL || '').trim(); },
  async call(action, payload = {}, { auth = false, retries = 0 } = {}) {
    if (!this.url) throw new ApiError('NO_URL', 'ยังไม่ได้กำหนด GAS_API_URL');
    const token = Session.token();
    const body = JSON.stringify({ action, payload, token: (auth || token) ? token : undefined, client: { app: CONFIG.APP.version, at: isoLocal() } });
    let lastErr;
    for (let attempt = 0; attempt <= retries; attempt++) {
      if (navigator.onLine === false) { lastErr = new ApiError('OFFLINE', 'ไม่มีการเชื่อมต่ออินเทอร์เน็ต'); break; }
      const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), CONFIG.API.timeoutMs);
      try {
        Loader.start();
        const res = await fetch(this.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body, signal: ctrl.signal, redirect: 'follow', cache: 'no-store' });
        if (!res.ok) throw new ApiError('HTTP_' + res.status, `เซิร์ฟเวอร์ตอบกลับผิดพลาด (HTTP ${res.status})`);
        let json; try { json = await res.json(); } catch (e) { throw new ApiError('BAD_RESPONSE', 'รูปแบบข้อมูลตอบกลับไม่ถูกต้อง — ตรวจสอบการ Deploy Web App (สิทธิ์ Anyone)'); }
        if (!json || json.success !== true) {
          const err = new ApiError(json?.error?.code || 'API_ERROR', json?.message || 'การทำงานไม่สำเร็จ', json?.error?.details, json?.data);
          if (['AUTH_REQUIRED', 'INVALID_TOKEN', 'TOKEN_EXPIRED'].includes(err.code)) Session.clear();
          throw err;
        }
        return json;
      } catch (e) {
        lastErr = e instanceof ApiError ? e : (e.name === 'AbortError' ? new ApiError('TIMEOUT', 'API ไม่ตอบสนองภายในเวลาที่กำหนด') : new ApiError('NETWORK', 'เชื่อมต่อ API ไม่สำเร็จ: ' + (e.message || e)));
        if (!lastErr.isNetwork || attempt === retries) break;
        await sleep(800 * (attempt + 1));
      } finally { clearTimeout(timer); Loader.stop(); }
    }
    throw lastErr;
  },
};

/* #####################################################################
 * 8) SESSION + AUTH — ผู้ดูแลระบบ
 *    Demo Mode: เก็บ hash (SHA-256 + salt) ของรหัสผ่านใน Local Storage — ไม่เก็บข้อความธรรมดา
 *    GAS Mode : ตรวจรหัสผ่านที่ฝั่งเซิร์ฟเวอร์ + ใช้ Token หมดอายุอัตโนมัติ
 * ##################################################################### */
const Session = {
  get() { const s = SS.get('session'); if (!s) return null; if (Date.now() > s.exp) { SS.del('session'); return null; } return s; },
  set(user, token, minutes, extra = {}) { SS.set('session', { user, token, exp: Date.now() + minutes * 60000, mode: DataService.mode, ...extra }); },
  touch() { const s = this.get(); if (s && s.mode === 'demo') { s.exp = Date.now() + CONFIG.ADMIN.sessionMinutes * 60000; SS.set('session', s); } },
  clear() { SS.del('session'); },
  token() { return this.get()?.token || null; },
  user() { return this.get()?.user || null; },
  valid() { const s = this.get(); return !!s && s.mode === DataService.mode; },
};
const LocalAuth = {
  attempts: 0, lockedUntil: 0,
  async cred() {
    let c = LS.get('admin_cred');
    if (!c || !c.hash) {
      const salt = randomToken(16);
      c = { username: CONFIG.ADMIN.defaultUsername, salt, hash: await sha256Hex(salt + ':' + CONFIG.ADMIN.defaultPassword), is_default: true, updated_at: isoLocal() };
      LS.set('admin_cred', c);
    }
    return c;
  },
  async login(u, p) {
    if (Date.now() < this.lockedUntil) throw new ApiError('LOCKED', `เข้าสู่ระบบผิดหลายครั้ง กรุณารอ ${Math.ceil((this.lockedUntil - Date.now()) / 1000)} วินาที`);
    const c = await this.cred();
    const ok = u === c.username && (await sha256Hex(c.salt + ':' + p)) === c.hash;
    if (!ok) {
      if (++this.attempts >= CONFIG.ADMIN.maxLoginAttempts) { this.lockedUntil = Date.now() + CONFIG.ADMIN.lockSeconds * 1000; this.attempts = 0; }
      throw new ApiError('INVALID_CREDENTIALS', 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
    }
    this.attempts = 0;
    return { username: c.username, token: 'local-' + randomToken(24), default_credentials: !!c.is_default };
  },
  async change(currentPassword, newUsername, newPassword) {
    const c = await this.cred();
    if ((await sha256Hex(c.salt + ':' + currentPassword)) !== c.hash) throw new ApiError('INVALID_CREDENTIALS', 'รหัสผ่านปัจจุบันไม่ถูกต้อง');
    const salt = randomToken(16);
    LS.set('admin_cred', { username: newUsername, salt, hash: await sha256Hex(salt + ':' + newPassword), is_default: false, updated_at: isoLocal() });
    return { username: newUsername };
  },
};

/* #####################################################################
 * 9) DATA SERVICE — อินเทอร์เฟซเดียว สลับ Demo (Local Storage) ↔ Google Sheets อัตโนมัติ
 * ##################################################################### */
const LocalDB = {
  records() { return LS.get('records', []); },
  save(list) { if (!LS.set('records', list)) Toast.show('พื้นที่จัดเก็บในเบราว์เซอร์ไม่เพียงพอหรือถูกปิดกั้น — ข้อมูลอาจไม่ถูกบันทึกถาวร', 'warn'); },
  audit() { return LS.get('audit', []); },
  log(action, record_id, changes, note = '') {
    const list = this.audit();
    list.unshift({ log_id: 'L' + Date.now().toString(36).toUpperCase() + randomToken(3), timestamp: isoLocal(), action, record_id: record_id || '', user: Session.user() || 'public-form', changes: changes ? JSON.stringify(changes) : '', note });
    LS.set('audit', list.slice(0, 3000));
  },
  lastUpdated() { return this.records().reduce((m, r) => (r.updated_at > m ? r.updated_at : m), ''); },
};

const DataService = {
  get mode() { return Api.url ? 'gas' : 'demo'; },
  isAdmin() { return Session.valid(); },

  async ping() {
    if (this.mode === 'demo') return { ok: true, mode: 'demo' };
    const res = await Api.call('ping', {}, { retries: 0 });
    return { ok: true, mode: 'gas', data: res.data };
  },

  /* CREATE — ตรวจสอบซ้ำทั้ง record_id และ (participant_code + assessment_round) */
  async create(input) {
    const rec = { ...normalizeRecord(input), record_id: input.record_id || newRecordId() };
    const errs = validateRecord(rec);
    if (errs.length) throw new ApiError('VALIDATION_ERROR', 'ข้อมูลไม่ครบถ้วนหรือไม่ถูกต้อง', errs);
    if (this.mode === 'gas') {
      try { const res = await Api.call('create', { record: rec }, { retries: CONFIG.API.retries }); return res.data; }
      catch (e) { if (e.code === 'DUPLICATE_ID' && e.data) return e.data; throw e; }   // ส่งซ้ำ (retry) = บันทึกแล้ว
    }
    const list = LocalDB.records();
    const existing = list.find(r => r.record_id === rec.record_id);
    if (existing) return existing;
    const dup = list.find(r => r.record_status !== 'deleted' && r.participant_code === rec.participant_code && r.assessment_round === rec.assessment_round);
    if (dup) throw new ApiError('DUPLICATE_ENTRY', `มีข้อมูลของรหัส ${rec.participant_code} ครั้ง "${roundLabelShort(rec.assessment_round)}" อยู่แล้ว (${dup.record_id})`, [{ field: 'assessment_round', message: 'มีข้อมูลครั้งนี้ของรหัสนี้แล้ว' }]);
    const now = isoLocal(), by = Session.valid() ? Session.user() : 'public-form';
    const saved = { ...rec, created_at: now, updated_at: now, record_status: 'submitted', created_by: by, updated_by: by };
    list.push(saved); LocalDB.save(list); LocalDB.log('create', saved.record_id, null);
    return saved;
  },

  /* READ (ผู้ดูแล) — ข้อมูลรายบุคคลครบทุกฟิลด์ */
  async list() {
    this.requireAdmin();
    if (this.mode === 'gas') { const res = await Api.call('read', { include_deleted: true }, { auth: true, retries: 1 }); return res.data || []; }
    return LocalDB.records();
  },

  /* UPDATE (ผู้ดูแล) — ตรวจสิทธิ์ ตรวจข้อมูล ตรวจซ้ำ และบันทึกประวัติ */
  async update(recordId, input, expectedUpdatedAt) {
    this.requireAdmin();
    if (this.mode === 'gas') { const res = await Api.call('update', { record_id: recordId, record: input, expected_updated_at: expectedUpdatedAt }, { auth: true }); return res.data; }
    const list = LocalDB.records(); const idx = list.findIndex(r => r.record_id === recordId);
    if (idx < 0) throw new ApiError('NOT_FOUND', 'ไม่พบรายการ ' + recordId);
    const old = list[idx];
    if (expectedUpdatedAt && old.updated_at !== expectedUpdatedAt) throw new ApiError('CONFLICT', 'รายการนี้ถูกแก้ไขโดยผู้อื่นระหว่างนี้ กรุณาโหลดข้อมูลใหม่');
    const merged = { ...old, ...input };
    const rec = { ...old, ...normalizeRecord(merged), record_status: input.record_status || old.record_status };
    if (rec.record_status !== 'deleted') {
      const errs = validateRecord(rec);
      if (errs.length) throw new ApiError('VALIDATION_ERROR', 'ข้อมูลไม่ครบถ้วนหรือไม่ถูกต้อง', errs);
      const dup = list.find(r => r.record_id !== recordId && r.record_status !== 'deleted' && r.participant_code === rec.participant_code && r.assessment_round === rec.assessment_round);
      if (dup) throw new ApiError('DUPLICATE_ENTRY', `มีข้อมูลของรหัส ${rec.participant_code} ครั้ง "${roundLabelShort(rec.assessment_round)}" อยู่แล้ว (${dup.record_id})`);
    }
    const changes = diffRecords(old, rec);
    if (!Object.keys(changes).length) return old;
    rec.updated_at = isoLocal(); rec.updated_by = Session.user();
    list[idx] = rec; LocalDB.save(list);
    LocalDB.log(changes.record_status && Object.keys(changes).length === 1 ? 'status:' + rec.record_status : 'update', recordId, changes);
    return rec;
  },

  /* DELETE (ผู้ดูแล) — ลบแบบซ่อน (soft delete) กู้คืนได้ */
  async remove(recordId) {
    this.requireAdmin();
    if (this.mode === 'gas') { const res = await Api.call('delete', { record_id: recordId }, { auth: true }); return res.data; }
    return this.update(recordId, { record_status: 'deleted' });
  },
  /* ลบถาวร (ผู้ดูแล) — ลบทั้งคำตอบและหนังสือยินยอม ใช้เมื่อผู้เข้าร่วมขอถอนตัวและให้ทำลายข้อมูล (กู้คืนไม่ได้) */
  async purge(recordId) {
    this.requireAdmin();
    if (this.mode === 'gas') { const res = await Api.call('delete', { record_id: recordId, hard: true }, { auth: true }); return res.data; }
    const list = LocalDB.records(), old = list.find(r => r.record_id === recordId);
    if (!old) throw new ApiError('NOT_FOUND', 'ไม่พบรายการ ' + recordId);
    LocalDB.save(list.filter(r => r.record_id !== recordId));
    LocalDB.log('delete:hard', recordId, null, `ลบถาวร (รวมหนังสือยินยอม) รหัส ${old.participant_code} ครั้ง ${old.assessment_round}`);
    return { record_id: recordId };
  },
  async restore(recordId) { return this.update(recordId, { record_status: 'submitted' }); },
  async setStatus(recordId, status) { return this.update(recordId, { record_status: status }); },

  /* SUMMARY (สาธารณะ) — ข้อมูลไม่ระบุตัวบุคคลสำหรับ Dashboard */
  async summary() {
    if (this.mode === 'gas') { const res = await Api.call('summary', {}, { retries: 1 }); return { rows: res.data || [], meta: res.meta || {} }; }
    const recs = LocalDB.records().filter(r => r.record_status !== 'deleted');
    return { rows: recs.map(toPublicRow), meta: { last_updated: LocalDB.lastUpdated(), generated_at: isoLocal(), total: recs.length } };
  },

  /* ตรวจล่วงหน้าว่ารหัสนี้มีข้อมูลครั้งนี้แล้วหรือไม่ (ฝั่งเซิร์ฟเวอร์ตรวจซ้ำอีกครั้งตอนบันทึก) */
  async checkDuplicate(code, round, excludeId) {
    if (!code || !round) return null;
    if (this.mode === 'gas') {
      try { const res = await Api.call('check', { participant_code: code, assessment_round: round, exclude_id: excludeId || '' }); return res.data?.exists ? res.data : null; }
      catch (e) { return null; }
    }
    return LocalDB.records().find(r => r.record_id !== excludeId && r.record_status !== 'deleted' && r.participant_code === code && r.assessment_round === round) || null;
  },

  async audit() {
    this.requireAdmin();
    if (this.mode === 'gas') { const res = await Api.call('audit', { limit: 1000 }, { auth: true }); return res.data || []; }
    return LocalDB.audit();
  },

  async login(u, p) {
    if (this.mode === 'gas') { const res = await Api.call('login', { username: u, password: p }); return res.data; }
    return LocalAuth.login(u, p);
  },
  async logout() { if (this.mode === 'gas' && Session.token()) { try { await Api.call('logout', {}, { auth: true }); } catch (e) { } } Session.clear(); },
  async changeCredentials(cur, nu, np) {
    this.requireAdmin();
    if (this.mode === 'gas') { const res = await Api.call('changeCredentials', { current_password: cur, new_username: nu, new_password: np }, { auth: true }); return res.data; }
    const r = await LocalAuth.change(cur, nu, np); LocalDB.log('change_credentials', '', null, 'เปลี่ยนชื่อผู้ใช้/รหัสผ่าน'); return r;
  },
  requireAdmin() { if (!Session.valid()) throw new ApiError('AUTH_REQUIRED', 'กรุณาเข้าสู่ระบบผู้ดูแลก่อนดำเนินการ'); Session.touch(); },
};

/* #####################################################################
 * 10) OUTBOX — คิวส่งข้อมูลเมื่ออินเทอร์เน็ตขัดข้อง (GAS Mode)
 *     record_id ถูกสร้างไว้ก่อน → ส่งซ้ำได้โดยไม่เกิดข้อมูลซ้ำ
 * ##################################################################### */
const Outbox = {
  items() { return LS.get('outbox', []); },
  add(rec, error) { const list = this.items().filter(x => x.record.record_id !== rec.record_id); list.push({ record: rec, queued_at: isoLocal(), last_error: error || '' }); LS.set('outbox', list); this.render(); },
  remove(id) { LS.set('outbox', this.items().filter(x => x.record.record_id !== id)); this.render(); },
  busy: false,
  async flush(manual = false) {
    if (this.busy || DataService.mode !== 'gas' || !this.items().length) return;
    this.busy = true; let sent = 0, failed = 0;
    try {
      for (const it of this.items()) {
        try { await DataService.create(it.record); this.remove(it.record.record_id); sent++; }
        catch (e) {
          if (e.isNetwork) { failed++; break; }
          const list = this.items(); const x = list.find(y => y.record.record_id === it.record.record_id); if (x) { x.last_error = e.message; LS.set('outbox', list); } failed++;
        }
      }
    } finally { this.busy = false; this.render(); }
    if (sent) Toast.show(`ส่งข้อมูลที่ค้างอยู่สำเร็จ ${sent} รายการ`, 'success');
    else if (manual && failed) Toast.show('ยังส่งข้อมูลที่ค้างไม่สำเร็จ ระบบจะลองใหม่อัตโนมัติ', 'warn');
  },
  render() {

const Loader = {
  n: 0,
  start() { this.n++; document.body.classList.add('is-loading'); },
  stop() { this.n = Math.max(0, this.n - 1); if (!this.n) document.body.classList.remove('is-loading'); },

const Toast = {
  show(msg, type = 'info', { title, timeout } = {}) {
    const box = $('#toasts'); if (!box) return;
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    if (type === 'error') el.setAttribute('role', 'alert');
    const ic = { success: 'check', error: 'warn', warn: 'warn', info: 'info' }[type] || 'info';
    const t = title || { success: 'สำเร็จ', error: 'เกิดข้อผิดพลาด', warn: 'โปรดตรวจสอบ', info: 'แจ้งเพื่อทราบ' }[type];
    el.innerHTML = `${icon(ic, 20)}<div><div class="t-title">${esc(t)}</div><div>${esc(msg)}</div></div><button type="button" class="t-close" aria-label="ปิดข้อความ">${icon('x', 16)}</button>`;
    box.appendChild(el);
    const close = () => { if (!el.isConnected) return; el.classList.add('leaving'); setTimeout(() => el.remove(), 250); };
    el.querySelector('.t-close').onclick = close;
    setTimeout(close, timeout || (type === 'error' ? 8000 : 4200));
    while (box.children.length > 4) box.firstElementChild.remove();
  },
};

/* หน้าต่าง Modal (สร้าง <dialog> ใหม่ทุกครั้ง จึงซ้อนกันได้ เช่น ยืนยันลบจากหน้ารายละเอียด) */
const Dialog = {
  open({ title, body = '', actions = [{ label: 'ปิด', kind: 'ghost' }], size = '', onOpen, dismissible = true }) {
    const d = document.createElement('dialog');
    d.className = 'dlg ' + size;
    d.setAttribute('aria-label', title);
    d.innerHTML = `<div class="dlg-head"><h3>${esc(title)}</h3><button type="button" class="icon-btn" data-dlg-close aria-label="ปิดหน้าต่าง">${icon('x', 18)}</button></div>
      <div class="dlg-body">${body}</div>
      ${actions.length ? `<div class="dlg-foot">${actions.map((a, i) => `<button type="button" class="btn btn-${a.kind || 'ghost'}" data-act="${i}">${a.icon ? icon(a.icon, 18) : ''}${esc(a.label)}</button>`).join('')}</div>` : ''}`;
    document.body.appendChild(d);
    return new Promise(resolve => {
      let result = null;
      d.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', async () => {
        const a = actions[+b.dataset.act];
        if (a.onClick) {
          b.disabled = true; const old = b.innerHTML; b.innerHTML = '<span class="spinner"></span>' + esc(a.label);
          try { const r = await a.onClick(d); if (r === false) { b.disabled = false; b.innerHTML = old; return; } result = a.value !== undefined ? a.value : (r ?? true); }
          catch (e) { b.disabled = false; b.innerHTML = old; Toast.show(e.message || String(e), 'error'); return; }
        } else result = a.value !== undefined ? a.value : null;
        d.close();
      }));
      d.querySelector('[data-dlg-close]').addEventListener('click', () => d.close());
      d.addEventListener('cancel', e => { if (!dismissible) e.preventDefault(); });
      d.addEventListener('click', e => { if (e.target === d && dismissible) d.close(); });
      d.addEventListener('close', () => { Viz.destroyWithin(d); d.remove(); resolve(result); });
      d.showModal(); hydrateIcons(d);
      if (onOpen) onOpen(d);
    });
  },
  confirm({ title, message, html, confirmText = 'ยืนยัน', danger = false }) {
    return this.open({ title, body: html || `<p>${esc(message)}</p>`, actions: [{ label: 'ยกเลิก', kind: 'ghost', value: false }, { label: confirmText, kind: danger ? 'danger' : 'primary', icon: danger ? 'trash' : 'check', value: true }] }).then(v => v === true);
  },
};
