const Router = {
  current: null,
  views() { return { form: FormView, dashboard: DashboardView, admin: AdminView }; },
  parse() { const m = /^#\/(\w+)/.exec(location.hash); return m && this.views()[m[1]] ? m[1] : 'form'; },
  handle() {
    const name = this.parse(), views = this.views();
    if (this.current && this.current !== name) views[this.current].leave?.();
    $$('.view').forEach(v => { v.hidden = v.dataset.view !== name; });
    $$('[data-route]').forEach(a => { if (a.dataset.route === name) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    const changed = this.current !== name;
    this.current = name;
    views[name].enter?.();
    if (changed) window.scrollTo({ top: 0 });
  },
  go(name) { if (location.hash !== '#/' + name) location.hash = '#/' + name; else this.handle(); },
};

/* #####################################################################
 * 13) FORM VIEW — หน้าบันทึกข้อมูล (wizard ตามหมวดของไฟล์ต้นฉบับ)

const RADIO_TYPES = ['radio', 'likert', 'scale', 'truefalse', 'rating'];
const NUMERIC_TYPES = ['likert', 'scale', 'rating', 'number'];

/* แผ่นลงลายมือชื่ออิเล็กทรอนิกส์ (Pointer Events: นิ้ว/ปากกา/เมาส์) → เก็บเป็นภาพ PNG (Data URL) ในช่องซ่อน
 * ภาพถูกย่อขนาดอัตโนมัติให้ไม่เกิน CONFIG.FORM.signatureMaxChars (ขีดจำกัดเซลล์ Excel 32,767 / Sheets 50,000 ตัวอักษร) */
const SignaturePad = {
  pads: new Map(),
  init(root) {
    $$('.sig[data-sig]', root).forEach(box => {
      const canvas = box.querySelector('canvas');
      const pad = { name: box.dataset.sig, box, canvas, input: box.querySelector('input[type=hidden]'), ctx: canvas.getContext('2d'), drawing: false, pts: [] };
      this.pads.set(pad.name, pad);
      const pos = e => { const r = canvas.getBoundingClientRect(); return { x: (e.clientX - r.left) * (canvas.width / r.width), y: (e.clientY - r.top) * (canvas.height / r.height) }; };
      canvas.addEventListener('pointerdown', e => {
        if (FormView.state?.done) return;
        this.fit(pad); e.preventDefault();
        try { canvas.setPointerCapture(e.pointerId); } catch (err) { }
        pad.drawing = true; pad.pts = [pos(e)];
        const p = pad.pts[0]; pad.ctx.beginPath(); pad.ctx.arc(p.x, p.y, pad.ctx.lineWidth / 2, 0, Math.PI * 2); pad.ctx.fillStyle = '#0f172a'; pad.ctx.fill();
      });
      canvas.addEventListener('pointermove', e => {
        if (!pad.drawing) return; e.preventDefault();
        const p = pos(e), pts = pad.pts, ctx = pad.ctx; pts.push(p);
        const n = pts.length;
        if (n < 3) { ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y); ctx.lineTo(p.x, p.y); ctx.stroke(); return; }
        const a = pts[n - 3], b = pts[n - 2];   // เส้นโค้งผ่านจุดกึ่งกลาง → เส้นลื่นไม่หยัก
        ctx.beginPath(); ctx.moveTo((a.x + b.x) / 2, (a.y + b.y) / 2); ctx.quadraticCurveTo(b.x, b.y, (b.x + p.x) / 2, (b.y + p.y) / 2); ctx.stroke();
      });
      const end = () => { if (!pad.drawing) return; pad.drawing = false; this.commit(pad); };
      canvas.addEventListener('pointerup', end); canvas.addEventListener('pointercancel', end);
    });
    let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => this.refresh(), 250); });
  },
  style(pad) { const dpr = pad.canvas.width / Math.max(1, pad.canvas.clientWidth), c = pad.ctx; c.lineWidth = 2.4 * dpr; c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = '#0f172a'; },
  /* ปรับขนาด canvas ตามขนาดที่แสดงจริง (หมวดที่ซ่อนอยู่มีความกว้าง 0) แล้ววาดลายมือชื่อเดิมกลับ */
  fit(pad) {
    const w = pad.canvas.clientWidth, h = pad.canvas.clientHeight; if (!w || !h) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1), W = Math.round(w * dpr), H = Math.round(h * dpr);
    if (pad.canvas.width === W && pad.canvas.height === H) return;
    pad.canvas.width = W; pad.canvas.height = H; this.paint(pad, pad.input.value);
  },
  refresh(root = document) { this.pads.forEach(p => { if (root && root.contains(p.canvas)) this.fit(p); }); },
  paint(pad, dataUrl) {
    const { ctx, canvas } = pad;
    ctx.clearRect(0, 0, canvas.width, canvas.height); this.style(pad);
    if (!isSignature(dataUrl)) return;
    const img = new Image();
    img.onload = () => { if (pad.input.value !== dataUrl) return; const s = Math.min(canvas.width / img.width, canvas.height / img.height), w = img.width * s, h = img.height * s; ctx.drawImage(img, (canvas.width - w) / 2, (canvas.height - h) / 2, w, h); };
    img.src = dataUrl;
  },
  /* ส่งออก PNG พื้นโปร่งใส (ย่อจนขนาดไม่เกินขีดจำกัด; ใช้ JPEG พื้นขาวเป็นทางเลือกสุดท้าย) */
  export(pad) {
    const src = pad.canvas, max = CONFIG.FORM.signatureMaxChars;
    for (const width of [600, 480, 360, 260]) {
      const s = Math.min(1, width / src.width), c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(src.width * s)); c.height = Math.max(1, Math.round(src.height * s));
      const x = c.getContext('2d'); x.drawImage(src, 0, 0, c.width, c.height);
      let url = c.toDataURL('image/png');
      if (url.length > max) { const j = document.createElement('canvas'); j.width = c.width; j.height = c.height; const y = j.getContext('2d'); y.fillStyle = '#fff'; y.fillRect(0, 0, j.width, j.height); y.drawImage(c, 0, 0); url = j.toDataURL('image/jpeg', 0.72); }
      if (url.length <= max) return url;
    }
    return '';
  },
  commit(pad) { pad.input.value = this.export(pad); this.status(pad); pad.input.dispatchEvent(new Event('change', { bubbles: true })); },
  clear(name) { const pad = this.pads.get(name); if (!pad) return; pad.input.value = ''; this.paint(pad, ''); this.status(pad); pad.input.dispatchEvent(new Event('change', { bubbles: true })); },
  show(name, dataUrl) { const pad = this.pads.get(name); if (!pad) return; pad.input.value = isSignature(dataUrl) ? dataUrl : ''; this.paint(pad, pad.input.value); this.status(pad); },
  status(pad) { const ok = isSignature(pad.input.value); pad.box.classList.toggle('signed', ok); const st = $(`[data-sig-status="${pad.name}"]`); if (st) st.innerHTML = ok ? `${icon('check', 14)} ลงนามแล้ว` : 'ยังไม่ได้ลงนาม'; },
};

const FormView = {
  steps: [], built: false, started: false,
  state: null,
  freshState() { return { data: {}, step: 0, mode: 'new', recordId: newRecordId(), original: null, showErrors: false, errors: {}, submitting: false, dirty: false, done: false }; },

  build() {
    this.state = this.freshState();
    this.steps = SCHEMA.sections.map(s => ({ id: s.id, section: s, title: s.title, short: s.short, icon: s.icon }))
      .concat([{ id: 'review', title: 'ตรวจสอบและบันทึก', short: 'ตรวจสอบและบันทึก', icon: 'check' }]);
    const form = $('#mainForm');
    form.innerHTML = this.steps.map((st, i) => `<div class="step-panel stack" data-step="${i}" ${i ? 'hidden' : ''}>${st.section ? this.renderSection(st.section, i) : '<div id="reviewPanel" class="stack"></div>'}</div>`).join('');
    hydrateIcons(form);
    SignaturePad.init(form);
    form.addEventListener('click', e => {
      const c = e.target.closest('[data-sig-clear]'); if (c) { SignaturePad.clear(c.dataset.sigClear); return; }
      const cp = e.target.closest('[data-copy-from]');
      if (cp) {
        const v = this.state.data[cp.dataset.copyFrom], to = FIELD_MAP[cp.dataset.copyTo];
        if (isBlank(v)) { Toast.show('ยังไม่ได้กรอก “' + FIELD_MAP[cp.dataset.copyFrom].label + '”', 'info'); return; }
        this.writeValue(to, v); $('#f_' + to.name).dispatchEvent(new Event('input', { bubbles: true }));
      }
    });
    form.addEventListener('change', e => this.onInput(e));
    form.addEventListener('input', e => { if (e.target.matches('input:not([type=radio]):not([type=checkbox]),textarea')) this.onInput(e); });
    form.addEventListener('submit', e => e.preventDefault());
    form.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('input:not([type=radio]):not([type=checkbox])')) e.preventDefault(); });
    $('#stepper').addEventListener('click', e => { const b = e.target.closest('[data-goto]'); if (b) this.goStep(+b.dataset.goto); });
    $('#reviewPanel').addEventListener('click', e => { const c = e.target.closest('[data-goto-field]'); if (c) { this.goStep(this.stepOfField(c.dataset.gotoField)); this.focusField(c.dataset.gotoField); } });
    $('#btnPrev').onclick = () => this.prev();
    $('#btnNext').onclick = () => this.next();
    $('#btnSubmit').onclick = () => this.submit();
    $('#btnDraft').onclick = () => this.saveDraft(true);
    $('#btnClear').onclick = () => this.clearForm();
    $('#btnNew').onclick = () => this.newRecord();
    this.autosave = debounce(() => { if (CONFIG.FORM.autosaveDraft) this.saveDraft(false); }, 800);
    window.addEventListener('beforeunload', e => {
      if (this.state.mode === 'new' && this.state.dirty && !this.state.done) this.saveDraft(false);
      if (this.state.mode === 'edit' && this.state.dirty && !this.state.done) { e.preventDefault(); e.returnValue = ''; }
    });
    this.built = true;
  },

  enter() {
    if (!this.built) this.build();
    if (!this.started) { this.started = true; this.startNew(); this.checkDraft(); }
    this.renderBanners();
  },
  leave() { if (this.state.mode === 'new' && this.state.dirty && !this.state.done) this.saveDraft(false); },

  /* ---------- rendering ---------- */
  renderSection(sec, idx) {
    const total = SCHEMA.sections.length + 1;
    const sc = sec.scale;
    let criteria = '';
    if (sc && sc.type === 'likert') criteria = `<div><b>${esc(sec.criteriaTitle || 'เกณฑ์การให้คะแนน')}</b><div class="legend-table">${sc.options.map(o => `<span>${o.value} = ${esc(o.label)}</span>`).join('')}</div></div>`;
    if (sc && sc.type === 'scale') criteria = `<div class="legend-table"><span>${esc(sc.minLabel)}</span><span>${esc(sc.maxLabel)}</span></div>`;
    const ins = (sec.instructions || []).length ? `<details class="instructions" open><summary>${icon('info', 18)} คำชี้แจง</summary><div class="ins-body">${sec.instructions.map(p => `<p>${esc(p)}</p>`).join('')}${criteria}</div></details>` : '';
    const nItems = itemsOf(sec.id).length;
    const doc = sec.document ? `<div class="consent-doc" tabindex="0" aria-label="${esc(sec.document.title)}" style="margin-top:14px">
        <div class="cd-meta">${esc(sec.document.meta)}</div><h3>${esc(sec.document.title)}</h3><div class="cd-title">${esc(sec.document.subtitle)}</div>
        ${sec.document.paragraphs.map(p => `<p>${esc(p)}</p>`).join('')}</div>` : '';
    const head = `<div class="card section-head">
      <p class="eyebrow">ขั้นตอนที่ ${idx + 1} จาก ${total}${sec.partTitle ? ' · ' + esc(sec.partTitle) : ''}</p>
      <h2 tabindex="-1">${icon(sec.icon, 22)}${esc(sec.title)}</h2>
      <p class="full-title">${esc(sec.fullTitle || '')}</p>
      ${sec.showIf ? `<div class="notice info" style="margin-top:14px">${icon('info')}<div>${esc(sec.skipText)}</div></div>` : ''}
      ${ins}${doc}
      ${nItems ? `<div class="sec-progress"><span data-sec-count="${sec.id}">0/${nItems} ข้อ</span><div class="linebar"><i data-sec-bar="${sec.id}" style="width:0%"></i></div></div>` : ''}
    </div>`;
    let body = '';
    if (sec.fields) {
      const blocks = {};
      sec.fields.forEach(f => { (blocks[f.block || 'main'] ||= []).push(FIELD_MAP[f.name]); });
      body = Object.entries(blocks).map(([b, fs]) => `<div class="card card-pad">${sec.blocks?.[b] ? `<h3 style="margin-bottom:${sec.blockNotes?.[b] ? 6 : 14}px">${esc(sec.blocks[b])}</h3>` : ''}${sec.blockNotes?.[b] ? `<p class="small muted" style="margin-bottom:14px;text-indent:2em">${esc(sec.blockNotes[b])}</p>` : ''}<div class="fields-grid">${fs.map(f => this.renderField(f)).join('')}</div></div>`).join('');
    }
    if (sec.prefix) {
      const groups = sec.groups || [{ id: null }];
      body += groups.map(g => {
        const fs = itemsOf(sec.id).filter(f => !g.id || f.domain === g.id);
        return `${g.title ? `<div class="group-head">${esc(g.title)}<span class="gh-line"></span><span class="badge">${fs.length} ข้อ</span></div>` : ''}<div class="items">${fs.map(f => this.renderItem(f)).join('')}</div>`;
      }).join('');
    }
    if (sec.showIf) body = `<div class="stack" data-sec-body="${sec.id}">${body}</div>
      <div class="card skip-card" data-sec-skip="${sec.id}" hidden><div class="big-ic">${icon('check', 30)}</div><h3>ไม่ต้องตอบส่วนนี้</h3><p class="muted">${esc(sec.skipText)}</p></div>`;
    return head + body;
  },

  renderField(f) {
    const isGroup = ['radio', 'checkbox', 'rating', 'likert', 'scale', 'truefalse'].includes(f.type);
    const badge = f.origin === 'protocol' ? `<span class="badge b-info" title="ตัวแปรเพิ่มเติมตามรูปแบบการวิจัย ไม่มีในแบบสอบถามต้นฉบับ">ตามรูปแบบการวิจัย</span>` : '';
    const qno = f.q && !f.inline ? `<span class="q-no" style="min-width:28px;height:28px;font-size:.82rem">${f.q}</span>` : '';
    const label = `${qno}${esc(f.label)}${f.required ? '<span class="req" aria-hidden="true">*</span>' : ''}${badge}`;
    const copy = f.copyFrom ? `<button type="button" class="btn btn-ghost btn-sm" data-copy-from="${f.copyFrom}" data-copy-to="${f.name}" style="justify-self:start">${icon('copy', 15)}ใช้ชื่อเดียวกับ “${esc(FIELD_MAP[f.copyFrom].label)}”</button>` : '';
    const help = f.help ? `<div class="help" id="help_${f.name}">${esc(f.help)}</div>` : '';
    const tail = `${copy}${help}<div class="err" id="err_${f.name}"></div><div class="soft-warn" id="warn_${f.name}"></div>`;
    const span = (isGroup && f.type !== 'rating') || ['textarea', 'signature', 'toggle'].includes(f.type) || f.inline ? ' span-all' : '';
    const cls = `field${span}${f.inline ? ' inline-cond' : ''}`;
    if (isGroup) return `<fieldset class="${cls}" data-field="${f.name}" style="border:0;padding:0;margin:0;min-width:0"><legend class="field-label" style="padding:0;margin-bottom:6px">${label}</legend>${this.renderControl(f)}${tail}</fieldset>`;
    if (f.type === 'signature') return `<div class="${cls}" data-field="${f.name}" role="group" aria-labelledby="lbl_${f.name}"><div class="field-label" id="lbl_${f.name}">${label}</div>${this.renderControl(f)}${tail}</div>`;
    return `<div class="${cls}" data-field="${f.name}"><label class="field-label" for="f_${f.name}">${label}</label>${this.renderControl(f)}${tail}</div>`;
  },

  renderItem(f) {
    return `<fieldset class="q" data-field="${f.name}" id="q_${f.name}" style="margin:0;min-width:0">
      <legend class="sr-only">ข้อ ${f.itemNo}: ${esc(f.text)}</legend>
      <div class="q-head" aria-hidden="true"><span class="q-no">${f.itemNo}</span><div class="q-text">${esc(f.text)}</div></div>
      ${this.renderControl(f)}
      <div class="err" id="err_${f.name}"></div>
    </fieldset>`;
  },

  renderControl(f) {
    const n = f.name, desc = `aria-describedby="err_${n}${f.help ? ' help_' + n : ''}"`;
    switch (f.type) {
      case 'scale': {
        const sc = SECTION_MAP[f.section]?.scale || {}, opts = [];
        for (let v = f.min; v <= f.max; v++) opts.push(`<label class="opt"><input type="radio" name="${n}" value="${v}" ${desc} aria-label="${v}"><span class="opt-body">${v}</span></label>`);
        return `<div class="nrs">${opts.join('')}</div><div class="nrs-scale" aria-hidden="true"></div><div class="nrs-anchors" aria-hidden="true"><span>${esc(sc.minLabel || f.min)}</span><span>${esc(sc.maxLabel || f.max)}</span></div>`;
      }
      case 'likert':
        return `<div class="likert">${f.options.map(o => `<label class="opt"><input type="radio" name="${n}" value="${o.value}" ${desc} aria-label="${o.value} ${esc(o.label)}"><span class="opt-body"><span class="l-num">${o.value}</span><span class="l-lbl">${esc(o.label)}</span></span></label>`).join('')}</div>`;
      case 'truefalse':
        return `<div class="tf">${f.options.map(o => `<label class="opt"><input type="radio" name="${n}" value="${esc(o.value)}" ${desc}><span class="opt-body"><span class="tf-ic">${icon(o.value === 'T' ? 'check' : 'x', 16)}</span>${esc(o.label)}</span></label>`).join('')}</div>`;
      case 'radio': case 'checkbox': {
        const type = f.type === 'radio' ? 'radio' : 'checkbox';
        const style = f.layout === 'wide' ? ' style="grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))"' : '';
        return `<div class="opts"${style}>${f.options.map(o => `<label class="opt"><input type="${type}" name="${n}" value="${esc(o.value)}" ${desc}><span class="opt-body"><span class="opt-mark">${type === 'checkbox' ? icon('check', 14) : ''}</span><span class="opt-text">${esc(o.label)}${o.hint ? `<small>${esc(o.hint)}</small>` : ''}</span></span></label>`).join('')}</div>`;
      }
      case 'select':
        return `<select class="select" id="f_${n}" name="${n}" ${desc}><option value="">— เลือก —</option>${f.options.map(o => `<option value="${esc(o.value)}">${esc(o.label)}</option>`).join('')}</select>`;
      case 'toggle':
        return `<label class="switch"><input type="checkbox" id="f_${n}" name="${n}" ${desc}><span class="track"></span><span>${esc(f.toggleLabel || 'ใช่')}</span></label>`;
      case 'rating': {
        const max = f.max || 5, stars = [];
        for (let v = max; v >= 1; v--) stars.push(`<input type="radio" id="f_${n}_${v}" name="${n}" value="${v}"><label for="f_${n}_${v}" title="${v} ดาว" aria-label="${v} ดาว">★</label>`);
        return `<div class="rating">${stars.join('')}</div>`;
      }
      case 'textarea':
        return `<textarea class="textarea" id="f_${n}" name="${n}" ${f.maxLength ? `maxlength="${f.maxLength}"` : ''} placeholder="${esc(f.placeholder || '')}" ${desc}></textarea>`;
      case 'signature':
        return `<div class="sig" data-sig="${n}">
          <div class="sig-pad"><canvas aria-label="พื้นที่ลงลายมือชื่อ: ${esc(f.label)}"></canvas><div class="sig-line"></div><div class="sig-hint">ลงลายมือชื่อในกรอบนี้ (ใช้นิ้ว ปากกา หรือเมาส์)</div></div>
          <div class="sig-actions"><button type="button" class="btn btn-ghost btn-sm" data-sig-clear="${n}">${icon('reset', 15)}ล้างลายมือชื่อ</button><span data-sig-status="${n}">ยังไม่ได้ลงนาม</span></div>
          <input type="hidden" id="f_${n}" name="${n}" ${desc}></div>`;
      case 'number': if (f.unit) {
        return `<div class="input-group"><input class="input" id="f_${n}" name="${n}" type="number" ${f.integer ? 'step="1"' : ''} ${f.min != null ? `min="${f.min}"` : ''} ${f.max != null ? `max="${f.max}"` : ''} inputmode="${f.inputmode || 'decimal'}" autocomplete="off" ${desc}><span class="suffix">${esc(f.unit)}</span></div>`;
      } // eslint-disable-line no-fallthrough
      default: {
        const attrs = [`type="${f.type}"`, f.placeholder ? `placeholder="${esc(f.placeholder)}"` : '', f.maxLength ? `maxlength="${f.maxLength}"` : '', f.inputmode ? `inputmode="${f.inputmode}"` : '',
          f.type === 'date' && f.maxToday ? `max="${todayISO()}"` : '', f.type === 'date' && CONFIG.FORM.minDate ? `min="${CONFIG.FORM.minDate}"` : '',
          f.type === 'number' && f.min != null ? `min="${f.min}"` : '', f.type === 'number' && f.max != null ? `max="${f.max}"` : '', f.transform === 'upper' ? 'style="text-transform:uppercase"' : ''].filter(Boolean).join(' ');
        return `<input class="input" id="f_${n}" name="${n}" ${attrs} autocomplete="off" spellcheck="false" ${desc}>`;
      }
    }
  },

  /* ---------- values ---------- */
  readValue(f) {
    const form = $('#mainForm');
    if (RADIO_TYPES.includes(f.type)) { const c = form.querySelector(`input[name="${f.name}"]:checked`); return c ? (NUMERIC_TYPES.includes(f.type) ? Number(c.value) : c.value) : ''; }
    if (f.type === 'checkbox') return $$(`input[name="${f.name}"]:checked`, form).map(i => i.value);
    const el = $('#f_' + f.name); if (!el) return '';
    if (f.type === 'toggle') return el.checked ? 'Y' : 'N';
    if (f.type === 'number') return el.value === '' ? '' : Number(el.value);
    return el.value;
  },
  writeValue(f, v) {
    const form = $('#mainForm');
    if (RADIO_TYPES.includes(f.type)) { $$(`input[name="${f.name}"]`, form).forEach(i => { i.checked = !isBlank(v) && String(i.value) === String(v); }); return; }
    if (f.type === 'checkbox') { const arr = asList(v); $$(`input[name="${f.name}"]`, form).forEach(i => { i.checked = arr.includes(i.value); }); return; }
    const el = $('#f_' + f.name); if (!el) return;
    if (f.type === 'toggle') { el.checked = v === 'Y' || v === true; return; }
    if (f.type === 'signature') { el.value = isSignature(v) ? v : ''; SignaturePad.show(f.name, el.value); return; }
    el.value = isBlank(v) ? '' : v;
  },
  /* คำตอบนับว่า “ตอบแล้ว” — toggle ที่ต้องยืนยัน ต้องเป็น Y เท่านั้น */
  answered(f, d = this.state.data) { return f.type === 'toggle' && f.mustBeTrue ? d[f.name] === 'Y' : !isBlank(d[f.name]); },
  setData(data) {
    this.state.data = {};
    INPUT_FIELDS.forEach(f => { const v = data?.[f.name]; const val = f.type === 'checkbox' ? asList(v) : f.type === 'toggle' ? (v === 'Y' ? 'Y' : 'N') : (v ?? ''); this.state.data[f.name] = NUMERIC_TYPES.includes(f.type) && !isBlank(val) ? Number(val) : val; this.writeValue(f, val); });
    this.clearErrors();
    this.applyConditions();
    INPUT_FIELDS.forEach(f => this.markAnswered(f));
    this.renderWarnings();
    this.updateProgress();
  },

  onInput(e) {
    const t = e.target, f = FIELD_MAP[t.name];
    if (!f || !f.input || this.state.done) return;
    if (f.transform === 'upper' && t.value !== t.value.toUpperCase()) { const p = t.selectionStart; t.value = t.value.toUpperCase(); try { t.setSelectionRange(p, p); } catch (err) { } }
    // ตัวเลือก exclusive (เช่น “ไม่เคยได้รับ/ไม่ทราบ”) เลือกร่วมกับข้ออื่นไม่ได้
    if (f.type === 'checkbox' && t.type === 'checkbox' && t.checked) {
      const op = f.options.find(o => String(o.value) === t.value);
      $$(`#mainForm input[name="${f.name}"]`).forEach(i => { if (i !== t && (op?.exclusive || f.options.find(o => String(o.value) === i.value)?.exclusive)) i.checked = false; });
    }
    this.state.data[f.name] = this.readValue(f);
    this.state.dirty = true;
    // ไม่เคยได้รับยาระงับความรู้สึก → เลือก “ไม่เคยได้รับ/ไม่ทราบ” ให้อัตโนมัติ
    if (f.name === 'anesthesia_history' && String(this.state.data.anesthesia_history) === '0' && e.type === 'change') {
      this.state.data.anesthesia_methods = ['none']; this.writeValue(FIELD_MAP.anesthesia_methods, ['none']); this.validateOne('anesthesia_methods');
    }
    if (f.name === 'participant_code' && e.type === 'change') this.autoGroup();
    if (this.state.errors[f.name]) this.validateOne(f.name);
    if (['participant_code', 'study_group'].includes(f.name) && this.state.errors.study_group) this.validateOne('study_group');
    if (['study_group', 'assessment_round', 'participant_code'].includes(f.name) && this.state.errors.assessment_round) this.validateOne('assessment_round');
    this.applyConditions();
    this.markAnswered(f);
    this.renderWarnings();
    this.updateProgress();
    if (e.type === 'change' && f.itemNo && CONFIG.FORM.autoScrollNext) this.scrollNext(f);
    this.autosave();
  },

  /* คำเตือนความสอดคล้องของข้อมูล (ไม่บังคับ) ใต้ช่องที่เกี่ยวข้อง */
  renderWarnings() {
    const w = crossWarnings(this.state.data), map = Object.fromEntries(w.map(x => [x.field, x.message]));
    $$('#mainForm .soft-warn').forEach(el => { const k = el.id.slice(5); el.innerHTML = map[k] ? icon('warn', 15) + esc(map[k]) : ''; });
    return w;
  },

  autoGroup() {
    const code = String(this.state.data.participant_code || '').toUpperCase().trim();
    const g = CONFIG.FORM.codePrefixGroup[code.charAt(0)];
    if (g && new RegExp(CONFIG.FORM.codePattern).test(code) && this.state.data.study_group !== g) {
      this.state.data.study_group = g; this.writeValue(FIELD_MAP.study_group, g);
      this.markAnswered(FIELD_MAP.study_group); this.validateOne('study_group');
      Toast.show(`เลือก “${groupLabel(g)}” ให้อัตโนมัติตามรหัส ${code}`, 'info');
    }
  },

  applyConditions() {
    const d = this.state.data;
    SCHEMA.sections.forEach(sec => {
      if (!sec.showIf) return;
      const vis = isSectionVisible(sec, d);
      const body = $(`[data-sec-body="${sec.id}"]`), skip = $(`[data-sec-skip="${sec.id}"]`);
      if (body) body.hidden = !vis; if (skip) skip.hidden = vis;
    });
    INPUT_FIELDS.forEach(f => { if (f.showIf && !f.itemNo) { const el = $(`[data-field="${f.name}"]`); if (el) el.hidden = !isVisible(f, d); } });
  },

  markAnswered(f) { if (!f.itemNo) return; const q = $('#q_' + f.name); if (q) q.classList.toggle('answered', !isBlank(this.state.data[f.name])); },

  scrollNext(f) {
    const q = $('#q_' + f.name); if (!q) return;
    let next = q.nextElementSibling;
    while (next && !next.classList.contains('q')) next = next.nextElementSibling;
    if (!next || !isBlank(this.state.data[next.dataset.field])) return;
    const r = next.getBoundingClientRect();
    if (r.top > window.innerHeight * 0.62) setTimeout(() => next.scrollIntoView({ behavior: 'smooth', block: 'center' }), 120);
  },

  /* ---------- progress / stepper ---------- */
  progress() {
    const d = this.state.data; let total = 0, done = 0;
    INPUT_FIELDS.forEach(f => { if (!f.required || !isVisible(f, d)) return; total++; if (this.answered(f, d)) done++; });
    return { total, done, pct: total ? Math.round(done / total * 100) : 0 };
  },
  sectionStatus(sec) {
    const d = this.state.data;
    if (!isSectionVisible(sec, d)) return { state: 'skipped', done: 0, total: 0 };
    const fs = INPUT_FIELDS.filter(f => f.section === sec.id && f.required && isVisible(f, d));
    const done = fs.filter(f => this.answered(f, d)).length;
    const hasErr = fs.some(f => this.state.errors[f.name]);
    return { state: hasErr ? 'error' : (done === fs.length ? 'complete' : done ? 'partial' : 'empty'), done, total: fs.length };
  },
  updateProgress() {
    const p = this.progress(), C = 2 * Math.PI * 27;
    $('#ringFg').setAttribute('stroke-dashoffset', String(C * (1 - p.pct / 100)));
    $('#ringVal').textContent = p.pct + '%';
    $('#progressText').textContent = p.done ? `ตอบแล้ว ${p.done} จาก ${p.total} ข้อ` : `ทั้งหมด ${p.total} ข้อ`;
    const bar = $('#progressBar'); bar.firstElementChild.style.width = p.pct + '%'; bar.setAttribute('aria-valuenow', p.pct);
    SCHEMA.sections.forEach(sec => {
      const c = $(`[data-sec-count="${sec.id}"]`); if (!c) return;
      const items = itemsOf(sec.id), done = items.filter(f => !isBlank(this.state.data[f.name])).length;
      c.textContent = `ตอบแล้ว ${done}/${items.length} ข้อ`;
      $(`[data-sec-bar="${sec.id}"]`).style.width = (items.length ? done / items.length * 100 : 0) + '%';
    });
    this.renderStepper();
  },
  renderStepper() {
    $('#stepper').innerHTML = this.steps.map((st, i) => {
      const s = st.section ? this.sectionStatus(st.section) : { state: 'review' };
      const cur = i === this.state.step;
      const dot = s.state === 'complete' ? icon('check', 16) : s.state === 'error' ? '!' : String(i + 1);
      const meta = st.section ? (s.state === 'skipped' ? 'ไม่ต้องตอบ' : `${s.done}/${s.total} รายการ`) : 'ตรวจทานก่อนบันทึก';
      return `<li class="${cur ? 'current ' : ''}st-${s.state}"><button type="button" data-goto="${i}" ${cur ? 'aria-current="step"' : ''}><span class="s-dot">${dot}</span><span class="s-text"><span class="s-title">${esc(st.short)}</span><span class="s-meta">${meta}</span></span></button></li>`;
    }).join('');
    const cur = $('#stepper li.current'), sp = $('#stepper');
    if (cur && sp.scrollWidth > sp.clientWidth) sp.scrollLeft = cur.offsetLeft - sp.clientWidth / 2 + cur.clientWidth / 2;
  },

  /* ---------- navigation ---------- */
  goStep(i) {
    i = clamp(i, 0, this.steps.length - 1);
    this.state.step = i;
    $$('#mainForm .step-panel').forEach(p => { p.hidden = +p.dataset.step !== i; });
    SignaturePad.refresh($$('#mainForm .step-panel')[i]);   // ปรับขนาดแผ่นลงนามเมื่อหมวดถูกแสดง (ขนาดจริงทราบหลัง unhide)
    if (this.steps[i].id === 'review') this.renderReview();
    this.updateButtons(); this.renderStepper();
    const top = $('#formLayout').getBoundingClientRect().top + window.scrollY - 90;
    if (window.scrollY > top) window.scrollTo({ top, behavior: 'smooth' });
  },
  async next() {
    const st = this.steps[this.state.step];
    if (st.section) {
      const errs = validateRecord(this.state.data, INPUT_FIELDS.filter(f => f.section === st.section.id));
      if (errs.length) { this.showErrors(errs); Toast.show(`กรุณาตอบ/แก้ไขให้ครบ ${errs.length} รายการ ก่อนไปขั้นตอนถัดไป`, 'warn', { title: 'ยังไม่ครบถ้วน' }); this.focusField(errs[0].field); return; }
      if (st.section.id === 'study') {
        const d = this.state.data, btn = $('#btnNext'); btn.disabled = true;
        try {
          const dup = await DataService.checkDuplicate(d.participant_code, d.assessment_round, this.state.mode === 'edit' ? this.state.recordId : '');
          if (dup) { this.showErrors([{ field: 'assessment_round', message: `รหัส ${d.participant_code} มีข้อมูลครั้ง “${roundLabelShort(d.assessment_round)}” แล้ว${dup.record_id ? ' (' + dup.record_id + ')' : ''} — ป้องกันข้อมูลซ้ำ` }]); this.focusField('assessment_round'); return; }
        } finally { btn.disabled = false; }
      }
    }
    let n = this.state.step + 1;
    while (n < this.steps.length - 1 && this.steps[n].section && !isSectionVisible(this.steps[n].section, this.state.data)) n++;
    this.goStep(n);
  },
  prev() {
    let n = this.state.step - 1;
    while (n > 0 && this.steps[n].section && !isSectionVisible(this.steps[n].section, this.state.data)) n--;
    this.goStep(n);
  },
  updateButtons() {
    const last = this.state.step === this.steps.length - 1;
    $('#btnPrev').disabled = this.state.step === 0;
    $('#btnNext').hidden = last; $('#btnSubmit').hidden = !last;
    $('#btnDraft').hidden = this.state.mode === 'edit';
    $('#btnSubmitLabel').textContent = this.state.mode === 'edit' ? 'บันทึกการแก้ไข' : 'บันทึกข้อมูล';
    $('#btnClear').title = this.state.mode === 'edit' ? 'คืนค่าเดิมก่อนแก้ไข' : 'ล้างข้อมูลในแบบฟอร์ม';
  },
  stepOfField(name) { const f = FIELD_MAP[name]; const i = this.steps.findIndex(st => st.section && st.section.id === f?.section); return i < 0 ? this.state.step : i; },

  /* ---------- errors ---------- */
  clearErrors() { this.state.errors = {}; this.state.showErrors = false; $$('#mainForm .has-error').forEach(el => el.classList.remove('has-error')); $$('#mainForm .err').forEach(el => { el.textContent = ''; }); },
  setError(name, msg) {
    const box = $(`#mainForm [data-field="${name}"]`), err = $('#err_' + name);
    if (msg) { this.state.errors[name] = msg; box?.classList.add('has-error'); if (err) err.innerHTML = icon('warn', 15) + esc(msg); }
    else { delete this.state.errors[name]; box?.classList.remove('has-error'); if (err) err.textContent = ''; }
  },
  showErrors(errs) { this.state.showErrors = true; errs.forEach(e => this.setError(e.field, e.message)); this.renderStepper(); },
  validateOne(name) {
    const f = FIELD_MAP[name];
    const m = name === 'study_group' ? (validateRecord(this.state.data, [f])[0]?.message || null) : validateField(f, this.state.data);
    this.setError(name, m);
  },
  focusField(name) {
    const box = $(`#mainForm [data-field="${name}"]`); if (!box) return;
    if (box.closest('.step-panel')?.hidden) this.goStep(this.stepOfField(name));
    setTimeout(() => { box.scrollIntoView({ behavior: 'smooth', block: 'center' }); box.querySelector('input,select,textarea')?.focus({ preventScroll: true }); }, 60);
  },

  /* ---------- review ---------- */
  displayValue(f, v) {
    if (f.type === 'toggle') return v === 'Y' ? 'ยืนยันแล้ว' : 'ยังไม่ยืนยัน';
    if (isBlank(v)) return '–';
    if (f.type === 'date') return fmtDate(v);
    if (f.type === 'signature') return isSignature(v) ? 'ลงนามแล้ว' : '–';
    if (f.type === 'likert' || f.type === 'scale') return String(v);
    if (f.options) return optLabel(f, v);
    return String(v) + (f.unit ? ' ' + f.unit : '');
  },
  renderReview() {
    const d = this.state.data, errs = validateRecord(d), warns = crossWarnings(d);
    const p = this.progress();
    const errSet = new Set(errs.map(e => e.field));
    const showScores = CONFIG.FORM.showScoresToRespondent || (this.state.mode === 'edit' && Session.valid());
    const sc = Scoring.compute(normalizeRecord(d));
    const fname = f => f.itemNo ? SECTION_MAP[f.section].title + ' ข้อ ' + f.itemNo : (f.q ? `ข้อ ${f.q} ` : '') + f.label;
    let html = `<div class="card section-head"><p class="eyebrow">ขั้นตอนสุดท้าย</p><h2 tabindex="-1">${icon('check', 22)}ตรวจสอบข้อมูลก่อนบันทึก</h2>
      <p class="full-title">ตอบแล้ว ${p.done} จาก ${p.total} ข้อ (${p.pct}%) — แตะที่รายการเพื่อกลับไปแก้ไข</p>
      <div class="stack" style="margin-top:14px">${errs.length
        ? `<div class="notice danger">${icon('warn')}<div><b>ยังมี ${errs.length} รายการที่ต้องแก้ไข</b><div class="small">${errs.slice(0, 6).map(e => esc(fname(FIELD_MAP[e.field]) + ': ' + e.message)).join('<br>')}${errs.length > 6 ? '<br>…' : ''}</div></div></div>`
        : `<div class="notice ok">${icon('verified')}<div><b>ข้อมูลครบถ้วน พร้อมบันทึก</b><div class="small">ระบบจะสร้างรหัสรายการและบันทึกวันเวลาให้อัตโนมัติ</div></div></div>`}
        ${warns.length ? `<div class="notice warn">${icon('info')}<div><b>โปรดตรวจทาน ${warns.length} รายการ (บันทึกได้)</b><div class="small">${warns.map(w => `<a href="javascript:void 0" data-goto-field="${w.field}">${esc(fname(FIELD_MAP[w.field]))}</a>: ${esc(w.message)}`).join('<br>')}</div></div></div>` : ''}</div></div>`;
    // หมวดที่เป็นช่องกรอก (ข้อมูลการวิจัย / หนังสือยินยอม / ข้อมูลทั่วไป)
    SCHEMA.sections.filter(s => s.fields).forEach(sec => {
      if (!isSectionVisible(sec, d)) { html += `<div class="card card-pad"><div class="row"><h3>${esc(sec.title)}</h3><span class="badge">ไม่ต้องตอบ</span></div><p class="small muted" style="margin-top:6px">${esc(sec.skipText || '')}</p></div>`; return; }
      const fs = fieldsOf(sec.id).filter(f => isVisible(f, d));
      const val = f => f.type === 'signature' && isSignature(d[f.name]) ? sigImg(d[f.name]) : esc(this.displayValue(f, d[f.name]));
      html += `<div class="card card-pad"><h3 style="margin-bottom:12px">${esc(sec.partTitle ? sec.partTitle + ' ' + sec.title : sec.title)}</h3><dl class="kv">${fs.map(f => `<dt>${f.q && !f.inline ? f.q + '. ' : ''}${esc(f.label)}</dt><dd>${errSet.has(f.name) ? `<a href="javascript:void 0" data-goto-field="${f.name}" style="color:var(--danger-text)">${esc(this.displayValue(f, d[f.name]))} — แก้ไข</a>` : val(f)}</dd>`).join('')}</dl></div>`;
    });
    SCHEMA.sections.filter(s => s.prefix).forEach(sec => {
      const items = itemsOf(sec.id);
      if (!isSectionVisible(sec, d)) { html += `<div class="card card-pad"><div class="row"><h3>${esc(sec.title)}</h3><span class="badge">ไม่ต้องตอบ</span></div><p class="small muted" style="margin-top:6px">${esc(sec.skipText || '')}</p></div>`; return; }
      const done = items.filter(f => !isBlank(d[f.name])).length;
      const chips = items.map(f => { const v = d[f.name], miss = isBlank(v); return `<button type="button" class="ans-chip${miss ? ' missing' : ''}" data-goto-field="${f.name}" title="${esc(f.text)}">ข้อ ${f.itemNo} <b>${miss ? '–' : esc(f.type === 'truefalse' ? optLabel(f, v) : v)}</b></button>`; }).join('');
      let scoreLine = '';
      if (showScores) {
        if (sec.id === 'anxiety') scoreLine = `คะแนนรวม ${fmtInt(toNum(sc.anx_total))} / 100 (เฉลี่ย ${fmtNum(toNum(sc.anx_mean))})`;
        if (sec.id === 'confidence') scoreLine = `คะแนนรวม ${fmtInt(toNum(sc.conf_total))} / 100 ${sc.conf_level ? '· ' + sc.conf_level : ''}`;
        if (sec.id === 'knowledge') scoreLine = `คะแนน ${fmtInt(toNum(sc.know_score))} / 15 ${sc.know_level ? '· ' + sc.know_level : ''}`;
      }
      html += `<div class="card card-pad"><div class="row"><h3>${esc(sec.title)}</h3><span class="badge ${done === items.length ? 'b-ok' : 'b-warn'}">${done}/${items.length} ข้อ</span>${scoreLine ? `<span class="spacer"></span><span class="badge b-brand">${esc(scoreLine)}</span>` : ''}</div><div class="ans-grid">${chips}</div></div>`;
    });
    html += `<div class="notice">${icon('lock')}<div class="small">${esc(CONFIG.PRIVACY.notice)}</div></div>`;
    $('#reviewPanel').innerHTML = html;
  },

  /* ---------- save ---------- */
  setBusy(b) {
    const btn = $('#btnSubmit');
    btn.disabled = b; btn.setAttribute('aria-busy', String(b));
    btn.innerHTML = b ? `<span class="spinner"></span><span id="btnSubmitLabel">กำลังบันทึก…</span>` : `${icon('send', 18)}<span id="btnSubmitLabel">${this.state.mode === 'edit' ? 'บันทึกการแก้ไข' : 'บันทึกข้อมูล'}</span>`;
    ['#btnPrev', '#btnClear', '#btnNew', '#btnDraft'].forEach(s => { $(s).disabled = b || (s === '#btnPrev' && this.state.step === 0); });
  },
  async submit() {
    if (this.state.submitting) return;                    // ป้องกันการกดบันทึกซ้ำ
    const d = this.state.data, errs = validateRecord(d);
    if (errs.length) {
      this.showErrors(errs); this.renderReview();
      Toast.show(`พบ ${errs.length} รายการที่ต้องแก้ไขก่อนบันทึก`, 'warn', { title: 'ยังบันทึกไม่ได้' });
      return;
    }
    this.state.submitting = true; this.setBusy(true);
    try {
      if (this.state.mode === 'edit') {
        const old = this.state.original;
        const next = { ...old, ...normalizeRecord({ ...old, ...d }) };
        const changes = diffRecords(old, next);
        if (!Object.keys(changes).length) { Toast.show('ไม่มีการเปลี่ยนแปลงข้อมูล', 'info'); return; }
        const ok = await Dialog.confirm({ title: 'ยืนยันการแก้ไขข้อมูล', html: `<p>รายการ <b>${esc(old.record_id)}</b> จะถูกแก้ไข ${Object.keys(changes).length} ฟิลด์ และบันทึกลงประวัติการแก้ไข</p>${diffHtml(changes)}`, confirmText: 'บันทึกการแก้ไข' });
        if (!ok) return;
        const saved = await DataService.update(old.record_id, d, old.updated_at);
        this.showSuccess(saved, 'edit');
      } else {
        const rec = { ...d, record_id: this.state.recordId };
        try { const saved = await DataService.create(rec); this.clearDraft(); this.showSuccess(saved, 'new'); }
        catch (e) {
          if (e.isNetwork && DataService.mode === 'gas') {     // อินเทอร์เน็ต/API ขัดข้อง → เก็บเข้าคิวรอส่ง
            const queued = { ...normalizeRecord(rec), record_id: rec.record_id };
            Outbox.add(queued, e.message); this.clearDraft(); this.showSuccess(queued, 'queued'); return;
          }
          throw e;
        }
      }
    } catch (e) { this.handleSaveError(e); }
    finally { this.state.submitting = false; if (!this.state.done) this.setBusy(false); }
  },
  handleSaveError(e) {
    if (e.code === 'VALIDATION_ERROR' && Array.isArray(e.details)) { this.showErrors(e.details); this.renderReview(); Toast.show(e.message, 'error', { title: 'บันทึกไม่สำเร็จ' }); return; }
    if (e.code === 'DUPLICATE_ENTRY') { this.showErrors([{ field: 'assessment_round', message: e.message }]); Dialog.open({ title: 'ข้อมูลซ้ำ', body: `<div class="notice danger">${icon('warn')}<div>${esc(e.message)}</div></div><p class="small muted">ระบบป้องกันการบันทึกรหัสผู้เข้าร่วมวิจัยเดียวกันในครั้งที่ประเมินเดียวกันซ้ำ หากต้องการแก้ไขข้อมูลเดิม ให้ใช้เมนูผู้ดูแลระบบ</p>` }); return; }
    if (e.code === 'CONFLICT') { Dialog.open({ title: 'ข้อมูลถูกแก้ไขโดยผู้อื่น', body: `<p>${esc(e.message)}</p>` }); return; }
    if (['AUTH_REQUIRED', 'INVALID_TOKEN', 'TOKEN_EXPIRED'].includes(e.code)) { Toast.show('เซสชันผู้ดูแลหมดอายุ กรุณาเข้าสู่ระบบใหม่', 'error'); Router.go('admin'); return; }
    Toast.show(e.message || String(e), 'error', { title: 'บันทึกไม่สำเร็จ' });
  },
  showSuccess(rec, kind) {
    this.state.done = true; this.state.dirty = false;
    $('#formLayout').classList.add('is-done');
    const demo = DataService.mode === 'demo';
    const title = kind === 'edit' ? 'บันทึกการแก้ไขสำเร็จ' : kind === 'queued' ? 'บันทึกไว้ชั่วคราว รอส่งข้อมูล' : 'บันทึกข้อมูลสำเร็จ';
    const desc = kind === 'queued' ? 'เชื่อมต่อ Google Sheets ไม่สำเร็จ ข้อมูลถูกเก็บในอุปกรณ์นี้และจะส่งให้อัตโนมัติเมื่อเชื่อมต่อได้ (ไม่เกิดข้อมูลซ้ำ)'
      : kind === 'edit' ? 'ระบบบันทึกวันเวลาและรายละเอียดการแก้ไขไว้ในประวัติแล้ว'
      : demo ? 'Demo Mode — ข้อมูลถูกจัดเก็บใน Local Storage ของเบราว์เซอร์นี้' : 'ข้อมูลถูกบันทึกลง Google Sheets เรียบร้อยแล้ว';
    const showScores = CONFIG.FORM.showScoresToRespondent || (kind === 'edit' && Session.valid());
    const box = $('#formSuccess');
    box.innerHTML = `<div class="card success-card">
      <div class="success-check${kind === 'queued' ? ' pending' : ''}">${icon(kind === 'queued' ? 'clock' : 'check', 44)}</div>
      <h2>${esc(title)}</h2><p class="muted" style="max-width:56ch">${esc(desc)}</p>
      <div class="code-pill"><span>${esc(rec.record_id)}</span><button type="button" class="btn btn-ghost btn-sm btn-icon" id="copyRid" aria-label="คัดลอกรหัสรายการ">${icon('copy', 16)}</button></div>
      <dl class="kv" style="text-align:left;margin-top:6px">
        <dt>รหัสผู้เข้าร่วมวิจัย</dt><dd>${esc(rec.participant_code)}</dd>
        <dt>กลุ่ม</dt><dd>${esc(groupLabel(rec.study_group))}</dd>
        <dt>ครั้งที่ประเมิน</dt><dd>${esc(optLabel(FIELD_MAP.assessment_round, rec.assessment_round))}</dd>
        <dt>วันที่ประเมิน</dt><dd>${esc(fmtDateLong(rec.assessment_date))}</dd>
        ${rec.updated_at ? `<dt>บันทึกเมื่อ</dt><dd>${esc(fmtDT(rec.updated_at))}</dd>` : ''}
        ${rec.assessment_round === 'pre' ? `<dt>หนังสือยินยอม</dt><dd>${rec.consent_agree === 'Y' ? 'ยินยอมเข้าร่วมการวิจัย' : '–'}${rec.consent_date ? ' · ' + esc(fmtDateLong(rec.consent_date)) : ''}</dd>` : ''}
        ${showScores ? `<dt>คะแนน</dt><dd>วิตกกังวล ${fmtInt(toNum(rec.anx_total))} · มั่นใจ ${fmtInt(toNum(rec.conf_total))} · ความรู้ ${fmtInt(toNum(rec.know_score))}/15</dd>` : ''}
      </dl>
      <div class="row" style="justify-content:center;margin-top:8px">
        <button type="button" class="btn btn-primary" id="sNew">${icon('plus', 18)}เริ่มรายการใหม่</button>
        <a class="btn btn-tonal" href="#/dashboard">${icon('chart', 18)}ไปที่ Dashboard</a>
        ${Session.valid() ? `<a class="btn btn-outline" href="#/admin">${icon('shield', 18)}กลับหน้าผู้ดูแล</a>` : ''}
      </div></div>`;
    box.hidden = false;
    $('#sNew').onclick = () => this.startNew();
    $('#copyRid').onclick = () => { navigator.clipboard?.writeText(rec.record_id).then(() => Toast.show('คัดลอกรหัสรายการแล้ว', 'success'), () => { }); };
    this.renderBanners();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    document.dispatchEvent(new CustomEvent('datachange'));
  },

  /* ---------- new / clear / edit / draft ---------- */
  startNew() {
    this.state = this.freshState();
    $('#formLayout').classList.remove('is-done');
    $('#formSuccess').hidden = true; $('#formSuccess').innerHTML = '';
    const t = todayISO();   // ค่าเริ่มต้นเป็นวันนี้ (แก้ไขได้)
    this.setData({ assessment_date: t, consent_date: t, consent_sign_date: t, researcher_sign_date: t });
    this.state.dirty = false;
    this.setBusy(false); this.goStep(0); this.renderBanners();
  },
  async clearForm() {
    if (this.state.mode === 'edit') {
      if (!await Dialog.confirm({ title: 'คืนค่าเดิม', message: 'ยกเลิกการเปลี่ยนแปลงทั้งหมด และคืนค่าข้อมูลเดิมของรายการนี้หรือไม่?', confirmText: 'คืนค่าเดิม' })) return;
      this.setData(this.state.original); this.state.dirty = false; this.goStep(this.state.step); return;
    }
    if (!await Dialog.confirm({ title: 'ล้างข้อมูล', message: 'ล้างคำตอบทั้งหมดในแบบฟอร์มนี้และลบร่างที่บันทึกไว้หรือไม่?', confirmText: 'ล้างข้อมูล', danger: true })) return;
    this.clearDraft(); this.startNew(); Toast.show('ล้างข้อมูลแล้ว', 'info');
  },
  async newRecord() {
    if (this.state.dirty && !this.state.done) {
      const msg = this.state.mode === 'edit' ? 'ออกจากการแก้ไขโดยไม่บันทึก และเริ่มรายการใหม่หรือไม่?' : 'เริ่มรายการใหม่หรือไม่? ข้อมูลที่ยังไม่บันทึกจะถูกเก็บเป็นร่าง (กู้คืนได้จากแถบแจ้งเตือน)';
      if (!await Dialog.confirm({ title: 'เริ่มรายการใหม่', message: msg, confirmText: 'เริ่มรายการใหม่' })) return;
      if (this.state.mode === 'new') this.saveDraft(false);
    }
    this.startNew(); this.checkDraft();
  },
  edit(rec) {
    if (!this.built) this.build();
    this.started = true;
    this.state = this.freshState();
    this.state.mode = 'edit'; this.state.recordId = rec.record_id; this.state.original = { ...rec };
    $('#formLayout').classList.remove('is-done'); $('#formSuccess').hidden = true;
    this.setData(rec); this.state.dirty = false;
    this.setBusy(false); this.goStep(0); this.renderBanners();
    Router.go('form');
  },
  saveDraft(manual) {
    if (this.state.mode !== 'new' || this.state.done) return;
    const has = INPUT_FIELDS.some(f => f.type !== 'date' && f.type !== 'toggle' && !isBlank(this.state.data[f.name]));
    if (!has) { if (manual) Toast.show('ยังไม่มีข้อมูลสำหรับบันทึกร่าง', 'info'); return; }
    // ไม่เก็บลายมือชื่อ (CONFIG.FORM.draftExcludeTypes) และชื่อ–นามสกุลจากหนังสือยินยอมในร่างบนอุปกรณ์ — กู้คืนร่างแล้วต้องกรอก/ลงนามส่วนนี้ใหม่
    const keep = k => { const f = FIELD_MAP[k]; return f && !CONFIG.FORM.draftExcludeTypes.includes(f.type) && !(f.sheet === 'consent' && f.pii); };
    const data = Object.fromEntries(Object.entries(this.state.data).filter(([k]) => keep(k)));
    const ok = LS.set('draft', { data, step: this.state.step, recordId: this.state.recordId, saved_at: isoLocal() });
    if (manual) Toast.show(ok ? 'บันทึกร่างไว้ในอุปกรณ์นี้แล้ว กลับมากรอกต่อได้ภายหลัง' : 'เบราว์เซอร์ไม่อนุญาตให้จัดเก็บข้อมูล ร่างจะอยู่จนกว่าจะปิดหน้านี้', ok ? 'success' : 'warn', { title: 'บันทึกร่าง' });
  },
  clearDraft() { LS.del('draft'); this.renderBanners(); },
  checkDraft() { this.renderBanners(); },
  restoreDraft() {
    const dr = LS.get('draft'); if (!dr) return;
    this.state = this.freshState();
    this.state.recordId = dr.recordId || newRecordId();
    $('#formLayout').classList.remove('is-done'); $('#formSuccess').hidden = true;
    this.setData(dr.data); this.state.dirty = true;
    this.goStep(dr.step || 0); this.renderBanners();
    Toast.show('กู้คืนร่างเรียบร้อย', 'success');
  },
  renderBanners() {
    const box = $('#formBanners'); if (!box) return;
    const parts = [];
    if (this.state?.mode === 'edit') {
      const o = this.state.original;
      parts.push(`<div class="notice info">${icon('edit')}<div><b>โหมดแก้ไขข้อมูล (ผู้ดูแลระบบ)</b><div class="small">รายการ ${esc(o.record_id)} · ${esc(o.participant_code)} · ครั้ง${esc(roundLabelShort(o.assessment_round))} — ระบบจะยืนยันก่อนบันทึกและเก็บประวัติการแก้ไข</div><div class="notice-actions"><button type="button" class="btn btn-sm btn-outline" data-banner="cancel-edit">${icon('x', 16)}ยกเลิกการแก้ไข</button></div></div></div>`);
    }
    const dr = LS.get('draft');
    if (dr && dr.data && this.state?.mode === 'new' && !this.state.dirty && !this.state.done) {
      parts.push(`<div class="notice warn">${icon('save')}<div><b>พบร่างที่บันทึกไว้</b><div class="small">บันทึกเมื่อ ${esc(fmtDT(dr.saved_at))}${dr.data.participant_code ? ' · รหัส ' + esc(dr.data.participant_code) : ''}</div><div class="notice-actions"><button type="button" class="btn btn-sm btn-tonal" data-banner="restore">${icon('restore', 16)}กู้คืนร่าง</button><button type="button" class="btn btn-sm btn-ghost" data-banner="discard">${icon('trash', 16)}ลบร่าง</button></div></div></div>`);
    }
    if (DataService.mode === 'demo' && !this.state?.done) parts.push(`<div class="notice">${icon('info')}<div class="small"><b>Demo Mode</b> — ยังไม่ได้เชื่อมต่อ Google Sheets ข้อมูลจะถูกบันทึกใน Local Storage ของเบราว์เซอร์นี้</div></div>`);
    box.innerHTML = parts.join('');
    box.hidden = !parts.length;
    box.onclick = async e => {
      const b = e.target.closest('[data-banner]'); if (!b) return;
      if (b.dataset.banner === 'restore') this.restoreDraft();
      if (b.dataset.banner === 'discard' && await Dialog.confirm({ title: 'ลบร่าง', message: 'ต้องการลบร่างที่บันทึกไว้หรือไม่?', confirmText: 'ลบร่าง', danger: true })) { this.clearDraft(); Toast.show('ลบร่างแล้ว', 'info'); }
      if (b.dataset.banner === 'cancel-edit') { if (this.state.dirty && !await Dialog.confirm({ title: 'ยกเลิกการแก้ไข', message: 'การเปลี่ยนแปลงที่ยังไม่บันทึกจะหายไป ต้องการยกเลิกหรือไม่?', confirmText: 'ยกเลิกการแก้ไข' })) return; this.startNew(); Router.go('admin'); }
    };
  },
};

/* แสดงรายการเปลี่ยนแปลง (เก่า → ใหม่) */
function diffHtml(changes) {
  const rows = Object.entries(changes).map(([k, [a, b]]) => {
    const f = FIELD_MAP[k] || { label: k };
    const name = f.itemNo ? `${SECTION_MAP[f.section].title} ข้อ ${f.itemNo}` : f.label;
    const show = v => isBlank(v) ? '(ว่าง)' : (f.options ? `${v} · ${optLabel(f, v)}` : String(v));
    return `<div><span class="muted">${esc(name)}<br><small>${esc(k)}</small></span><span><span class="diff-old">${esc(show(a))}</span> → <span class="diff-new">${esc(show(b))}</span></span></div>`;
  });

    $('#fFrom').value = ''; $('#fTo').value = ''; $('#fGroup').value = 'all'; $('#fRound').value = 'all'; $('#fStatus').value = 'all';
    this.table = { q: '', inst: 'all', sort: 'no', dir: 'asc' };
    this.syncPreset(); this.render(); Toast.show('รีเซ็ตตัวกรองแล้ว', 'info');
  },
  filtered() {
    const f = this.filters;
    return this.rows.filter(r => (f.group === 'all' || r.study_group === f.group) && (f.round === 'all' || r.assessment_round === f.round)
      && (f.status === 'all' || r.record_status === f.status) && (!f.from || r.assessment_date >= f.from) && (!f.to || r.assessment_date <= f.to));
  },
  groups() { return this.filters.group === 'all' ? GROUPS : [this.filters.group]; },
  rounds() { return this.filters.round === 'all' ? ROUNDS : [this.filters.round]; },
  cell(rows, g, r) { return rows.filter(x => (!g || x.study_group === g) && (!r || x.assessment_round === r)); },
  meanOf(rows, key) { const s = Stats.describe(rows.map(r => r[key])); return s.n >= CONFIG.PRIVACY.minCellSize ? s.mean : null; },

  /* ---------- render ---------- */
  render() {
    const body = $('#dashBody'); if (!body) return;
    const rows = this.filtered(), minN = CONFIG.PRIVACY.minCellSize;
    $('#fCount').textContent = `${fmtInt(rows.length)} จาก ${fmtInt(this.rows.length)} รายการ`;
    const lu = this.meta.last_updated;
    $('#dashUpdated').innerHTML = `${icon('clock', 15)} ข้อมูลอัปเดตล่าสุด ${esc(lu ? fmtDT(lu) : '–')} · โหลดเมื่อ ${esc(this.loadedAt ? fmtDT(this.loadedAt) : '–')} · แหล่งข้อมูล: ${DataService.mode === 'gas' ? 'Google Sheets' : 'Demo (Local Storage)'}`;
    Viz.destroyWithin(body);
    if (!this.rows.length) { body.innerHTML = `<div class="card privacy-block">${icon('inbox', 40)}<h3>ยังไม่มีข้อมูล</h3><p class="muted">เมื่อมีการบันทึกแบบประเมิน ผลสรุปจะแสดงที่นี่โดยอัตโนมัติ</p><a class="btn btn-primary" href="#/form">${icon('plus', 18)}บันทึกข้อมูลรายการแรก</a></div>`; return; }
    if (rows.length < minN) { body.innerHTML = `<div class="card privacy-block">${icon('lock', 40)}<h3>ข้อมูลตามตัวกรองมีน้อยเกินไป</h3><p class="muted" style="max-width:60ch">พบ ${rows.length} รายการ (น้อยกว่า ${minN} รายการ) ระบบซ่อนผลสรุปเพื่อป้องกันการระบุตัวบุคคลตามหลักการคุ้มครองข้อมูลส่วนบุคคล — ลองขยายช่วงวันที่หรือรีเซ็ตตัวกรอง</p><button type="button" class="btn btn-tonal" onclick="DashboardView.resetFilters()">${icon('reset', 18)}รีเซ็ตตัวกรอง</button></div>`; return; }
    const t = Viz.tok();
    const demoRows = rows.filter(r => r.assessment_round === 'pre');   // ข้อมูลทั่วไปบันทึกในการประเมินครั้งก่อนเท่านั้น
    if (!DEMO_VARS.some(v => v.key === this.demoVar)) this.demoVar = DEMO_VARS[0].key;
    body.innerHTML = `
      ${this.kpiHtml(rows)}
      <div class="grid-2">
        <div class="card card-pad"><div class="card-head"><div><h3>สรุปผลสำคัญ</h3><div class="sub">สถิติเชิงพรรณนาตามตัวกรองปัจจุบัน (ยังไม่ได้ทดสอบนัยสำคัญทางสถิติ)</div></div></div><ul class="insights">${this.insights(rows).map(i => `<li><span class="ii">${icon(i.icon, 16)}</span><span>${i.html}</span></li>`).join('')}</ul></div>
        <div class="card chart-card"><div class="card-head"><div><h3>เปรียบเทียบก่อน–หลัง จำแนกตามกลุ่ม</h3><div class="sub">ค่าเฉลี่ยคะแนนรวม · คลิกจุดเพื่อดูรายละเอียด</div></div></div>
          ${this.groups().length > 1 ? `<div class="legend">${this.groups().map(g => `<span><i style="background:${groupVar(g)}"></i>${esc(groupLabel(g))}</span>`).join('')}</div>` : ''}
          <div class="small-multiples">${['anx_total', 'conf_total', 'know_score'].map(k => `<div class="sm-cell"><h4>${esc(MEASURES[k].label)} <span class="muted small">(${esc(MEASURES[k].unit.slice(1))})</span></h4><div class="chart-box" id="hero-${k}"></div></div>`).join('')}</div>
          <button type="button" class="btn btn-ghost btn-sm no-print" data-toggle-table="hero" aria-pressed="false" style="margin-top:8px">${icon('table', 16)}ตาราง</button>
          <div class="table-wrap" id="hero-table" hidden style="margin-top:10px"></div>
        </div>
      </div>
      <nav class="jump-chips no-print" aria-label="ไปยังหมวด"><a href="#sec-demo" data-jump>ข้อมูลทั่วไป</a><a href="#sec-anx" data-jump>ความวิตกกังวล</a><a href="#sec-conf" data-jump>ความมั่นใจ</a><a href="#sec-know" data-jump>ความรู้</a><a href="#sec-trend" data-jump>แนวโน้ม</a><a href="#sec-items" data-jump>รายข้อ</a></nav>

      <div class="section-title" id="sec-demo"><h2>ข้อมูลทั่วไปของผู้เข้าร่วมวิจัย</h2><span class="line"></span><span class="badge">ส่วนที่ 1 · บันทึกในการประเมินครั้งก่อน · n = ${fmtInt(demoRows.length)}</span></div>
      ${demoRows.length >= minN ? `<div class="grid-2">
        <div class="card chart-card">
          <div class="card-head"><div><h3>การกระจายตามตัวแปร</h3><div class="sub">ร้อยละภายในกลุ่ม · ช่องที่มีน้อยกว่า ${minN} คนถูกซ่อน</div></div>
            <div class="row no-print"><select class="select input-sm" id="demoVar" aria-label="เลือกตัวแปรข้อมูลทั่วไป" style="width:auto;max-width:100%">${DEMO_VARS.map(v => `<option value="${v.key}" ${v.key === this.demoVar ? 'selected' : ''}>${v.q}. ${esc(v.label)}</option>`).join('')}</select>
            <button type="button" class="btn btn-ghost btn-sm" data-toggle-table="c-demo" aria-pressed="false" aria-controls="c-demo-table">${icon('table', 16)}ตาราง</button></div></div>
          ${this.groups().length > 1 ? `<div class="legend">${this.groups().map(g => `<span><i style="background:${groupVar(g)}"></i>${esc(groupLabel(g))}</span>`).join('')}</div>` : ''}
          <div class="chart-box tall" id="c-demo"></div>
          <div class="table-wrap" id="c-demo-table" hidden style="margin-top:12px"></div>
        </div>
        <div class="card card-pad"><div class="card-head"><div><h3>ตารางลักษณะทั่วไปของกลุ่มตัวอย่าง</h3><div class="sub">จำนวน (ร้อยละ) แยกตามกลุ่ม · “&lt; ${minN}” = ซ่อนเพื่อป้องกันการระบุตัวบุคคล · ตัวเลขส่วนบุคคลแสดงเป็นช่วง</div></div></div>
          <div class="table-wrap max-h" id="demoTable"></div></div>
      </div>` : `<div class="card privacy-block"><p class="muted">${this.filters.round === 'post' ? 'ข้อมูลทั่วไปบันทึกในการประเมิน “ก่อนให้ข้อมูล” — เลือกครั้งที่ประเมิน “ทุกครั้ง” หรือ “ก่อนให้ข้อมูล” เพื่อดูส่วนนี้' : `ยังมีข้อมูลทั่วไปไม่เพียงพอตามตัวกรองปัจจุบัน (ต้องมีอย่างน้อย ${minN} คน)`}</p></div>`}

      <div class="section-title" id="sec-anx"><h2>ความวิตกกังวล</h2><span class="line"></span><span class="badge">มาตรวัด 0–10 · 10 ข้อ</span></div>
      <div class="grid-2">
        ${chartCard({ id: 'c-anx-items', title: 'ค่าเฉลี่ยความวิตกกังวลรายประเด็น', sub: 'คะแนน 0–10 · คลิกแท่งเพื่อดูการกระจายคำตอบ', legend: this.rounds().map(r => ({ label: roundName(r), color: roundVar(r) })), height: 'tall' })}
        ${chartCard({ id: 'c-anx-dist', title: 'การกระจายคะแนนรวมความวิตกกังวล', sub: 'จำนวนแบบประเมินในแต่ละช่วงคะแนน (0–100)', legend: this.rounds().map(r => ({ label: roundName(r), color: roundVar(r) })), height: 'tall' })}
      </div>
      <div class="section-title" id="sec-conf"><h2>ความมั่นใจ</h2><span class="line"></span><span class="badge">Likert 5 ระดับ · 20 ข้อ · 4 ด้าน</span></div>
      <div class="grid-2">
        ${chartCard({ id: 'c-conf-dom', title: 'ค่าเฉลี่ยความมั่นใจรายด้าน', sub: 'ค่าเฉลี่ยต่อข้อ (1–5)', legend: this.rounds().map(r => ({ label: roundName(r), color: roundVar(r) })) })}
        ${chartCard({ id: 'c-conf-lvl', title: 'ระดับความมั่นใจ', sub: 'ร้อยละของแบบประเมินในแต่ละระดับ (เกณฑ์คะแนนรวม 20–46 / 47–73 / 74–100)', legend: CONFIG.SCORING.confidenceLevels.slice().reverse().map((b, i) => ({ label: `${b.label} (${b.range})`, color: `var(--ord-${[1, 3, 5][i]})` })) })}
      </div>
      <div class="section-title" id="sec-know"><h2>ความรู้</h2><span class="line"></span><span class="badge">ถูก–ผิด 15 ข้อ</span></div>
      <div class="grid-2">
        ${chartCard({ id: 'c-know-items', title: 'ร้อยละการตอบถูกรายข้อ', sub: 'คลิกแท่งเพื่อดูรายละเอียด (ไม่แสดงเฉลยเพื่อรักษาความเที่ยงของแบบทดสอบ)', legend: this.rounds().map(r => ({ label: roundName(r), color: roundVar(r) })), height: 'tall' })}
        ${chartCard({ id: 'c-know-lvl', title: 'ระดับความรู้', sub: 'ร้อยละของแบบประเมินในแต่ละระดับ (0–7 / 8–11 / 12–15 คะแนน)', legend: CONFIG.SCORING.knowledgeLevels.slice().reverse().map((b, i) => ({ label: `${b.label} (${b.range})`, color: `var(--ord-${[1, 3, 5][i]})` })) })}
      </div>
      <div class="section-title" id="sec-trend"><h2>แนวโน้มการเก็บข้อมูล</h2><span class="line"></span></div>
      ${chartCard({ id: 'c-trend', title: 'จำนวนแบบประเมินตามช่วงเวลา', sub: 'คลิกแท่งเพื่อกรองข้อมูลเฉพาะช่วงนั้น', legend: this.rounds().map(r => ({ label: roundName(r), color: roundVar(r) })) })}
      <div class="section-title" id="sec-items"><h2>ผลรายข้อทั้งหมด</h2><span class="line"></span></div>
      <div class="card card-pad" id="itemTableCard"></div>
      <div class="notice">${icon('lock')}<div class="small">Dashboard นี้ไม่มีชื่อ ลายมือชื่อ หนังสือยินยอม รหัสผู้เข้าร่วมวิจัย และรหัสรายการ · อายุ อายุครรภ์ และจำนวนการตั้งครรภ์/คลอด/บุตร แสดงเป็นช่วง · ซ่อนสถิติของกลุ่มย่อยที่มีน้อยกว่า ${minN} รายการ · ไม่แสดงเฉลยแบบทดสอบ</div></div>`;
    $$('[data-jump]', body).forEach(a => a.onclick = e => { e.preventDefault(); $(a.getAttribute('href'))?.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    this.mountCharts(rows, t);
    if (demoRows.length >= minN) { this.renderDemo(demoRows, t); $('#demoVar').onchange = e => { this.demoVar = e.target.value; this.renderDemo(demoRows, Viz.tok()); }; }
    this.renderItemTable(rows);
  },

  /* ---------- ข้อมูลทั่วไป (ส่วนที่ 1): กราฟตามตัวแปรที่เลือก + ตารางลักษณะกลุ่มตัวอย่าง (Table 1) ---------- */
  demoCell(count, n) { const minN = CONFIG.PRIVACY.minCellSize; if (!n) return '–'; if (count > 0 && count < minN) return `&lt; ${minN}`; return `${fmtInt(count)} <span class="muted small">(${fmtPct(count / n * 100)})</span>`; },
  renderDemo(demoRows, t) {
    const groups = this.groups(), minN = CONFIG.PRIVACY.minCellSize, v = DEMO_VARS.find(x => x.key === this.demoVar);
    const per = groups.map(g => ({ g, ...demoCounts(this.cell(demoRows, g), v) }));
    Viz.render({ id: 'c-demo', horizontal: true, labels: v.categories.map(c => c.label), catTitle: v.label, min: 0, max: 100, percent: true, valueFmt: x => fmtPct(x),
      datasets: per.map(p => ({ label: groupLabel(p.g), color: groupColor(p.g, t), data: p.counts.map(c => p.n < minN || (c > 0 && c < minN) ? null : roundTo(c / p.n * 100, 1)), meta: p.counts.map(c => p.n < minN || (c > 0 && c < minN) ? '' : `(${c}/${p.n})`) })),
      tooltipExtra: (di, i) => { const p = per[di]; const c = p?.counts[i]; return p && p.n >= minN && !(c > 0 && c < minN) ? ` (${c} จาก ${p.n} คน)` : ''; },
      aria: 'การกระจาย' + v.label + 'แยกตามกลุ่ม' });
    const all = groups.length > 1;
    const head = `<thead><tr><th>ตัวแปร / หมวด</th>${groups.map(g => `<th class="n">${esc(groupLabel(g))}<br><span class="muted small">n = ${fmtInt(this.cell(demoRows, g).length)}</span></th>`).join('')}${all ? `<th class="n">รวม<br><span class="muted small">n = ${fmtInt(demoRows.length)}</span></th>` : ''}</tr></thead>`;
    const body = DEMO_VARS.map(dv => {
      const gs = groups.map(g => demoCounts(this.cell(demoRows, g), dv)), tot = demoCounts(demoRows, dv);
      return `<tr class="clickable" data-demo-var="${dv.key}"><td colspan="${groups.length + 1 + (all ? 1 : 0)}" style="background:var(--surface-2);font-weight:700">${dv.q}. ${esc(dv.label)}</td></tr>`
        + dv.categories.map((c, i) => `<tr><td style="padding-left:26px">${esc(c.label)}</td>${gs.map(x => `<td class="n">${this.demoCell(x.counts[i], x.n)}</td>`).join('')}${all ? `<td class="n">${this.demoCell(tot.counts[i], tot.n)}</td>` : ''}</tr>`).join('');
    }).join('');
    $('#demoTable').innerHTML = `<table class="tbl tbl-compact">${head}<tbody>${body}</tbody></table>`;
    $('#demoTable').onclick = e => { const r = e.target.closest('[data-demo-var]'); if (!r) return; this.demoVar = r.dataset.demoVar; $('#demoVar').value = this.demoVar; this.renderDemo(demoRows, Viz.tok()); $('#c-demo').closest('.card').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
  },

  kpiHtml(rows) {
    const rounds = this.rounds(), minN = CONFIG.PRIVACY.minCellSize;
    const nPre = rows.filter(r => r.assessment_round === 'pre').length, nPost = rows.length - nPre;
    const target = (CONFIG.STUDY.targetPerGroup.experimental + CONFIG.STUDY.targetPerGroup.control) * 2;
    const card = (k) => {
      const M = MEASURES[k];
      const s = Stats.describe(rows.map(r => r[k]));
      const ok = s.n >= minN;
      let sub = `<span>n = ${fmtInt(s.n)}</span>`;
      if (rounds.length === 2) {
        const pre = this.meanOf(this.cell(rows, null, 'pre'), k), post = this.meanOf(this.cell(rows, null, 'post'), k);
        if (pre != null && post != null) sub = `<span>ก่อน ${fmtNum(pre, M.dec)} → หลัง ${fmtNum(post, M.dec)}</span>${deltaHtml(post - pre, M.goodDir, M.dec)}`;
      }
      const pct = ok ? clamp((s.mean - M.min) / (M.max - M.min) * 100, 0, 100) : 0;
      return `<button type="button" class="kpi" data-drill="measure:${k}" aria-label="${esc(M.label)} ดูรายละเอียด">
        <span class="k-label"><span class="k-ic">${icon(M.icon, 16)}</span>${esc(M.label)}เฉลี่ย</span>
        <span class="k-value">${ok ? fmtNum(s.mean, M.dec) : '–'}<span class="k-unit">${esc(M.unit)}</span></span>
        <span class="k-sub">${sub}</span>
        <span class="meter k-meter"><i style="width:${pct}%;background:linear-gradient(90deg,var(--brand),var(--brand-2))"></i></span></button>`;
    };
    return `<div class="kpis">
      <button type="button" class="kpi" data-drill="count" aria-label="จำนวนแบบประเมิน ดูรายละเอียด">
        <span class="k-label"><span class="k-ic">${icon('clipboard', 16)}</span>แบบประเมินทั้งหมด</span>
        <span class="k-value">${fmtInt(rows.length)}<span class="k-unit">ฉบับ</span></span>
        <span class="k-sub"><span class="badge b-pre"><span class="sw"></span>ก่อน ${fmtInt(nPre)}</span><span class="badge b-post"><span class="sw"></span>หลัง ${fmtInt(nPost)}</span></span>
        <span class="meter k-meter" title="เทียบเป้าหมาย ${target} ฉบับ"><i style="width:${clamp(this.rows.length / target * 100, 0, 100)}%;background:linear-gradient(90deg,var(--brand),var(--brand-2))"></i></span>
        <span class="k-sub">ความคืบหน้ารวม ${fmtInt(this.rows.length)}/${target} ฉบับ (${fmtPct(this.rows.length / target * 100, 0)})</span></button>
      ${['anx_total', 'conf_total', 'know_score'].map(card).join('')}
      ${this.demoKpi(rows)}
    </div>`;
  },
  /* KPI ผู้เข้าร่วม (ข้อมูลทั่วไปจากการประเมินครั้งก่อน) */
  demoKpi(rows) {
    const d = rows.filter(r => r.assessment_round === 'pre'), minN = CONFIG.PRIVACY.minCellSize, ok = d.length >= minN;
    const pct = (k, v) => { const b = d.filter(r => !isBlank(r[k])); return b.length ? b.filter(r => String(r[k]) === v).length / b.length * 100 : null; };
    const el = pct('cs_plan', '1'), line = pct('line_health_use', '1');
    return `<button type="button" class="kpi" data-drill="demo" aria-label="ผู้เข้าร่วมวิจัย ดูข้อมูลทั่วไป">
      <span class="k-label"><span class="k-ic">${icon('users', 16)}</span>ผู้เข้าร่วม (ข้อมูลทั่วไป)</span>
      <span class="k-value">${fmtInt(d.length)}<span class="k-unit">คน</span></span>
      <span class="k-sub">${ok && el != null ? `<span>ผ่าตัดตามแผน ${fmtPct(el, 0)}</span>` : '<span>บันทึกในครั้งก่อนให้ข้อมูล</span>'}${ok && line != null ? `<span>· เคยใช้ LINE รับข้อมูลสุขภาพ ${fmtPct(line, 0)}</span>` : ''}</span>
      <span class="meter k-meter"><i style="width:${ok && line != null ? clamp(line, 0, 100) : 0}%;background:linear-gradient(90deg,var(--brand),var(--brand-2))"></i></span></button>`;
  },

  insights(rows) {
    const out = [], minN = CONFIG.PRIVACY.minCellSize;
    const nPre = rows.filter(r => r.assessment_round === 'pre').length;
    out.push({ icon: 'users', html: `แบบประเมินตามตัวกรอง <b>${fmtInt(rows.length)}</b> ฉบับ — กลุ่มทดลอง ${fmtInt(this.cell(rows, 'experimental').length)} · กลุ่มควบคุม ${fmtInt(this.cell(rows, 'control').length)} (ก่อน ${fmtInt(nPre)} · หลัง ${fmtInt(rows.length - nPre)})` });
    this.groups().forEach(g => {
      const parts = [];
      ['anx_total', 'conf_total', 'know_score'].forEach(k => {
        const M = MEASURES[k], pre = this.meanOf(this.cell(rows, g, 'pre'), k), post = this.meanOf(this.cell(rows, g, 'post'), k);
        if (pre != null && post != null) parts.push(`${M.label} ${fmtNum(pre, M.dec)} → ${fmtNum(post, M.dec)} ${deltaHtml(post - pre, M.goodDir, M.dec)}`);
      });
      if (parts.length) out.push({ icon: 'chart', html: `<b>${esc(groupLabel(g))}</b>: ${parts.join(' · ')}` });
    });
    const anxBase = this.rounds().includes('pre') ? this.cell(rows, null, 'pre') : rows;
    const anxItems = itemsOf('anxiety').map(f => ({ f, m: this.meanOf(anxBase, f.name) })).filter(x => x.m != null).sort((a, b) => b.m - a.m);

      const top = key => { const v = DEMO_VARS.find(x => x.key === key), c = demoCounts(demo, v); if (!c.n) return null; const i = c.counts.indexOf(Math.max(...c.counts)); return { label: v.categories[i].label, p: c.counts[i] / c.n * 100 }; };
      const age = top('age_group'), cs = demoCounts(demo, DEMO_VARS.find(x => x.key === 'cs_history')), an = demoCounts(demo, DEMO_VARS.find(x => x.key === 'anesthesia_history'));

    }

  },

  levelChart(id, rows, levelKey, bandsDesc, t, measure) {
    const bands = bandsDesc.slice().reverse(); // ต่ำ → สูง
    const combos = [];
    this.groups().forEach(g => this.rounds().forEach(r => { const c = this.cell(rows, g, r).filter(x => x[levelKey]); if (c.length) combos.push({ label: `${groupShort(g)} · ${roundLabelShort(r)}`, rows: c }); }));
    const minN = CONFIG.PRIVACY.minCellSize;
    const colorIdx = bands.length === 3 ? [0, 2, 4] : [0, 1, 2, 3, 4];
    Viz.render({ id, horizontal: true, stacked: true, labels: combos.map(c => c.label), catTitle: 'กลุ่ม · ครั้ง', min: 0, max: 100, percent: true, valueFmt: v => fmtPct(v),
      datasets: bands.map((b, i) => ({ label: b.label, color: t.ord[colorIdx[i]], data: combos.map(c => c.rows.length >= minN ? roundTo(c.rows.filter(x => x[levelKey] === b.label).length / c.rows.length * 100, 1) : null), meta: combos.map(c => c.rows.length >= minN ? `(${c.rows.filter(x => x[levelKey] === b.label).length}/${c.rows.length})` : '') })),
      tooltipExtra: (di, i) => { const c = combos[i]; return c && c.rows.length >= minN ? ` (${c.rows.filter(x => x[levelKey] === bands[di].label).length} จาก ${c.rows.length})` : ''; },
      onClick: () => this.drillMeasure(measure), aria: 'การกระจายระดับ' });
  },

  bins(M) {
    const [lo, hi, step] = M.bins, out = [];
    for (let a = lo; a < hi + (step === 1 ? 1 : 0); a += step) {
      const last = a + step >= hi;
      if (step === 1) out.push({ lo: a, hi: a + 1, label: String(a) });
      else out.push({ lo: a, hi: last ? hi + 1e-9 : a + step, label: step < 1 ? `${fmtNum(a, 1)}–${fmtNum(last ? hi : a + step, 1)}` : `${a}–${last ? hi : a + step - 1}` });
      if (last && step !== 1) break;
    }
    return out;
  },
  trend(rows) {
    const dates = rows.map(r => parseDate(r.assessment_date)).filter(Boolean).sort((a, b) => a - b);
    if (!dates.length) return { unit: 'week', buckets: [] };
    const span = (dates[dates.length - 1] - dates[0]) / 864e5, unit = span > 120 ? 'month' : 'week';
    const keyOf = d => { if (unit === 'month') return dateKey(new Date(d.getFullYear(), d.getMonth(), 1)); const x = new Date(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return dateKey(x); };
    const map = new Map();
    let cur = parseDate(keyOf(dates[0])); const end = dates[dates.length - 1];
    while (cur <= end) { map.set(dateKey(cur), []); cur = unit === 'month' ? new Date(cur.getFullYear(), cur.getMonth() + 1, 1) : new Date(cur.getFullYear(), cur.getMonth(), cur.getDate() + 7); }
    rows.forEach(r => { const d = parseDate(r.assessment_date); if (d) map.get(keyOf(d))?.push(r); });
    const MON = new Intl.DateTimeFormat('th-TH', { month: 'short', year: '2-digit' }), DM = new Intl.DateTimeFormat('th-TH', { day: 'numeric', month: 'short' });
    return { unit, buckets: [...map.entries()].map(([k, rs]) => { const s = parseDate(k), e = unit === 'month' ? new Date(s.getFullYear(), s.getMonth() + 1, 0) : new Date(s.getFullYear(), s.getMonth(), s.getDate() + 6); return { from: k, to: dateKey(e), label: unit === 'month' ? MON.format(s) : DM.format(s), full: unit === 'month' ? MON.format(s) : `${fmtDate(s)} – ${fmtDate(e)}`, rows: rs }; }) };
  },

  /* ---------- item table (ค้นหา / กรอง / เรียงลำดับ) ---------- */

      const sec = SECTION_MAP[secId];
      itemsOf(secId).forEach(f => {
        const key = secId === 'knowledge' ? 'kc_' + pad2(f.itemNo) : f.name, pct = secId === 'knowledge';
        const val = rs => { const base = rs.filter(x => x[key] !== '' && x[key] != null); if (base.length < minN) return null; const m = Stats.mean(base.map(x => x[key])); return pct ? m * 100 : m; };
        const pre = val(this.cell(rows, null, 'pre')), post = val(this.cell(rows, null, 'post')), all = val(rows);
        out.push({ name: f.name, inst: secId, instLabel: sec.title, no: f.itemNo, text: f.text, domain: f.domainTitle || '', n: rows.filter(x => x[key] !== '' && x[key] != null).length, pre, post, diff: pre != null && post != null ? post - pre : null, all, pct, scaleMax: pct ? 100 : (sec.scale.type === 'scale' ? 10 : 5) });
      });

  },

        <div class="seg" id="itemInst">${[['all', 'ทั้งหมด'], ['anxiety', 'วิตกกังวล'], ['confidence', 'มั่นใจ'], ['knowledge', 'ความรู้']].map(([k, l]) => `<button type="button" data-inst="${k}" aria-pressed="${st.inst === k}">${l}</button>`).join('')}</div>
      </div><div id="itemTableWrap"></div>`;

      const order = { anxiety: 1, confidence: 2, knowledge: 3 };

    const sortHandler = e => { const h = e.target.closest('[data-sort]'); if (!h || (e.type === 'keydown' && e.key !== 'Enter')) return; const k = h.dataset.sort; st.dir = st.sort === k && st.dir === 'asc' ? 'desc' : 'asc'; st.sort = k; draw(); };
    $('#itemTableWrap').onclick = sortHandler; $('#itemTableWrap').onkeydown = sortHandler;
  },

  /* ---------- drill-down ---------- */
  statsTable(rows, key, dec, levelKey, bands) {
    const minN = CONFIG.PRIVACY.minCellSize, combos = [];
    this.groups().forEach(g => this.rounds().forEach(r => combos.push({ g, r, rows: this.cell(rows, g, r) })));
    combos.push({ g: null, r: null, rows });
    const lv = bands ? bands.slice().reverse() : [];
    return `<div class="table-wrap"><table class="tbl tbl-compact"><thead><tr><th>กลุ่ม</th><th>ครั้ง</th><th class="n">n</th><th class="n">Mean</th><th class="n">SD</th><th class="n">Median</th><th class="n">Min–Max</th>${lv.map(b => `<th class="n">${esc(b.label)}</th>`).join('')}</tr></thead><tbody>
      ${combos.map(c => { const s = Stats.describe(c.rows.map(x => x[key])); const hide = s.n < minN; const lab = c.g ? `<span class="badge ${c.g === 'experimental' ? 'b-exp' : 'b-ctl'}"><span class="sw"></span>${esc(groupLabel(c.g))}</span>` : '<b>รวม</b>';
        return `<tr><td>${lab}</td><td>${c.r ? esc(roundName(c.r)) : 'ทุกครั้ง'}</td><td class="n">${s.n}</td>${hide ? `<td class="n muted" colspan="${4 + lv.length}">ซ่อน (n &lt; ${minN})</td>` : `<td class="n"><b>${fmtNum(s.mean, dec)}</b></td><td class="n">${fmtNum(s.sd, dec)}</td><td class="n">${fmtNum(s.median, dec)}</td><td class="n">${fmtNum(s.min, dec)}–${fmtNum(s.max, dec)}</td>${lv.map(b => { const n = c.rows.filter(x => x[levelKey] === b.label).length; return `<td class="n">${n} <span class="muted small">(${fmtPct(s.n ? n / s.n * 100 : 0, 0)})</span></td>`; }).join('')}`}</tr>`; }).join('')}
      </tbody></table></div>`;
  },
  drillMeasure(key) {
    const M = MEASURES[key], rows = this.filtered();
    const bins = this.bins(M), t = Viz.tok(), rounds = this.rounds();
    Dialog.open({
      title: `รายละเอียด: ${M.label}`, size: 'lg',
      body: `<p class="muted small">${esc(M.desc)} · ตามตัวกรองปัจจุบัน (${rows.length} รายการ)</p>
        ${this.statsTable(rows, key, M.dec, M.level, M.bands ? M.bands() : null)}
        ${chartCard({ id: 'drill-hist', title: 'การกระจายคะแนน', sub: 'จำนวนแบบประเมินในแต่ละช่วงคะแนน', legend: rounds.length > 1 ? rounds.map(r => ({ label: roundName(r), color: roundVar(r) })) : [] })}`,
      onOpen: () => Viz.render({ id: 'drill-hist', labels: bins.map(b => b.label), catTitle: 'ช่วงคะแนน', valueFmt: v => fmtInt(v) + ' ฉบับ', tableFmt: v => fmtInt(v),
        datasets: rounds.map(r => ({ label: roundName(r), color: roundColor(r, t), data: bins.map(b => this.cell(rows, null, r).filter(x => x[key] !== '' && x[key] >= b.lo && x[key] < b.hi).length) })) }),
    });
  },
  drillCount() {
    const rows = this.filtered(), tg = CONFIG.STUDY.targetPerGroup;
    const body = `<p class="muted small">จำนวนแบบประเมินตามตัวกรองปัจจุบัน เทียบกับเป้าหมายตามโครงร่างวิจัย (กลุ่มละ ${tg.experimental} คน × 2 ครั้ง)</p>
      <div class="table-wrap"><table class="tbl"><thead><tr><th>กลุ่ม</th><th class="n">ก่อน</th><th class="n">หลัง</th><th class="n">รวม</th><th>ความคืบหน้า (ทั้งหมด)</th></tr></thead><tbody>
      ${GROUPS.map(g => { const a = this.cell(rows, g, 'pre').length, b = this.cell(rows, g, 'post').length, all = this.rows.filter(r => r.study_group === g).length, target = tg[g] * 2; return `<tr><td><span class="badge ${g === 'experimental' ? 'b-exp' : 'b-ctl'}"><span class="sw"></span>${esc(groupLabel(g))}</span></td><td class="n">${a}</td><td class="n">${b}</td><td class="n"><b>${a + b}</b></td><td><div class="row" style="flex-wrap:nowrap"><span class="meter" style="flex:1"><i style="width:${clamp(all / target * 100, 0, 100)}%;background:${groupVar(g)}"></i></span><span class="small nowrap">${all}/${target}</span></div></td></tr>`; }).join('')}
      </tbody></table></div>`;
    Dialog.open({ title: 'จำนวนแบบประเมิน', body });
  },
  drillItem(name) {
    const f = FIELD_MAP[name], rows = this.filtered(), t = Viz.tok(), minN = CONFIG.PRIVACY.minCellSize;
    const isKnow = f.section === 'knowledge', rounds = this.rounds();
    const key = isKnow ? 'kc_' + pad2(f.itemNo) : name;

    const per = rounds.map(r => { const base = this.cell(rows, null, r).filter(x => x[key] !== '' && x[key] != null); return { r, n: base.length, counts: cats.map(c => base.filter(x => String(x[key]) === String(c.value)).length), s: Stats.describe(base.map(x => x[key])) }; });
