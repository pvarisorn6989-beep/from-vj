      <div class="table-wrap"><table class="tbl tbl-compact"><thead><tr><th>คำตอบ</th>${per.map(p => `<th class="n">${esc(roundName(p.r))} (n=${p.n})</th>`).join('')}</tr></thead><tbody>
        ${cats.map((c, i) => `<tr><td>${esc(c.label)}</td>${per.map(p => p.n < minN ? '<td class="n muted">–</td>' : `<td class="n">${p.counts[i]} <span class="muted small">(${fmtPct(p.counts[i] / p.n * 100, 0)})</span></td>`).join('')}</tr>`).join('')}
        <tr><td><b>${isKnow ? 'ร้อยละตอบถูก' : 'ค่าเฉลี่ย (SD)'}</b></td>${per.map(p => p.n < minN ? '<td class="n muted">ซ่อน</td>' : `<td class="n"><b>${isKnow ? fmtPct(p.s.mean * 100) : fmtNum(p.s.mean) + ' (' + fmtNum(p.s.sd) + ')'}</b></td>`).join('')}</tr>
      </tbody></table></div>
      ${chartCard({ id: 'drill-item', title: 'การกระจายคำตอบ (ร้อยละ)', legend: rounds.length > 1 ? rounds.map(r => ({ label: roundName(r), color: roundVar(r) })) : [] })}
      ${isKnow ? '<p class="small muted">ไม่แสดงสัดส่วนคำตอบ “ถูก/ผิด” ที่ผู้ตอบเลือก เพื่อไม่ให้เปิดเผยเฉลยแบบทดสอบ</p>' : ''}`;
    Dialog.open({ title: 'รายละเอียดรายข้อ', size: 'lg', body,
      onOpen: () => Viz.render({ id: 'drill-item', labels: cats.map(c => c.label), catTitle: 'คำตอบ', min: 0, percent: true, valueFmt: v => fmtPct(v),
        datasets: per.map(p => ({ label: roundName(p.r), color: roundColor(p.r, t), data: p.counts.map(c => p.n >= minN ? roundTo(c / p.n * 100, 1) : null) })) }) });
  },
};
function deltaHtml(d, goodDir, dec = 1) {
  if (d == null || !Number.isFinite(d)) return '';
  const flat = Math.abs(d) < 10 ** -dec / 2, good = d * goodDir > 0;
  const cls = flat ? 'flat' : good ? 'good' : 'bad';
  return `<span class="delta ${cls}" title="${flat ? 'ไม่เปลี่ยนแปลง' : (d > 0 ? 'เพิ่มขึ้น' : 'ลดลง') + (good ? ' (ทิศทางที่ดี)' : ' (ทิศทางที่ไม่พึงประสงค์)')}">${icon(flat ? 'flat' : d > 0 ? 'up' : 'down', 13)}${flat ? '0' : fmtNum(Math.abs(d), dec)} ${flat ? 'คงที่' : d > 0 ? 'เพิ่มขึ้น' : 'ลดลง'}</span>`;
}


/* #####################################################################
 * 16) DATA DICTIONARY — สร้างจาก SCHEMA (ชุดเดียวกับ Excel Template และ Code.gs)
 * ##################################################################### */
const SECTION_NAMES = { system: 'ฟิลด์ระบบ', computed: 'ค่าที่คำนวณ', study: 'ข้อมูลการวิจัย', consent: 'หนังสือแสดงเจตนายินยอมเข้าร่วมการวิจัย', general: 'ส่วนที่ 1 ข้อมูลทั่วไป', anxiety: 'ส่วนที่ 2 แบบประเมินความวิตกกังวล', confidence: 'ส่วนที่ 3 แบบประเมินความมั่นใจ', knowledge: 'ส่วนที่ 4 แบบทดสอบความรู้' };
const ORIGIN_NAMES = { source: 'ไฟล์ต้นฉบับ (' + CONFIG.APP.sourceFile + ')', protocol: 'รูปแบบการวิจัย (เพิ่มเติม)', system: 'ระบบ', computed: 'คำนวณจากคำตอบ' };
const condText = c => !c ? '' : c.all ? c.all.map(condText).join(' และ ') : `${c.field} = ${c.eq}`;
function allowedValues(f) {
  if (f.allowed) return f.allowed;
  switch (f.type) {
    case 'scale': return `${f.min}–${f.max} (จำนวนเต็ม) · ${SECTION_MAP[f.section].scale.minLabel} · ${SECTION_MAP[f.section].scale.maxLabel}`;
    case 'likert': case 'radio': case 'select': case 'truefalse': return f.options.map(o => `${o.value} = ${o.label}`).join(' | ');
    case 'checkbox': return f.options.map(o => `${o.value} = ${o.label}${o.exclusive ? ' (เลือกร่วมกับข้ออื่นไม่ได้)' : ''}`).join(' | ');
    case 'number': return `${f.min}–${f.max}${f.integer ? ' (จำนวนเต็ม)' : ''}${f.unit ? ' หน่วย: ' + f.unit : ''}`;
    case 'toggle': return 'Y = ยืนยัน/ยินยอม · N = ไม่ยืนยัน' + (f.mustBeTrue ? ' (ต้องเป็น Y จึงบันทึกได้)' : '');
    case 'signature': return `ภาพลายมือชื่อ PNG/JPEG แบบ Data URL (data:image/png;base64,…) ≤ ${fmtInt(CONFIG.FORM.signatureMaxChars)} ตัวอักษร`;
    case 'date': return 'YYYY-MM-DD (ปี ค.ศ.) ไม่เกินวันปัจจุบัน';
    case 'text': return f.pattern ? `รูปแบบ ${f.pattern} เช่น E-001, C-001` : `ข้อความ ≤ ${f.maxLength || 300} ตัวอักษร`;
  }
  if (f.name === 'record_id') return 'RYYMMDD-XXXXXX (ไม่ซ้ำ)';
  if (f.dtype === 'datetime') return 'ISO 8601 เช่น 2026-10-07T09:30:00+07:00';
  if (f.options) return f.options.map(o => `${o.value} = ${o.label}`).join(' | ');
  return '';
}
function dataDictionary() {
  return FIELDS.map((f, i) => ({
    no: i + 1,
    field_name: f.name,
    display_label: f.itemNo ? `${SECTION_MAP[f.section].title} ข้อ ${f.itemNo}` : (f.q ? `ข้อ ${f.q} ` : '') + f.label,
    description: f.text || f.desc || f.label || '',
    section: SECTION_NAMES[f.section] || f.section,
    domain: f.domainTitle || '',
    sheet: f.sheet,
    data_type: f.dtype || 'string',
    input_type: f.input ? f.type : (f.section === 'computed' ? 'computed' : 'system'),
    allowed_values: allowedValues(f),
    required: !f.input ? 'อัตโนมัติ' : (() => { const c = [condText(SECTION_MAP[f.section]?.showIf), f.itemNo ? '' : condText(f.showIf)].filter(Boolean).join(' และ '); return f.required ? (c ? 'บังคับเมื่อ ' + c : 'Y') : (c ? 'ไม่บังคับ (แสดงเมื่อ ' + c + ')' : 'N'); })(),
    origin: ORIGIN_NAMES[f.origin] || f.origin,
    personal_data: f.pii ? 'Y' : 'N',
    public_dashboard: f.public ? 'Y (สรุปแบบไม่ระบุตัวตน)' : f.band ? 'แสดงเป็นช่วงเท่านั้น (' + Object.keys(PUBLIC_BANDS).find(k => PUBLIC_BANDS[k] === f.name) + ')' : 'N',
    storage_format: f.type === 'checkbox' ? 'หลายค่า คั่นด้วย | ใน 1 คอลัมน์ (เช่น spinal|general) + แยกคอลัมน์ 0/1 อัตโนมัติ: ' + f.options.map(o => o.dummy).join(', ')
      : f.type === 'signature' ? 'Data URL ของภาพ 1 เซลล์ (Sheet consent)' : f.sheet === 'consent' ? '1 ค่าต่อ 1 เซลล์ (Sheet consent เชื่อมด้วย record_id)' : '1 ค่าต่อ 1 เซลล์',
  }));
}

/* #####################################################################
 * 17) EXPORT — Excel (SheetJS CDN) / CSV (UTF-8 BOM) / JSON / PDF (พิมพ์)
 * ##################################################################### */
function download(content, filename, type) {
  const blob = content instanceof Blob ? content : new Blob([content], { type });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function loadScript(src, globalName) {
  return new Promise((res, rej) => {
    if (globalName && window[globalName]) return res();
    const s = document.createElement('script'); s.src = src; s.async = true;
    s.onload = () => res(); s.onerror = () => { s.remove(); rej(new Error('โหลดไลบรารีไม่สำเร็จ (ต้องเชื่อมต่ออินเทอร์เน็ต)')); };
    document.head.appendChild(s);
  });
}
/* ป้องกัน CSV/Formula injection เมื่อเปิดด้วย Excel/Sheets */
const safeCell = v => { if (v == null) return ''; if (typeof v === 'number') return v; const s = String(v); return /^[=+\-@\t\r]/.test(s) && !Number.isFinite(Number(s)) ? "'" + s : s; };
const csvCell = v => { const s = String(safeCell(v)); return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
const stamp = () => { const d = new Date(); return `${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}_${pad2(d.getHours())}${pad2(d.getMinutes())}`; };
const Exporter = {
  /* sheet = 'responses' (คำตอบ + คะแนน ไม่มีชื่อ/ลายมือชื่อ) หรือ 'consent' (ข้อมูลส่วนบุคคลจากหนังสือยินยอม เชื่อมด้วย record_id) */
  csv(records, sheet = 'responses') {
    const order = sheet === 'consent' ? CONSENT_ORDER : RESP_ORDER;
    const rows = sheet === 'consent' ? records.filter(r => r.assessment_round === 'pre') : records;
    const lines = [order.join(',')].concat(rows.map(r => order.map(k => csvCell(r[k])).join(',')));
    download('﻿' + lines.join('\r\n'), `${sheet}_${stamp()}.csv`, 'text/csv;charset=utf-8');
    Toast.show(`ส่งออก CSV (${sheet}) ${rows.length} รายการ`, 'success');
  },
  dictionaryCsv() {
    const dd = dataDictionary(), cols = Object.keys(dd[0]);
    download('﻿' + [cols.join(',')].concat(dd.map(r => cols.map(c => csvCell(r[c])).join(','))).join('\r\n'), 'data_dictionary.csv', 'text/csv;charset=utf-8');
  },
  json(records, name = `backup_${stamp()}.json`) {
    const payload = { meta: { app: CONFIG.APP.name, version: CONFIG.APP.version, exported_at: isoLocal(), exported_by: Session.user(), mode: DataService.mode, count: records.length, fields: FIELD_ORDER }, records: records.map(r => Object.fromEntries(FIELD_ORDER.map(k => [k, r[k] ?? '']))) };
    download(JSON.stringify(payload, null, 2), name, 'application/json');
    Toast.show(`ส่งออก JSON ${records.length} รายการ`, 'success');
  },
  async xlsx(records, audit = []) {
    Loader.start();
    try {
      await loadScript(CONFIG.CDN.xlsx, 'XLSX');
      const wb = XLSX.utils.book_new();
      const sheet = (order, rows, name) => {
        const ws = XLSX.utils.aoa_to_sheet([order].concat(rows.map(r => order.map(k => safeCell(r[k] ?? '')))));
        ws['!cols'] = order.map(k => ({ wch: Math.max(10, Math.min(28, k.length + 2)) }));
        ws['!freeze'] = { xSplit: 1, ySplit: 1 };
        XLSX.utils.book_append_sheet(wb, ws, name);
      };
      sheet(RESP_ORDER, records, 'responses');
      sheet(CONSENT_ORDER, records.filter(r => r.assessment_round === 'pre'), 'consent');
      const dd = dataDictionary();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(dd), 'data_dictionary');
      if (audit.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(audit.map(a => ({ log_id: a.log_id, timestamp: a.timestamp, action: a.action, record_id: a.record_id, user: a.user, changes: a.changes, note: a.note }))), 'audit_log');
      XLSX.writeFile(wb, `responses_${stamp()}.xlsx`);
      Toast.show(`ส่งออก Excel ${records.length} รายการ`, 'success');
    } catch (e) { Toast.show(e.message + ' — ใช้ CSV แทนได้', 'error', { title: 'ส่งออก Excel ไม่สำเร็จ' }); }
    finally { Loader.stop(); }
  },
};

  const secTables = SCHEMA.sections.filter(s => s.prefix).map(sec => {
    const items = itemsOf(sec.id);
    if (!isSectionVisible(sec, r)) return `<h3 style="margin-top:6px">${esc(sec.title)}</h3><p class="muted small">ไม่เกี่ยวข้อง (${esc(sec.skipText || '')})</p>`;
    return `<h3 style="margin-top:6px">${esc(sec.title)}</h3><div class="table-wrap"><table class="tbl tbl-compact"><thead><tr><th>ข้อ</th><th>ข้อคำถาม</th><th class="n">คำตอบ</th>${sec.id === 'knowledge' ? '<th class="n">ตรวจ</th>' : ''}</tr></thead><tbody>
      ${items.map(f => { const v = r[f.name]; const lbl = isBlank(v) ? '–' : f.type === 'truefalse' ? optLabel(f, v) : f.type === 'likert' ? `${v} (${optLabel(f, v)})` : String(v);
        const chk = sec.id === 'knowledge' ? `<td class="n">${isBlank(v) ? '–' : Scoring.knowledgeCorrect(r, f.itemNo) ? '<span class="badge b-ok">ถูก</span>' : '<span class="badge b-danger">ผิด</span>'}</td>` : '';
        return `<tr><td class="nowrap">${f.itemNo}</td><td>${esc(f.text)}</td><td class="n">${esc(lbl)}</td>${chk}</tr>`; }).join('')}
      </tbody></table></div>`;
  }).join('');
  return `<div class="grid-2"><div><h3>ข้อมูลการวิจัย</h3>${kv(study)}</div><div><h3>คะแนน</h3>${kv(scores)}</div></div>${kv(sys)}${consentHtml}${generalHtml}${secTables}`;
}

  /* ---------- tab: records ---------- */
  filteredRecords() {

    const dir = f.dir === 'asc' ? 1 : -1, k = f.sort;
    list.sort((a, b) => { const x = a[k] ?? '', y = b[k] ?? ''; if (x === y) return 0; if (x === '') return 1; if (y === '') return -1; return (typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y), 'th', { numeric: true })) * dir; });

      </div>

          ${r.record_status === 'deleted' ? `<button type="button" class="btn btn-ghost btn-sm btn-icon" data-act="restore" title="กู้คืน" aria-label="กู้คืน ${esc(r.record_id)}">${icon('restore', 17)}</button>`
            : `<button type="button" class="btn btn-ghost btn-sm btn-icon" data-act="edit" title="แก้ไข" aria-label="แก้ไข ${esc(r.record_id)}">${icon('edit', 17)}</button><button type="button" class="btn btn-danger-ghost btn-sm btn-icon" data-act="delete" title="ลบ" aria-label="ลบ ${esc(r.record_id)}">${icon('trash', 17)}</button>`}
        </div></td></tr>`).join('')}
      </tbody></table></div>
      <div class="pager"><span>แสดง ${fmtInt((f.page - 1) * f.size + 1)}–${fmtInt(Math.min(f.page * f.size, list.length))} จาก ${fmtInt(list.length)} รายการ</span>
        <div class="row"><select class="select input-sm" id="rtSize" aria-label="จำนวนต่อหน้า" style="width:auto">${[10, 20, 50, 100].map(n => `<option ${f.size === n ? 'selected' : ''}>${n}</option>`).join('')}</select>
        <button type="button" class="btn btn-outline btn-sm" data-page="${f.page - 1}" ${f.page <= 1 ? 'disabled' : ''}>${icon('left', 16)}ก่อนหน้า</button><span>หน้า ${f.page}/${pages}</span><button type="button" class="btn btn-outline btn-sm" data-page="${f.page + 1}" ${f.page >= pages ? 'disabled' : ''}>ถัดไป${icon('right', 16)}</button></div></div>`
      : `<div class="empty">${icon('inbox', 30)}<p>ไม่พบรายการตามเงื่อนไข</p></div>`;
    $('#rtSize')?.addEventListener('change', e => { f.size = +e.target.value; f.page = 1; this.drawRecordTable(); });

  async onRecordTableClick(e) {
    const s = e.target.closest('[data-sort]');

  /* ---------- tab: tracking (ติดตามการเก็บข้อมูลก่อน–หลัง) ---------- */
  tabTracking() {
    const body = $('#admBody'), act = this.records.filter(r => r.record_status !== 'deleted'), tg = CONFIG.STUDY.targetPerGroup;
    const map = new Map();
    act.forEach(r => { const p = map.get(r.participant_code) || { code: r.participant_code, group: r.study_group, pre: null, post: null }; p[r.assessment_round] = r; if (r.assessment_round === 'pre' || !p.group) p.group = r.study_group; map.set(r.participant_code, p); });
    const parts = [...map.values()].map(p => {
      const status = p.pre && p.post ? 'complete' : p.pre ? 'waiting' : 'missing-pre';
      const flags = [];
      if (p.pre && p.post && p.pre.study_group !== p.post.study_group) flags.push('กลุ่มไม่ตรงกันระหว่างก่อน–หลัง');
      if (p.pre && p.post && p.post.assessment_date < p.pre.assessment_date) flags.push('วันที่ครั้งหลังก่อนครั้งก่อน');
      if (p.pre && (p.pre.consent_agree !== 'Y' || !isSignature(p.pre.consent_signature))) flags.push('หนังสือยินยอมไม่ครบ');
      const d = k => p.pre && p.post && p.pre[k] !== '' && p.post[k] !== '' ? toNum(p.post[k]) - toNum(p.pre[k]) : null;
      return { ...p, status, flags, dAnx: d('anx_total'), dConf: d('conf_total'), dKnow: d('know_score') };
    }).sort((a, b) => a.code.localeCompare(b.code, 'en', { numeric: true }));
    const grp = g => { const ps = parts.filter(p => p.group === g); return { enrolled: ps.length, complete: ps.filter(p => p.status === 'complete').length, waiting: ps.filter(p => p.status === 'waiting').length, ps }; };
    const card = g => { const s = grp(g), target = tg[g]; const pairs = s.ps.filter(p => p.status === 'complete');
      const md = k => { const v = Stats.describe(pairs.map(p => p[k])); return v.n ? `${v.mean > 0 ? '+' : ''}${fmtNum(v.mean)} (SD ${fmtNum(v.sd)})` : '–'; };
      return `<div class="export-card"><div class="row"><span class="badge ${g === 'experimental' ? 'b-exp' : 'b-ctl'}"><span class="sw"></span>${esc(groupLabel(g))}</span><span class="spacer"></span><b>${s.complete}/${target}</b><span class="muted small">คนครบ 2 ครั้ง</span></div>
        <div class="meter" style="height:10px"><i style="width:${clamp(s.complete / target * 100, 0, 100)}%;background:${groupVar(g)}"></i></div>
        <div class="small muted">ลงทะเบียน ${s.enrolled} คน · รอประเมินครั้งหลัง ${s.waiting} คน · เป้าหมาย ${target} คน</div>
        <dl class="kv small"><dt>Δ วิตกกังวล (หลัง−ก่อน)</dt><dd>${md('dAnx')}</dd><dt>Δ มั่นใจ</dt><dd>${md('dConf')}</dd><dt>Δ ความรู้</dt><dd>${md('dKnow')}</dd></dl>
        <p class="small muted">ค่าเฉลี่ยผลต่างแบบจับคู่ (paired) จาก ${pairs.length} คน — สถิติอนุมาน (Paired t-test/Wilcoxon) ควรวิเคราะห์ด้วยโปรแกรมสถิติจากไฟล์ส่งออก</p></div>`; };
    const stLabel = { complete: '<span class="badge b-ok">ครบ 2 ครั้ง</span>', waiting: '<span class="badge b-warn">รอครั้งหลัง</span>', 'missing-pre': '<span class="badge b-danger">ไม่มีครั้งก่อน</span>' };
    body.innerHTML = `<div class="grid-2" style="margin-bottom:16px">${GROUPS.map(card).join('')}</div>
      <div class="toolbar"><div class="search-box">${icon('search', 18)}<input class="input input-sm" type="search" id="tkQ" placeholder="ค้นหารหัสผู้เข้าร่วม…" value="${esc(this.tk.q)}" aria-label="ค้นหารหัส"></div>
        <select class="select" id="tkStatus" aria-label="สถานะการติดตาม">${[['all', 'ทุกสถานะ'], ['complete', 'ครบ 2 ครั้ง'], ['waiting', 'รอครั้งหลัง'], ['missing-pre', 'ไม่มีครั้งก่อน'], ['flag', 'มีข้อสังเกต']].map(([k, l]) => `<option value="${k}" ${this.tk.status === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
      <div id="tkTable"></div>`;
    const draw = () => {
      const q = this.tk.q.trim().toUpperCase();
      const rows = parts.filter(p => (!q || p.code.includes(q)) && (this.tk.status === 'all' || (this.tk.status === 'flag' ? p.flags.length : p.status === this.tk.status)));
      const dd = (v, good) => v == null ? '–' : `<span class="delta ${v === 0 ? 'flat' : v * good > 0 ? 'good' : 'bad'}">${v > 0 ? '+' : ''}${fmtNum(v, 0)}</span>`;
      $('#tkTable').innerHTML = rows.length ? `<div class="table-wrap max-h"><table class="tbl"><thead><tr><th>รหัส</th><th>กลุ่ม</th><th>ครั้งก่อน</th><th>ครั้งหลัง</th><th>สถานะ</th><th class="n">Δ วิตกกังวล</th><th class="n">Δ มั่นใจ</th><th class="n">Δ ความรู้</th><th>หนังสือยินยอม</th><th>ข้อสังเกต</th></tr></thead><tbody>
        ${rows.map(p => `<tr><td><b>${esc(p.code)}</b></td><td><span class="badge ${p.group === 'experimental' ? 'b-exp' : 'b-ctl'}"><span class="sw"></span>${esc(groupShort(p.group))}</span></td>
          <td class="nowrap">${p.pre ? `<a href="javascript:void 0" data-view="${esc(p.pre.record_id)}">${esc(fmtDate(p.pre.assessment_date))}</a>` : '–'}</td><td class="nowrap">${p.post ? `<a href="javascript:void 0" data-view="${esc(p.post.record_id)}">${esc(fmtDate(p.post.assessment_date))}</a>` : '–'}</td>
          <td>${stLabel[p.status]}</td><td class="n">${dd(p.dAnx, -1)}</td><td class="n">${dd(p.dConf, 1)}</td><td class="n">${dd(p.dKnow, 1)}</td>
          <td>${!p.pre ? '–' : p.pre.consent_agree === 'Y' && isSignature(p.pre.consent_signature) ? `<span class="badge b-ok">ลงนามแล้ว ${esc(fmtDate(p.pre.consent_date))}</span>` : '<span class="badge b-danger">ไม่ครบ</span>'}</td>
          <td class="small">${p.flags.length ? `<span class="badge b-warn">${esc(p.flags.join(', '))}</span>` : '–'}</td></tr>`).join('')}
        </tbody></table></div><p class="small muted" style="margin-top:8px">${rows.length} คน · คลิกวันที่เพื่อดูแบบประเมิน</p>` : `<div class="empty">ไม่พบผู้เข้าร่วมตามเงื่อนไข</div>`;
    };
    draw();
    $('#tkQ').addEventListener('input', debounce(e => { this.tk.q = e.target.value; draw(); }, 200));
    $('#tkStatus').onchange = e => { this.tk.status = e.target.value; draw(); };
    $('#tkTable').onclick = e => { const a = e.target.closest('[data-view]'); if (a) { const r = this.records.find(x => x.record_id === a.dataset.view); if (r) this.showDetail(r); } };
  },

      if (k === 'json') Exporter.json(recs);

  async importJson(file) {
    if (!file) return;
    try {
      const j = JSON.parse(await file.text()); const incoming = Array.isArray(j) ? j : j.records;
      if (!Array.isArray(incoming)) throw new Error('ไม่พบรายการข้อมูล (records) ในไฟล์');
      const list = LocalDB.records(), ids = new Set(list.map(r => r.record_id)); let added = 0, skipped = 0, invalid = 0;
      incoming.forEach(r => { if (!r || !r.record_id || ids.has(r.record_id)) { skipped++; return; } const n = { ...r, ...normalizeRecord(r) }; if (n.record_status !== 'deleted' && validateRecord(n).length) { invalid++; return; } list.push(Object.fromEntries(FIELD_ORDER.map(k => [k, n[k] ?? '']))); ids.add(r.record_id); added++; });
      if (!await Dialog.confirm({ title: 'ยืนยันการนำเข้า', message: `จะเพิ่ม ${added} รายการ (ข้าม record_id ซ้ำ ${skipped} · ข้อมูลไม่ถูกต้อง ${invalid}) ต้องการดำเนินการหรือไม่?`, confirmText: 'นำเข้า' })) return;
      LocalDB.save(list); LocalDB.log('import', '', null, `นำเข้า ${added} รายการจาก ${file.name}`);
      Toast.show(`นำเข้า ${added} รายการ`, 'success'); this.afterChange();
    } catch (e) { Toast.show(e.message, 'error', { title: 'นำเข้าไม่สำเร็จ' }); }
  },

/* #####################################################################
 * 19) SAMPLE DATA — ข้อมูลตัวอย่างสำหรับ Demo Mode (สุ่มแบบกำหนด seed: ได้ชุดเดิมทุกครั้ง)
 *     ใช้ตัวแปรจริงทุกตัวตามโครงสร้างแบบสอบถาม — ไม่ใช่ข้อมูลจริงของผู้ป่วย
 * ##################################################################### */
function generateSampleData(seed = 20261007) {
  let s = seed >>> 0;
  const rnd = () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const normal = (m, sd) => { let u = 0; while (u === 0) u = rnd(); const v = rnd(); return m + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
  const rid = d => { const c = '0123456789ABCDEFGHJKLMNPQRSTUVWXYZ'; let x = ''; for (let i = 0; i < 6; i++) x += c[Math.floor(rnd() * c.length)]; return CONFIG.DATA.idPrefix + String(d.getFullYear()).slice(2) + pad2(d.getMonth() + 1) + pad2(d.getDate()) + '-' + x; };
  const pick = weights => { let t = rnd() * sum(weights); for (let i = 0; i < weights.length; i++) { t -= weights[i]; if (t < 0) return i; } return weights.length - 1; };
  /* ลายมือชื่อตัวอย่าง: วาดเส้นโค้งสุ่มบน canvas แล้วเก็บเป็น PNG Data URL (รูปแบบเดียวกับ Signature Pad) */
  const fakeSignature = () => {
    try {
      const c = document.createElement('canvas'); c.width = 240; c.height = 72;
      const g = c.getContext('2d'); g.strokeStyle = '#1c2541'; g.lineWidth = 2; g.lineCap = 'round'; g.lineJoin = 'round';
      g.beginPath(); let x = 14, y = 40 + (rnd() - 0.5) * 12; g.moveTo(x, y);
      const loops = ri(4, 7);
      for (let i = 0; i < loops; i++) { const nx = x + 22 + rnd() * 14, ny = 38 + (rnd() - 0.5) * 26; g.bezierCurveTo(x + 6, y - 22 - rnd() * 10, nx - 8, ny + 20 + rnd() * 8, nx, ny); x = nx; y = ny; }
      g.stroke(); g.beginPath(); g.moveTo(18, 58 + rnd() * 6); g.quadraticCurveTo(110, 50 + rnd() * 10, Math.min(228, x + 12), 56 + rnd() * 6); g.stroke();
      const url = c.toDataURL('image/png'); return isSignature(url) ? url : '';
    } catch (e) { return ''; }
  };
  const FIRST = ['สมหญิง', 'มาลี', 'กมลวรรณ', 'สุภาพร', 'อรอุมา', 'ปิยะนุช', 'วิภาวดี', 'จันทร์เพ็ญ', 'ณัฐธิดา', 'ศิริพร', 'พรทิพย์', 'รัตนา'];
  const LAST = ['ใจดี', 'รักษ์ไทย', 'มีสุข', 'ทองคำ', 'แสงอรุณ', 'บุญมา', 'ศรีสวัสดิ์', 'พรหมมา', 'สายบุญ', 'วงศ์ใหญ่'];
  const researcherName = 'ผู้วิจัยหลัก (ตัวอย่าง)', researcherSig = fakeSignature();
  const anxBias = [0.6, 0.9, 0.8, 0.3, 0.7, 0.4, 1.4, 0.2, -0.9, 0.1];
  const confBias = [0.25, -0.35, -0.45, 0.1];
  const knowP = [0.82, 0.55, 0.6, 0.35, 0.58, 0.5, 0.66, 0.72, 0.62, 0.74, 0.52, 0.42, 0.7, 0.68, 0.86];
  const today = todayISO(), out = [];
  /* ข้อมูลทั่วไป (ส่วนที่ 1) ที่สอดคล้องกันภายใน: ครรภ์ ≥ การคลอด + 1, ผ่าตัดคลอด ≤ การคลอด, ไม่เคยได้รับยาระงับความรู้สึก → none */
  const makeGeneral = () => {
    const g = {}, gravida = [1, 2, 3, 4][pick([35, 40, 18, 7])];
    g.age = clamp(Math.round(normal(29, 5.5)), 17, 45);
    g.marital_status = String([2, 1, 4, 3][pick([85, 8, 5, 2])]);
    g.education = String(pick([10, 22, 30, 13, 22, 3]) + 1);
    g.occupation = String(pick([25, 8, 20, 15, 7, 22, 3]) + 1);
    if (g.occupation === '7') g.occupation_other = ['นักศึกษา', 'ช่างเสริมสวย', 'ขายของออนไลน์'][ri(0, 2)];
    g.family_income = String(pick([20, 35, 25, 12, 8]) + 1);
    g.gravida = gravida;
    g.parity = Math.max(0, gravida - 1 - (rnd() < 0.1 ? 1 : 0));
    g.living_children = Math.max(0, g.parity - (rnd() < 0.05 ? 1 : 0));
    const cs = g.parity > 0 && rnd() < 0.55;
    g.cs_history = cs ? '1' : '0'; if (cs) g.cs_count = Math.min(g.parity, ri(1, 2));
    const anes = cs || rnd() < 0.2;
    g.anesthesia_history = anes ? '1' : '0'; if (anes) g.anesthesia_count = (g.cs_count || 0) + ri(cs ? 0 : 1, 1);
    const m = []; if (anes) { if (!cs || rnd() < 0.9) m.push('spinal'); if (rnd() < 0.15 || !m.length) m.push('general'); } else m.push('none');
    g.anesthesia_methods = m.join('|');
    g.gestational_age = clamp(Math.round(normal(38.3, 1.2)), 34, 41);
    g.cs_plan = String(rnd() < (cs ? 0.85 : 0.55) ? 1 : 2);
    g.line_health_use = rnd() < 0.75 ? '1' : '0';
    return g;
  };
  const make = (code, group, round, date, person) => {
    const r = { participant_code: code, study_group: group, assessment_date: dateKey(date), assessment_round: round };
    const post = round === 'post', exp = group === 'experimental';
    if (!post) {
      const d = dateKey(date), name = `${FIRST[ri(0, FIRST.length - 1)]} ${LAST[ri(0, LAST.length - 1)]} (ตัวอย่าง)`;
      Object.assign(r, { consent_date: d, participant_title: person.general.marital_status === '1' ? '3' : '2', participant_name: name, consent_agree: 'Y', consent_signature: fakeSignature(),
        consent_print_name: name, consent_sign_date: d, researcher_signature: researcherSig, researcher_print_name: researcherName, researcher_sign_date: d }, person.general);
    }
    for (let i = 1; i <= 10; i++) r['anx_' + pad2(i)] = clamp(Math.round(normal(person.anx + anxBias[i - 1] + (post ? (exp ? -2.6 : -0.8) : 0), 1.1)), 0, 10);
    for (let i = 1; i <= 20; i++) r['conf_' + pad2(i)] = clamp(Math.round(normal(person.conf + confBias[Math.floor((i - 1) / 5)] + (post ? (exp ? 1.05 : 0.3) : 0), 0.6)), 1, 5);
    for (let i = 1; i <= 15; i++) { const p = clamp(knowP[i - 1] + person.know + (post ? (exp ? 0.33 : 0.1) : 0), 0.05, 0.97), key = CONFIG.SCORING.knowledgeKey[i - 1]; r['know_' + pad2(i)] = rnd() < p ? key : (key === 'T' ? 'F' : 'T'); }
    const created = new Date(date.getFullYear(), date.getMonth(), date.getDate(), ri(8, 15), ri(0, 59), ri(0, 59));
    const updated = new Date(created.getTime() + ri(0, 3) * 864e5 + ri(0, 7200) * 1000);
    const status = r.assessment_date < '2026-09-10' && rnd() < 0.85 ? 'verified' : 'submitted';
    const rec = { record_id: rid(date), created_at: isoLocal(created), updated_at: isoLocal(status === 'verified' ? updated : created), record_status: status, created_by: 'sample-data', updated_by: 'sample-data', ...normalizeRecord(r) };
    return Object.fromEntries(FIELD_ORDER.map(k => [k, rec[k] ?? '']));
  };
  const plan = [['control', 'C', new Date(2026, 5, 1)], ['experimental', 'E', new Date(2026, 6, 20)]];
  plan.forEach(([group, prefix, start]) => {
    for (let n = 1; n <= 32; n++) {
      const person = { anx: normal(5.4, 1.0), conf: normal(3.0, 0.45), know: normal(0, 0.08), general: makeGeneral() };
      const pre = new Date(start.getFullYear(), start.getMonth(), start.getDate() + Math.round((n - 1) * 1.45));
      const post = new Date(pre.getFullYear(), pre.getMonth(), pre.getDate() + ri(3, 5));
      const code = `${prefix}-${String(n).padStart(3, '0')}`;
      if (dateKey(pre) <= today) out.push(make(code, group, 'pre', pre, person));
      if (n <= 30 && dateKey(post) <= today) out.push(make(code, group, 'post', post, person));   // 2 รายล่าสุดของแต่ละกลุ่มยังรอประเมินครั้งหลัง
    }
  });
  return out;
}
async function seedDemoIfNeeded() {
  if (DataService.mode !== 'demo' || !CONFIG.DATA.seedSampleInDemo || LS.get('seeded')) return;
  if (LocalDB.records().length) { LS.set('seeded', true); return; }
  let recs = null;
  if (/^https?:/.test(location.protocol)) { try { const r = await fetch(CONFIG.DATA.sampleFile, { cache: 'no-store' }); if (r.ok) { const j = await r.json(); recs = Array.isArray(j) ? j : j.records; } } catch (e) { /* ใช้ตัวสร้างข้อมูลแทน */ } }
  if (!Array.isArray(recs) || !recs.length) recs = generateSampleData();
  LocalDB.save(recs); LS.set('seeded', true); LocalDB.log('seed', '', null, `นำเข้าข้อมูลตัวอย่าง ${recs.length} รายการ`);
}

  $('#themeBtn').onclick = () => Theme.cycle();
  $('#connBadge').onclick = () => Conn.explain();
  $('#outboxBtn').onclick = () => Outbox.openDialog();
  const mq = window.matchMedia?.('(prefers-color-scheme: dark)');
  mq?.addEventListener?.('change', () => { if (Theme.current() === 'auto') document.dispatchEvent(new CustomEvent('themechange')); });
  await seedDemoIfNeeded();
  if (CONFIG.FORM.alwaysStartOnForm && location.hash !== '#/form') history.replaceState(null, '', location.pathname + location.search + '#/form');
  window.addEventListener('hashchange', () => Router.handle());
  Router.handle();
  Conn.check(); Outbox.render();
  window.addEventListener('online', () => { Conn.check(); Outbox.flush(); });
  window.addEventListener('offline', () => { if (DataService.mode === 'gas') Conn.set('offline', 'ออฟไลน์'); Toast.show('การเชื่อมต่ออินเทอร์เน็ตขาดหาย ข้อมูลที่บันทึกจะเข้าคิวรอส่ง', 'warn'); });
  setInterval(() => Outbox.flush(), CONFIG.API.outboxRetryMs);
  const touch = debounce(() => Session.touch(), 3000);
  ['click', 'keydown'].forEach(ev => document.addEventListener(ev, touch, { passive: true }));
}

/* เปิดให้ทดสอบ/เชื่อมต่อจากภายนอก (เช่น console, ชุดทดสอบ, สคริปต์สร้าง Excel Template) */
window.APP = { CONFIG, SCHEMA, OPTIONS, FIELDS, FIELD_ORDER, RESP_ORDER, CONSENT_ORDER, DEMO_VARS, PUBLIC_BANDS, dataDictionary, generateSampleData, normalizeRecord, validateRecord, crossWarnings, Scoring, toPublicRow, DataService, LocalDB };

if (document.getElementById('app')) { if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot(); }
</script>
